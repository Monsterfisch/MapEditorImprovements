options:
- display: GroupBox
  category: [Map Editor Improvements]
  header: '{{counts_group}}'
  text: '{{counts_group_descr}}'
  hasHeader: true
  children:
  - url: map-editor-improvements.counts.enabled
    name: map-editor-improvements-counts-enabled
    text: '{{counts_enabled}}'
    tooltip: '{{counts_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: map-editor-improvements.counts.shown
    name: map-editor-improvements-counts-shown
    text: '{{counts_shown}}'
    tooltip: '{{counts_shown_tooltip}}'
    display: Switch
    contents:
