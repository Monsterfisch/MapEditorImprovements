menu_group: Editormenü
menu_group_descr: |-
  Wie das Menü des Editors am unteren Bildschirmrand gezeichnet wird.
menu_dust_clouds: Staubwolken können das Spiel nicht zum Absturz bringen
menu_dust_clouds_tooltip: |-
  Eine Staubwolke mit verlorenen Bewegungsdaten führte zu einer Division durch null und ließ das Spiel abstürzen. Mit dieser Option bleibt eine solche Wolke stattdessen einfach stehen.
menu_always_update: Menü immer aktuell halten
menu_always_update_tooltip: |-
  Das Spiel zeichnet das Menü nur neu, solange die Maus darüber liegt. Änderungen von außerhalb, etwa durch eine Taste zur Werkzeugwahl oder aktualisierte Zähler beim Platzieren von Tieren, erscheinen sonst erst beim Zurückbewegen der Maus. Mit dieser Option wird das Menü im Karteneditor laufend neu gezeichnet.
castle_all_players: Alle acht Spielerwappen auf jeder Karte
castle_all_players_tooltip: |-
  Die Wappen neben der Minikarte zeigen auf jedem Kartentyp alle acht Spieler, nicht nur auf Mehrspielerkarten.
castle_all_keeps: Herrenhaus und Festung auf jeder Karte
castle_all_keeps_tooltip: |-
  Das Bergfried-Menü bietet Herrenhaus und Festung auch auf Mehrspielerkarten an.
castle_player_zero: Wappen für Spieler 0
castle_player_zero_tooltip: |-
  Ein weißes neuntes Wappen in der Mitte der Spielerwappen wählt Spieler 0, der ebenfalls Gebäude und Einheiten auf einer Karte besitzen kann.
castle_keep_crests: Aktive Bergfried-Wappen
castle_keep_crests_tooltip: |-
  Jeder Bergfried zeigt das Wappen seines Besitzers über sich; der aktive Bergfried des Spielers (an dem Lord, Starteinheiten und neue Bauern erscheinen) zeigt es eingerahmt. Ein Klick auf ein Wappen macht diesen Bergfried aktiv, ein Klick auf den aktiven lässt den Spieler ohne aktiven Bergfried. Ein neuer Bergfried übernimmt nicht mehr automatisch die aktive Rolle; wird der aktive entfernt, übernimmt ein anderer Bergfried des Spielers. Das Haupt-Vorratslager folgt stets dem aktiven Bergfried (das Spiel behielt sonst das allererste Vorratslager, wodurch die KI bei mehreren Bergfrieden ihren Bauplatz blockiert fand und keinen Burgplan baute). Erfordert „Mehrere Bergfriede pro Spieler“.
castle_keep_crest_tooltip: Hinweis auf Bergfried-Wappen
castle_keep_crest_tooltip_tooltip: |-
  Überfahren eines Bergfried-Wappens mit der Maus erklärt seine Bedeutung und die Wirkung eines Klicks. Erfordert „Aktive Bergfried-Wappen“.
castle_wall_tools: Mauerhöhen und freie Zinnen
castle_wall_tools_tooltip: |-
  Zinnen können frei stehen. Ihre Leiste bietet Niedrig, Hoch, Niedrig beschädigt und Hoch beschädigt. Ein Regler über dem Mauermenü stellt die Höhe hoher Mauern, niedriger Mauern und Zinnen (0–255) sowie die Steilheit von Treppen (0–16) einzeln ein; „Zurücksetzen“ daneben stellt den üblichen Wert für die gewählte Art wieder her, und beim Verlassen des Karteneditors werden alle zurückgesetzt.
trees_spread_order: Bäume nach Ausbreitungsboden ordnen
trees_spread_order_tooltip: |-
  Im Vegetationsmenü stehen zuerst die Bäume, die sich auf fruchtbarem Boden ausbreiten (Oasengras, dichtes und dünnes Gestrüpp), danach der Baum für unfruchtbaren Boden (Erde, steinige Erde, Dünen): der dritte und vierte Baum tauschen den Platz.
trees_spread_outlines: Rahmen für Ausbreitungsboden
trees_spread_outlines_tooltip: |-
  Ein dünner grüner Rahmen um die Bäume, die sich auf fruchtbarem Boden ausbreiten, und ein dünner beiger Rahmen um den Baum für unfruchtbaren Boden. Der Apfelbaum breitet sich nicht aus und erhält keinen Rahmen.
herds_bird_bins: Schaltflächen „Alle Krähen / Möwen löschen“
herds_bird_bins_tooltip: |-
  Rote Papierkorb-Schaltflächen rechts neben der Krähen- und der Möwen-Schaltfläche im Tiere-Menü: Ein Klick entfernt alle Krähen (die Bäume bleiben) oder alle Möwen von der Karte.
herds_animal_bin: Schaltfläche „Alle Tiere löschen“
herds_animal_bin_tooltip: |-
  Eine rote Papierkorb-Schaltfläche rechts im Tiere-Menü, die wie Alt + E alle Tiere von der Karte entfernt. Krähen und Möwen bleiben.
herds_group_warning: Warnung für Herden und Gruppen
herds_group_warning_tooltip: |-
  Wenn weniger als 200 Herden und Gruppen noch erstellt werden können, zeigt eine Zeile am oberen Bildschirmrand an, wie viele noch frei sind – wie die spielinterne Zeile für Einheiten.
eraser_choice: Auswahlleiste für den Radierer
eraser_choice_tooltip: |-
  Ist der Radierer gewählt, bestimmt eine Leiste über dem Menü, was er entfernt: Alles (wie bisher), Tiere (auch Krähen und Möwen), Einheiten, Gebäude (mit Bergfrieden, Ruinen und Mauern), Vegetation oder Felsen (auch unsichtbare Felsen).
eraser_seagulls: Radierer entfernt Möwen
eraser_seagulls_tooltip: |-
  Der Radierer entfernt auch Möwen, die über den radierten Feldern fliegen (bei „Alles“ oder „Tiere“).
map_settings_show_locked: Kontrollkästchen „Gesperrte Karten anzeigen“
map_settings_show_locked_tooltip: |-
  Ein Kontrollkästchen „Gesperrte Karten anzeigen“ im Laden-Dialog des Editors. Angehakt werden auch gesperrte Karten aufgelistet; die Liste aktualisiert sich sofort.
map_settings_button: Schaltfläche „Karteneinstellungen“
map_settings_button_tooltip: |-
  Eine Schaltfläche „Karteneinstellungen“ im Kartenmenü, rechts neben Ausgeglichen/Unausgeglichen und Invasion/Wirtschaft. Sie öffnet das Menü von Alt + ,.
map_settings_menu: Größeres Menü „Karteneinstellungen“
map_settings_menu_tooltip: |-
  Das Menü von Alt + , erhält einen Titel, Einzelspieler und Mehrspieler, die vier Einzelspieler-Kartentypen (Belagerung, Invasion, Wirtschaft, Freies Bauen), die vier Kartengrößen plus Benutzerdefiniert und einen Regler für die Kartengröße (10 bis 400; die Größe wird beim Loslassen übernommen), Ausgeglichen, König des Hügels, Karte sperren und eine Zurück-Schaltfläche.
eraser_group: Radierer
eraser_group_descr: |-
  Was der Radierer des Landschaftseditors entfernt.
map_settings_group: Karteneinstellungen
map_settings_group_descr: |-
  Die Einstellungen der Karte: Kartentyp, Größe, Sperre und die zugehörigen Menüs.
