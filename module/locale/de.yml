castle_buildings_group: Burggebäude
castle_buildings_group_descr: Gebäude im Burgmodus platzieren.
keeps_group: Bergfriede und Lager
keeps_group_descr: Bergfriede, Lager und Rekrutierungsgebäude im Burgmodus einrichten.
players_group: Spieler
players_group_descr: Spieler, Farben und Bergfriedtypen im Burgmodus wählen.
fortifications_group: Mauern und Gräben
fortifications_group_descr: Mauern, Treppen und Gräben im Burgmodus platzieren.
tree_brush_group: Pflanzen und Pinsel
tree_brush_group_descr: Festlegen, wie der Vegetationspinsel im Landschaftsmodus pflanzt.
tree_spread_group: Baumausbreitung
tree_spread_group_descr: Im Vegetationsmenü zeigen, auf welchem Boden sich jeder Baum ausbreitet.
