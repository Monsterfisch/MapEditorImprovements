menu_group: Editorverhalten
menu_group_descr: Steuert Anzeige- und Neuzeichnungsverhalten des Editors.
menu_compass: Norden im Editor anzeigen
menu_compass_tooltip: Lies Norden am festen Kompass oben links ab. Sind die Pfeile zum Rückgängigmachen und Wiederholen aktiv, steht der Kompass darunter.
menu_compass_turn: Ctrl kehrt die Kartendrehung um
menu_compass_turn_tooltip: Öffne das Ringmenü per Rechtsklick. Halte Ctrl gedrückt und zeige auf den Kompass, um gegen den Uhrzeigersinn zu drehen.
menu_dust_clouds: Staubwolken-Abstürze verhindern
menu_dust_clouds_tooltip: Verhindert Abstürze durch Staubwolken beim Bearbeiten der Karte.
menu_always_update: Editorleiste während der Arbeit aktualisieren
menu_always_update_tooltip: Hält die Editor-Steuerelemente aktuell, während der Mauszeiger über der Karte steht.
castle_all_players: Alle acht Spielerwappen anzeigen
castle_all_players_tooltip: Wähle im Burgmodus eines der acht Wappen neben der Minikarte.
castle_all_keeps: Herrenhaus und Bollwerk auf jeder Karte
castle_all_keeps_tooltip: Wähle auf jedem Kartentyp das Herrenhaus oder Bollwerk unter „Bergfriede“.
castle_player_zero: Neutrales Spielerwappen anzeigen
castle_player_zero_tooltip: Klicke auf das neunte weiße Wappen neben der Minikarte, um Objekte für Spieler 0 zu platzieren.
castle_keep_ground: Gelände beim Platzieren von Bergfrieden bewahren
castle_keep_ground_tooltip: Platziert Bergfriede, ohne den Boden darunter einzuebnen.
castle_rotation: Liste für die Gebäudedrehung
castle_rotation_tooltip: Klicke im Burgmodus direkt über dem unteren linken Menü auf „Rotation“ und wähle einen Winkel, bevor du ein unterstütztes Gebäude platzierst.
castle_unit_colour: Einheitenfarben getrennt vom Besitzer wählen
castle_unit_colour_tooltip: Wähle ein Wappen über dem europäischen oder arabischen Einheitenmenü, um das Aussehen der Einheit zu ändern.
castle_keep_crests: Aktiven Bergfried über sein Wappen wählen
castle_keep_crests_tooltip: Klicke bei mehreren Bergfrieden auf ein Wappen, um den aktiven Bergfried zu wählen oder die Auswahl aufzuheben. Die Hinweise am Mauszeiger sind standardmäßig aktiv.
castle_wall_tools: Mauerhöhen und freistehende Zinnen
castle_wall_tools_tooltip: Wähle Mauern oder Treppen und nutze die Regler über dem Menü. Ein Klick auf „Reset“ daneben stellt Standardwerte her.
trees_spread_order: Bäume nach geeignetem Boden gruppieren
trees_spread_order_tooltip: Gruppiert Bäume unter Vegetation nach dem Boden, auf dem sie sich ausbreiten. Sträucher erhalten standardmäßig eine eigene Zeile.
trees_spread_outlines: Geeigneten Boden für die Ausbreitung markieren
trees_spread_outlines_tooltip: Grün markiert unter Vegetation Bäume für fruchtbaren Boden, Beige solche für unfruchtbaren Boden.
herds_bird_bins: Alle Krähen oder Möwen entfernen
herds_bird_bins_tooltip: Klicke unter Tiere auf den Papierkorb neben dem Krähen- oder Möwensymbol, um diese Vogelart zu entfernen.
herds_group_warning: Nahe am Herdenlimit warnen
herds_group_warning_tooltip: Zeigt die verbleibenden Plätze an, wenn Herden und Truppengruppen sich dem Kartenlimit nähern.
eraser_choice: Auswählen, was der Radierer entfernt
eraser_choice_tooltip: Wähle den Radierer und dann über dem Menü Alles, Tiere, Einheiten, Gebäude, Vegetation oder Felsen.
eraser_seagulls: Fliegende Möwen entfernen
eraser_seagulls_tooltip: Nutze den Radierer, um fliegende Möwen zu entfernen. Bei aktiven Radiermodi wähle Tiere oder Alles.
map_settings_show_locked: Gesperrte Karten unter Laden anzeigen
map_settings_show_locked_tooltip: Setze unter Laden im Editor den Haken bei „Show locked maps“ unterhalb der Dateiliste.
map_settings_menu: Erweiterte Karteneinstellungen
map_settings_menu_tooltip: Drücke im Editor „Alt+,“. Ziehe den Regler „Map size“ und lass ihn los, um die Größe zu übernehmen. Die Schaltfläche „Map Settings“ über „Zur Karte“ ist standardmäßig aktiv.
map_settings_size_refresh: Kleinere Karten sofort anwenden
map_settings_size_refresh_tooltip: Wendet beim Bearbeiten sofort eine kleinere Kartengröße an und zeigt die neuen Ränder direkt.
map_settings_camera_edge: Vollen Kartenrand anzeigen
map_settings_camera_edge_tooltip: Bewege die Kamera an den Rand, um die äußersten Kartenfelder zu sehen.
eraser_group: Radierer
eraser_group_descr: Legt fest, was der Landschaftsradierer entfernt.
map_settings_group: Karteneinstellungen
map_settings_group_descr: Kartentyp, Größe und Schalter ändern oder gesperrte Karten durchsuchen.
qol: Komfort
