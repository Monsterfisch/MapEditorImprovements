counts_group: Kartenzähler
counts_group_descr: Zeigt, wie nah die Karte an ihren Objektlimits liegt.
counts_enabled: Kartenobjekt-Zähler
counts_enabled_tooltip: Klicke auf das rote i über der Schaltfläche mit dem Schlüssel und zeige dann auf „Tier bearbeiten“, „Vegetation bearbeiten“, „Felsen“ oder ein Werkzeug darin.
trees_group: Bäume und Sträucher
trees_group_descr: Vegetation im Landschaftsmodus platzieren und ordnen.
trees_growth: Pinselgröße bestimmt Baumwachstum
trees_growth_tooltip: Wähle unter „Vegetation bearbeiten“ einen Baum und die Pinselgröße. Größe 4 setzt ausgewachsene Bäume, Größe 6 und 7 setzen tote Bäume.
trees_apple: Apfelbaum unter Vegetation
trees_apple_tooltip: Wähle vor dem Pflanzen den Apfelbaum unter Vegetation.
trees_shrubs: Strauchfarben
trees_shrubs_tooltip: Wähle einen Strauch unter Vegetation und dann eine Farbe in der Zeile über dem Menü.
trees_felled: Varianten für gefällte Bäume
trees_felled_tooltip: Wähle einen Baum unter Vegetation und dann die gefällte Variante nach Stammzahl über dem Menü.
trees_random_mix: Zufälliger Vegetationsmix
trees_random_mix_tooltip: Klicke auf das ? in der Reihe der Strauch- oder Baumvarianten. Ein weiterer Klick oder die Wahl einer anderen Variante beendet die Zufallsauswahl.
trees_obstacles: Bäume neben Hindernissen
trees_obstacles_tooltip: Setze den oberen Haken rechts bei Vegetation, um Bäume direkt neben Hindernissen zu pflanzen.
trees_rocks_and_water: Vegetation auf Felsen und Wasser
trees_rocks_and_water_tooltip: Setze den unteren Haken rechts bei Vegetation, um auf Felsen und Wasser zu pflanzen.
trees_preview: Vegetation als Vorschau am Mauszeiger anzeigen
trees_preview_tooltip: Zeige bei normalem Zoom auf die Karte, um den gewählten Baum oder Strauch als Vorschau zu sehen.
trees_no_stacking: Gestapelte Vegetation verhindern
trees_no_stacking_tooltip: Verhindert mehrere Pflanzen auf demselben Feld. Bereits übereinanderliegende Pflanzen kannst du mit dem Radierer entfernen.
textures_group: Bodentexturen
textures_group_descr: Lege fest, wie der Pinsel im Landschaftseditor Bodentexturen aufträgt.
textures_gravel_and_iron: Kies und Eisen unter Texturen
textures_gravel_and_iron_tooltip: Wähle Kies oder Eisen unter Texturen und male sie auf die Karte.
textures_mask: Nur die Starttextur übermalen
textures_mask_tooltip: Klicke oben links auf das halb gefüllte Quadrat und beginne jeden Strich auf der zu ersetzenden Textur.
textures_mask_by_type: Wasservarianten als eine Textur behandeln
textures_mask_by_type_tooltip: Bei aktiver Maske über Varianten der gewählten Meer-, Fluss- oder Furttextur hinweg malen.
water_group: Wasser
water_group_descr: Flussdetails im Landschaftsmodus malen.
water_decorations: Schaum und kleine Wellen im Wassermenü
water_decorations_tooltip: Wähle im Wassermenü Schaum oder kleine Wellen und male sie auf Flussfelder.
water_foam_on_sea: Meerfelder in schäumenden Fluss verwandeln
water_foam_on_sea_tooltip: Male Schaum aus dem Wassermenü auf Meerfelder, um daraus Flussfelder zu machen.
rocks_group: Felsen
rocks_group_descr: Felsen im Landschaftsmodus platzieren, drehen und entfernen.
rocks_signpost: Wegweiser auf Gefechtskarten
rocks_signpost_tooltip: Öffne Felsen auf einer Gefechtskarte und wähle den Wegweiser.
rocks_random_preview: Felsen bei jedem Platzieren zufällig drehen
rocks_random_preview_tooltip: Wähle unter Landschaft → Felsen eine Größe und klicke auf Zufällige Drehung. Die Vorschau wechselt nach jedem Platzierungsversuch den Winkel.
rocks_variants: Felsenvariante wählen
rocks_variants_tooltip: Wähle eine Felsengröße und klicke auf eine Variante über Felsen. Die kleinste Größe bietet standardmäßig einen fünften Felsen.
rocks_invisible: Unsichtbare Felsen platzieren
rocks_invisible_tooltip: Setze vor dem Platzieren den Haken rechts neben Felsen. Unsichtbare Felsen blockieren Bewegung und Bau.
rocks_erase_invisible: Unsichtbare Felsen entfernen
rocks_erase_invisible_tooltip: Nutze den Landschaftsradierer, um durch unsichtbare Felsen blockierte Felder freizuräumen.
rocks_remove_lost: Verlorene Felseneinträge bereinigen
rocks_remove_lost_tooltip: Klicke unten rechts bei Felsen auf „Remove lost rocks“, um Plätze freizugeben, ohne Felder zu ändern.
heights_group: Höhen
heights_group_descr: Gelände im Landschaftsmodus formen.
heights_max_height: Maximalhöhe unter Höhen
heights_max_height_tooltip: Wähle „Max Height“ neben „Min. Höhe“, um den Boden unter dem Pinsel auf die maximale Höhe anzuheben.
heights_tool_options: Höhenpinsel-Regler
heights_tool_options_tooltip: Wähle ein Höhenwerkzeug, um Pinselbereich, Stärke, Geländeschutz und Felsenbehandlung über dem Menü einzustellen.
heights_invert_key: „Ebnen“ per Tastendruck umkehren
heights_invert_key_tooltip: Wähle „Ebnen“. Halte die Taste gedrückt, um den Boden aufzurauen, und lass sie los, um wieder zu glätten.
castle_building_counts: Gebäudezähler über der Minikarte
castle_building_counts_tooltip: Lies die Gebäudezahlen im Burgmodus über der Minikarte ab. Hinweise unter dem Mauszeiger weichen standardmäßig zur Seite aus.
castle_tower_ruins: Turmruinen
castle_tower_ruins_tooltip: Wähle eine Ruine in der Variantenzeile über Türme.
castle_tunnel_and_tents: Tunneleingang und Belagerungszelte
castle_tunnel_and_tents_tooltip: Wähle die Tunnelgräber- oder Baumeistergilde. Wähle dann über dem Menü den Tunneleingang oder ein Belagerungszelt.
castle_statues: Zusätzliche Statue und Schreine
castle_statues_tooltip: Wähle eine Statue oder einen Schrein und dessen Variante über dem Menü. Die zusätzlichen Objekte findest du auch unter „Gärten und andere Freuden“.
castle_barrier: Barriere unter Ruinen
castle_barrier_tooltip: Die Barriere findest du unten rechts unter Ruinen.
castle_several_keeps: Mehrere Bergfriede pro Spieler
castle_several_keeps_tooltip: Platziere zusätzliche Bergfriede normal. Mit aktiven Bergfried-Wappen wählst du per Klick den aktiven Bergfried.
castle_several_storage: Mehrere Lager- und Rekrutierungsgebäude
castle_several_storage_tooltip: Platziere zusätzliche Lager- und Rekrutierungsgebäude normal. Getrennte Vorratslager können ändern, welche Rohstoffe in der Nähe verfügbar sind.
castle_tower_engines: Turmgeschütze auf begehbaren Feldern platzieren
castle_tower_engines_tooltip: Wähle unter „Armeegebäude“ ein Turmgeschütz und platziere es auf einem begehbaren Feld.
castle_keep_parts: Teile eines Bergfrieds platzieren
castle_keep_parts_tooltip: Wähle einen Bergfried und klicke in der Zeile über Bergfriede auf „Keep only“ oder „No stockpile“.
castle_damaged_walls: Beschädigte Mauern oder Treppen platzieren
castle_damaged_walls_tooltip: Wähle Mauer oder Treppe und klicke vor dem Platzieren über dem Baumenü auf „Damaged“.
castle_variant_panels: Gebäudevariante wählen
castle_variant_panels_tooltip: Wähle ein unterstütztes Gebäude und klicke auf eine Variante in der Zeile über dem Baumenü.
castle_ruined_cathedral: Verfallene Kathedrale platzieren
castle_ruined_cathedral_tooltip: Wähle die Ruinenvariante über dem Baumenü. Sie funktioniert wie eine normale Kathedrale.
castle_moat_kinds: Burggrabentyp wählen
castle_moat_kinds_tooltip: Wähle Burggraben unter Torhäuser und darüber „Dug“, „Planned“ oder „Permanent“.
castle_moat_on_marsh: Burggräben auf Sumpf erlauben
castle_moat_on_marsh_tooltip: Platziere Burggräben auf Sumpf. Beim Zuschütten kehrt der Sumpf darunter zurück.
castle_moat_removal_keeps_ground: Gelände beim Entfernen von Burggräben behalten
castle_moat_removal_keeps_ground_tooltip: Das Entfernen eines Burggrabens stellt den Boden darunter wieder her.
herds_group: Herden
herds_group_descr: Herden und Vögel im Landschaftsmodus verwalten.
herds_panel: Herdengröße und -verhalten
herds_panel_tooltip: Wähle ein Herdentier aus und stelle Größe und Verhalten der Herde im Bedienfeld über dem Tiermenü ein.
brushes_group: Pinsel
brushes_group_descr: Ändert, wie der Editorpinsel Felder abdeckt.
brushes_full_shape: Pinselform korrigieren
brushes_full_shape_tooltip: Füllt die gesamte Pinselvorschau aus, ohne das Werkzeug in der Mitte doppelt anzuwenden.
undo_group: Rückgängig und Wiederherstellen
undo_group_descr: Letzte Bearbeitungen rückgängig machen oder wiederholen.
undo_enabled: Rückgängig und Wiederherstellen
undo_enabled_tooltip: Klicke auf die Pfeile oben links für bis zu 20 Schritte oder belege Rückgängig/Wiederherstellen unter Optionen > Eigene Tastenkürzel.
pipette_group: Pipette
pipette_group_descr: Ein Feld aufnehmen und dessen Inhalt auf der Karte wiederverwenden.
pipette_enabled: Gelände oder Objekte mit der Pipette kopieren
pipette_enabled_tooltip: Klicke auf die Pipette über der Pinselgröße, wähle Höhen, Texturen, Objekte oder Alles, klicke dann ein Quellfeld an und male.
pipette_select_key: Pipetten-Tastenkürzel
pipette_select_key_tooltip: Erneut drücken wechselt den Modus, oder belege Pipette unter Optionen > Eigene Tastenkürzel.
pipette_read_key: Halten, um ein anderes Feld aufzunehmen
pipette_read_key_tooltip: Halte diese Taste gedrückt, während du mit der Pipette ein neues Quellfeld anklickst.
