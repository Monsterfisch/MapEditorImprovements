grid_enabled: Ressourcenraster anzeigen
grid_enabled_tooltip: Drücke im Editor Alt+G oder ändere die Belegung unter Optionen > Eigene Tastenkürzel.
grid_group_descr: Blendet Ressourcenraster, Bergfried-Drehgrenzen oder Eisenminen-Umrisse ein.
herds_animal_bin: Schaltfläche zum Entfernen aller Landtiere (Alt+E)
