menu_group: Szerkesztőmenü
menu_group_descr: |-
  Hogyan rajzolódik ki a képernyő alján lévő szerkesztőmenü.
menu_dust_clouds: A porfelhők nem omlaszthatják össze a játékot
menu_dust_clouds_tooltip: |-
  Az elveszett mozgásadatú porfelhők nullával való osztást és összeomlást okoztak. Bekapcsolva az ilyen porfelhő egyszerűen egy helyben marad.
menu_always_update: A menü mindig maradjon friss
menu_always_update_tooltip: |-
  A játék csak akkor rajzolja újra a menüt, ha az egér felette van. A máshol történt változások — például gyorsbillentyűvel váltott eszköz vagy állatok lerakásakor változó számlálók — csak akkor frissülnek, ha visszaviszed rá az egeret. Bekapcsolva a menü folyamatosan újrarajzolódik a térképszerkesztőben.
castle_all_players: Mind a nyolc játékoscímer minden térképen
castle_all_players_tooltip: |-
  A minitérkép melletti címerek minden térképtípuson mind a nyolc játékost mutatják, nem csak többjátékos térképeken.
castle_all_keeps: Udvarház és erődítmény minden térképen
castle_all_keeps_tooltip: |-
  A vártornyok menüje többjátékos térképeken is felkínálja az udvarházat és az erődítményt.
castle_player_zero: 0. játékos címere
castle_player_zero_tooltip: |-
  Egy fehér kilencedik címer a játékoscímerek közepén a 0. játékost választja ki, aki szintén birtokolhat épületeket és egységeket a térképen.
castle_keep_crests: Aktív vártorony-címerek
castle_keep_crests_tooltip: |-
  Minden vártorony felett látható a tulajdonosa címere; a játékos aktív vártornyán (ahol a lord, a kezdőegységek és az új parasztok megjelennek) kerettel. Kattints egy címerre a vártorony aktiválásához, vagy az aktívra, hogy ne legyen aktív vártornya a játékosnak. Az új vártorony nem veszi át automatikusan az aktív szerepet, és ha az aktívat törlik, a játékos egy másik vártornya veszi át. A fő raktár mindig követi az aktív vártornyot (különben a játék az elsőként lerakott raktárat őrizte meg, így több vártoronynál az MI blokkolva találta a várhelyét és nem épített terv szerint). A „Több vártorony játékosonként” opciót igényli.
castle_keep_crest_tooltip: Vártorony-címer tippje
castle_keep_crest_tooltip_tooltip: |-
  Vártorony címerére mutatva megjeleníti a jelentését és a kattintás hatását. Az „Aktív vártorony-címerek” opciót igényli.
castle_wall_tools: Falmagasságok és szabad pártázatok
castle_wall_tools_tooltip: |-
  A pártázatok önállóan is megállnak. Paneljük alacsony, magas, sérült alacsony és sérült magas változatot kínál. A falpanel feletti csúszka külön állítja a magas falak, alacsony falak és pártázatok magasságát (0–255) és a lépcsők meredekségét (0–16); a melletti Visszaállítás visszaadja a kiválasztott alapértékét, a szerkesztőből kilépve pedig mind visszaáll.
trees_spread_order: Fák terjedési sorrendben
trees_spread_order_tooltip: |-
  A Növényzet menüben előbb a termékeny talajon terjedő fák (oázisfű, sűrű és ritka bozót), majd a terméketlen talajon terjedő fa (föld, köves föld, dűnék) következik: a harmadik és negyedik fa helyet cserél.
trees_spread_outlines: Keretek a terjedési talajhoz
trees_spread_outlines_tooltip: |-
  Vékony zöld keret a termékeny talajon terjedő fák körül, és vékony bézs keret a terméketlen talajon terjedő fa körül. Az almafa nem terjed, ezért nincs kerete.
herds_bird_bins: Összes varjú / sirály törlése gombok
herds_bird_bins_tooltip: |-
  Piros kuka gombok a varjú és a sirály gombjától jobbra az Állatok menüben: egy kattintással eltávolítanak minden varjút (a fák maradnak) vagy minden sirályt a térképről.
herds_animal_bin: Összes állat törlése gomb
herds_animal_bin_tooltip: |-
  Piros kuka gomb az Állatok menü jobb oldalán, amely az Alt + E-hez hasonlóan minden állatot töröl a térképről. A varjak és sirályok maradnak.
herds_group_warning: Csordák és csoportok figyelmeztetés
herds_group_warning_tooltip: |-
  Ha 200-nál kevesebb csorda és csoport hozható még létre, a képernyő tetején egy sor jelzi a maradék számot, akárcsak a játék egységsora.
eraser_choice: Radír választópanel
eraser_choice_tooltip: |-
  A radír kiválasztásakor a menü feletti panel meghatározza, mit töröljön: Mind (mint eddig), Állatok (varjak és sirályok is), Egységek, Épületek (vártornyokkal, romokkal és falakkal), Növényzet vagy Sziklák (láthatatlan sziklák is).
eraser_seagulls: A radír törli a sirályokat
eraser_seagulls_tooltip: |-
  A radír a radírozott mezők felett repülő sirályokat is eltávolítja (Mind vagy Állatok módban).
map_settings_show_locked: „Zárolt térképek mutatása” négyzet
map_settings_show_locked_tooltip: |-
  „Zárolt térképek mutatása” jelölőnégyzet a szerkesztő Betöltés ablakában. Bepipálva a zárolt térképek is megjelennek; a lista azonnal frissül.
map_settings_button: Térképbeállítások gomb
map_settings_button_tooltip: |-
  Térképbeállítások gomb a térkép menüképernyőjén, a Kiegyensúlyozott / Kiegyensúlyozatlan és Invázió / Gazdasági gomboktól jobbra. Az Alt + , menüt nyitja meg.
map_settings_menu: Nagyobb Térképbeállítások menü
map_settings_menu_tooltip: |-
  Az Alt + , menü címet, Egyjátékos és Többjátékos választást, a négy egyjátékos térképtípust (Ostrom, Invázió, Gazdasági, Szabad építés), a négy térképméretet plusz Egyénit és egy Térképméret csúszkát (10-től 400-ig; elengedéskor alkalmazódik), Kiegyensúlyozott, Domb királya, Térkép zárolása és Vissza gombot kap.
eraser_group: Radír
eraser_group_descr: |-
  Mit töröljön a tájszerkesztő radírja.
map_settings_group: Térképbeállítások
map_settings_group_descr: |-
  A térkép beállításai: térképtípus, méret, zárolás és az ezeket mutató menük.
