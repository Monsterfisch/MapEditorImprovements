menu_group: Szerkesztő viselkedése
menu_group_descr: A szerkesztő megjelenítési és újrarajzolási viselkedését szabályozza.
menu_compass: Észak megjelenítése a szerkesztőben
menu_compass_tooltip: Olvasd le északot a bal felső rögzített iránytűről (bekapcsolt Visszavonás/Újra alatt).
menu_compass_turn: Ctrl megfordítja a térkép forgatását
menu_compass_turn_tooltip: Nyisd meg a jobb kattintásos gyűrűt, és tartsd lenyomva a Ctrl-t az iránytűre húzva az óramutatóval ellentétes forgatáshoz.
menu_dust_clouds: Porfelhő-összeomlások megelőzése
menu_dust_clouds_tooltip: Megakadályozza a porfelhők okozta összeomlásokat térképszerkesztés közben.
menu_always_update: Szerkesztőpanel frissítése munka közben
menu_always_update_tooltip: Naprakészen tartja a szerkesztő vezérlőit, amíg az egér a térkép felett van.
castle_all_players: Mind a nyolc játékospajzs megjelenítése
castle_all_players_tooltip: Vár módban a minitérkép melletti nyolc pajzs bármelyikét kiválaszthatod.
castle_all_keeps: Udvarház és erőd minden térképen
castle_all_keeps_tooltip: Válaszd az Udvarházat vagy az Erődöt a Vártornyoknál bármilyen térképtípuson.
castle_player_zero: Semleges játékospajzs megjelenítése
castle_player_zero_tooltip: Kattints a minitérkép melletti kilencedik fehér pajzsra, hogy a 0. játékosnak helyezz le objektumokat.
castle_keep_ground: Talaj megőrzése vártorony lerakásakor
castle_keep_ground_tooltip: Vártornyok elhelyezése az alattuk lévő talaj elegyengetése nélkül.
castle_rotation: Épületforgatási lista
castle_rotation_tooltip: Vár módban kattints a „Rotation” gombra közvetlenül a bal alsó menü felett, és válassz szöget a támogatott épület lerakása előtt.
castle_unit_colour: Egységszín választása a tulajdonostól függetlenül
castle_unit_colour_tooltip: Válassz címert az európai vagy arab egységmenü felett az egység színének módosításához.
castle_keep_crests: Aktív vártorony választása a címerével
castle_keep_crests_tooltip: Több vártorony esetén a címerre kattintva kijelölheted a vártornyot, vagy megszüntetheted a kijelölését. Az egérmutatónál megjelenő súgó alapértelmezésben be van kapcsolva.
castle_wall_tools: Falmagasságok és szabadon álló pártázatok
castle_wall_tools_tooltip: Válassz falat vagy lépcsőt, és használd a menü feletti vezérlőket. A melletti „Reset” gombbal alaphelyzetbe állíthatod.
trees_spread_order: Fák csoportosítása terjedési talaj szerint
trees_spread_order_tooltip: A Növényzetben a terjedési talajuk szerint csoportosítja a fákat. A bokrok alapértelmezésben külön sort kapnak.
trees_spread_outlines: Fák terjedési talajának jelölése
trees_spread_outlines_tooltip: A Növényzetben a zöld a termékeny, a bézs a terméketlen talajon terjedő fákat jelöli.
herds_bird_bins: Összes varjú vagy sirály törlése
herds_bird_bins_tooltip: Az Állatoknál kattints a varjú vagy sirály ikon melletti kukára az adott madárfaj eltávolításához.
herds_group_warning: Figyelmeztetés a csordakorlát közelében
herds_group_warning_tooltip: Megmutatja a maradék helyeket, ha a csordák és csapatcsoportok közelítenek a térképkorláthoz.
eraser_choice: Radír által törölt elemek kiválasztása
eraser_choice_tooltip: Válaszd a Radírt, majd a menü felett a Mind, Állatok, Egységek, Épületek, Növényzet vagy Sziklák lehetőséget.
eraser_seagulls: Repülő sirályok törlése
eraser_seagulls_tooltip: Használd a Radírt a repülő sirályok eltávolításához. Bekapcsolt radírmódoknál válaszd az Állatok vagy Mind opciót.
map_settings_show_locked: Zárolt térképek megjelenítése a Betöltésnél
map_settings_show_locked_tooltip: Pipáld be a „Show locked maps” négyzetet a fájllista alatt a szerkesztő Betöltés ablakában.
map_settings_menu: Bővített térképbeállítások
map_settings_menu_tooltip: Nyomd meg az „Alt+,” billentyűkombinációt. Húzd a „Map size” csúszkát, majd engedd el a méret alkalmazásához. A „Map Settings” gomb a „Térképre” fölött alapértelmezés szerint látható.
map_settings_size_refresh: Kisebb térképek azonnali alkalmazása
map_settings_size_refresh_tooltip: Szerkesztés közben azonnal alkalmazza a kisebb térképméretet, és rögtön látszanak az új szélek.
map_settings_camera_edge: Teljes térképszél megjelenítése
map_settings_camera_edge_tooltip: Mozgasd a kamerát a szélre a legkülső térképmezők megtekintéséhez.
eraser_group: Radír
eraser_group_descr: Kiválasztja, mit töröljön a tájradír.
map_settings_group: Térképbeállítások
map_settings_group_descr: Térképtípus, méretek és jelölők módosítása vagy zárolt térképek böngészése.
