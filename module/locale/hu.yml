counts_group: Térképszámlálók
counts_group_descr: Megmutatja, milyen közel van a térkép az objektumkorlátaihoz.
counts_enabled: Térképobjektum-számlálók
counts_enabled_tooltip: Kattints a kulcs gomb feletti piros i-re, majd vidd a kurzort az Állatok, Növényzet, Sziklák vagy azok elemei fölé.
trees_group: Fák és bokrok
trees_group_descr: Növényzet elhelyezése és rendezése Táj módban.
trees_growth: Az ecsetméret állítja a fák növekedését
trees_growth_tooltip: Válassz fát és ecsetméretet a Növényzetnél. A 4-es kifejlett fa, a 6-os és 7-es száraz fát rak le.
trees_apple: Almafa a Növényzetnél
trees_apple_tooltip: Ültetés előtt válaszd ki az almafát a Növényzet menüben.
trees_shrubs: Bokorszínek
trees_shrubs_tooltip: Válassz egy bokrot a Növényzetben, majd válassz színt a menü feletti sorban.
trees_felled: Kivágott fa változatok
trees_felled_tooltip: Válassz fát a Növényzetben, és válaszd ki a kivágott változatot rönkszám szerint a menü felett.
trees_random_mix: Véletlenszerű növényzetkeverés
trees_random_mix_tooltip: Kattints a ? gombra a bokor- vagy faváltozatok sorában a keveréshez. Újabb kattintás vagy másik változat leállítja.
trees_obstacles: Fák akadályok mellé
trees_obstacles_tooltip: Pipáld be a felső négyzetet a Növényzet jobb oldalán, hogy akadályok mellé is ültethess fákat.
trees_rocks_and_water: Növényzet sziklákra és vízre
trees_rocks_and_water_tooltip: Pipáld be az alsó négyzetet a Növényzet jobb oldalán sziklákra és vízre ültetéshez.
trees_preview: Növényzet előnézete a kurzor alatt
trees_preview_tooltip: Normál nagyításnál mutass a térképre a választott fa vagy bokor előnézetéhez.
trees_no_stacking: Egymásra rakott növényzet megakadályozása
trees_no_stacking_tooltip: Megakadályozza a növényzet halmozását egy mezőn, a régi halmokat pedig a radírral törölheted.
textures_group: Talajtextúrák
textures_group_descr: Beállítja, hogyan fest talajtextúrákat a Táj ecset.
textures_gravel_and_iron: Kavics és vas a Textúráknál
textures_gravel_and_iron_tooltip: Válaszd a Kavicsot vagy Vasat a Textúráknál, és fesd a térképre.
textures_mask: Csak a kezdőtextúra átfestése
textures_mask_tooltip: Kattints a bal felső félig kitöltött négyzetre, majd minden húzást a lecserélendő textúrán kezdj.
textures_mask_by_type: Vízváltozatok kezelése egy textúraként
textures_mask_by_type_tooltip: Bekapcsolt maszknál átfest a kezdő tenger-, folyó- vagy gázlótextúra változatai között.
water_group: Víz
water_group_descr: Folyórészletek festése Táj módban.
water_decorations: Hab és kis hullámok a Víznél
water_decorations_tooltip: Válassz Habot vagy Kis hullámokat a Víznél, és fesd őket folyómezőkre.
water_foam_on_sea: Tengermezők átalakítása habzó folyóvá
water_foam_on_sea_tooltip: Fess Habot a Víz menüből tengermezőkre, hogy folyóvá váljanak.
rocks_group: Sziklák
rocks_group_descr: Sziklák elhelyezése, forgatása és törlése Táj módban.
rocks_signpost: Útjelző tábla csetepaté-térképeken
rocks_signpost_tooltip: Nyisd meg a Sziklákat csetepaté-térképen, és válaszd az Útjelző táblát.
rocks_random_preview: Véletlen sziklaszög minden elhelyezésnél
rocks_random_preview_tooltip: A Táj → Sziklák alatt válassz méretet, majd kattints a Véletlen forgatásra. Minden kísérlet után új szöget kap az előnézet.
rocks_variants: Sziklaváltozat választása
rocks_variants_tooltip: Válassz sziklaméretet, majd kattints egy változatra a Sziklák felett. A legkisebb méret alapértelmezésben ötödik sziklát is kínál.
rocks_invisible: Láthatatlan sziklák elhelyezése
rocks_invisible_tooltip: Elhelyezés előtt pipáld be a Sziklák jobb oldalán lévő négyzetet. A láthatatlan sziklák blokkolják a mozgást és az építést.
rocks_erase_invisible: Láthatatlan sziklák törlése
rocks_erase_invisible_tooltip: A tájradírral megtisztíthatod a láthatatlan sziklák által blokkolt mezőket.
rocks_remove_lost: Elveszett sziklabejegyzések törlése
rocks_remove_lost_tooltip: Kattints a Sziklák jobb alsó részén a „Remove lost rocks” gombra, hogy mezők módosítása nélkül szabadíts fel helyet.
heights_group: Magasságok
heights_group_descr: Terep formálása Táj módban.
heights_max_height: Max. magasság a Magasságoknál
heights_max_height_tooltip: Válaszd a „Max Height” gombot a Min. magasság mellett, hogy az ecset alatt maximálisra emeld a talajt.
heights_tool_options: Magasságecset vezérlői
heights_tool_options_tooltip: Válassz egy Magasságok eszközt a tartomány, erősség, terepvédelem és sziklakezelés beállításához a menü felett.
heights_invert_key: Lenyomva tartva megfordítja a Kiegyenlítést
heights_invert_key_tooltip: A Kiegyenlítés eszköznél tartsd lenyomva ezt a billentyűt a terep érdesítéséhez, majd engedd fel, ha ismét simítani szeretnél.
castle_building_counts: Épületszámlálók a minitérkép felett
castle_building_counts_tooltip: Vár módban mutatja az épületszámlálókat a minitérkép felett. A lebegő szöveg alapértelmezésben félreáll.
castle_tower_ruins: Toronyromok
castle_tower_ruins_tooltip: Válassz romot a Tornyok feletti változatsorban.
castle_tunnel_and_tents: Alagútbejárat és ostromsátrak
castle_tunnel_and_tents_tooltip: Válaszd az alagútásók vagy mérnökök céhét, és válassz bejáratot vagy sátrat a menü felett.
castle_statues: Extra szobor és szentélyek
castle_statues_tooltip: Válassz szobrot vagy szentélyt és változatát a menü felett, vagy keresd az extrákat a Jó dolgok között.
castle_barrier: Akadály a Romoknál
castle_barrier_tooltip: Az Akadályt a Romok jobb alsó részén találod.
castle_several_keeps: Több vártorony játékosonként
castle_several_keeps_tooltip: Helyezz le extra vártornyokat a szokásos módon. Bekapcsolt címereknél címerre kattintva válthatsz aktív vártornyot.
castle_several_storage: Több raktár- és toborzóépület
castle_several_storage_tooltip: Helyezz le extra raktár- és toborzóépületeket a szokásos módon. A külön raktárak megváltoztathatják a közelben elérhető nyersanyagokat.
castle_tower_engines: Toronygépek elhelyezése járható mezőkön
castle_tower_engines_tooltip: Válassz toronygépet a Katonai épületeknél, és helyezd bármely járható mezőre.
castle_keep_parts: Vártorony részeinek elhelyezése
castle_keep_parts_tooltip: Válassz vártornyot, majd a Vártornyok feletti sorban válaszd a „Keep only” vagy „No stockpile” opciót.
castle_damaged_walls: Sérült falak vagy lépcsők elhelyezése
castle_damaged_walls_tooltip: Válassz falat vagy lépcsőt, és elhelyezés előtt kattints a „Damaged” gombra az épületmenü felett.
castle_variant_panels: Épületváltozat választása
castle_variant_panels_tooltip: Válassz egy támogatott épületet, majd kattints egy változatra az épületmenü feletti sorban.
castle_ruined_cathedral: Romos kinézetű katedrális elhelyezése
castle_ruined_cathedral_tooltip: Válaszd a romos változatot az épületmenü felett. Normál katedrálisként működik.
castle_moat_kinds: Várárok típusának választása
castle_moat_kinds_tooltip: Válaszd a Várárkot a Kapuházaknál, majd felette a „Dug”, „Planned” vagy „Permanent” típust.
castle_moat_on_marsh: Várárok engedélyezése mocsáron
castle_moat_on_marsh_tooltip: Helyezz várárkot mocsárra. A feltöltése visszaállítja alatta a mocsarat.
castle_moat_removal_keeps_ground: Talaj megőrzése várárok törlésekor
castle_moat_removal_keeps_ground_tooltip: A várárok eltávolítása visszaadja az alatta lévő eredeti talajt.
herds_group: Csordák
herds_group_descr: Csordák és madarak kezelése Táj módban.
herds_panel: Csordaméret és viselkedés
herds_panel_tooltip: Válassz ki egy csordában élő állatfajt, majd az Állatok feletti panelen állítsd be a csorda létszámát és viselkedését.
brushes_group: Ecsetek
brushes_group_descr: Módosítja, hogyan fedi le a mezőket a szerkesztő ecsete.
brushes_full_shape: Ecset alakjának javítása
brushes_full_shape_tooltip: Kitölti a teljes ecsetelőnézetet anélkül, hogy középen kétszer alkalmazná az eszközt.
undo_group: Visszavonás és újra
undo_group_descr: Lépés vissza és előre a legutóbbi szerkesztések között.
undo_enabled: Visszavonás és újra
undo_enabled_tooltip: Kattints a bal felső nyilakra akár 20 lépéshez, vagy rendeld hozzá a Visszavonást és Újrát a Beállítások > Egyéni gyorsbillentyűk alatt.
pipette_group: Pipetta
pipette_group_descr: Mintavétel egy mezőről és tartalmának újrahasználata a térképen.
pipette_enabled: Terep vagy objektumok másolása pipettával
pipette_enabled_tooltip: Kattints az ecsetméret feletti pipettára, válassz Magasságok, Textúrák, Objektumok vagy Mind közül, majd kattints egy forrásmezőre és fess.
pipette_select_key: Pipetta gyorsbillentyűje
pipette_select_key_tooltip: Újra megnyomva módot vált, vagy rendeld hozzá a Pipettát a Beállítások > Egyéni gyorsbillentyűk alatt.
pipette_read_key: Lenyomva tartva másik mezőről vesz mintát
pipette_read_key_tooltip: Tartsd lenyomva ezt a billentyűt, amikor a pipettával új forrásmezőre kattintasz.
