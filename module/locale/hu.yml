counts_group: Térképszámlálók
counts_group_descr: |-
  Megmutatja a tájszerkesztőben, hány állat, fa és szikla található a térképen, és mennyire közel vannak a játék korlátaihoz.
counts_enabled: Térképszámlálók megjelenítése
counts_enabled_tooltip: |-
  Vidd az egeret az Állatok, Növényzet vagy Sziklák gombra, hogy tipp mutassa a darabszámot és a játék korlátját, például „Fák és bokrok: 812/1999”. Az Állatok tippje a csordákat és csoportokat is mutatja, amelyeknek saját korlátjuk van.
  Az Állatok menüben a szarvas, teve, nyúl és oroszlán gombokon látható a darabszámuk; a Növényzet menüben minden fa- és bokorgombon szerepel az adott növény száma.
  A kulcs gomb feletti piros „i” gomb munka közben is ki- és bekapcsolja ezt.
counts_shown: Számok megjelenítése a szerkesztő megnyitásakor
counts_shown_tooltip: |-
  Ki: a számok alapból rejtve indulnak, és az „i” gombbal jeleníthetők meg.
trees_group: Fák és bokrok
trees_group_descr: |-
  Több választási lehetőség növényzet elhelyezésekor a tájszerkesztőben.
trees_growth: Az ecsetméret állítja a fa növekedési fokozatát
trees_growth_tooltip: |-
  A fák az ecsetméretnek megfelelő növekedési fokozatban kerülnek le: az 1-es ecset a legkisebb fákat helyezi le, a 4-es a kifejletteket (amit a szerkesztő egyébként mindig lerak), az 5-ös olyan kifejlett fákat, amelyeket a favágók egy ideig békén hagynak, a 6-os és 7-es pedig elszáradt fákat (a 7-es hamarabb elkorhad). A bokrokra nincs hatással.
trees_apple: Almafa gomb
trees_apple_tooltip: |-
  Almafát ad a Növényzet menühöz. A képe az images/apple.png (valamint apple_hover.png és apple_selected.png) a modul mappájában; cseréld le őket, ha módosítani szeretnéd.
trees_shrubs: Több bokor
trees_shrubs_tooltip: |-
  Amikor a négy további színnel rendelkező bokor van kiválasztva, a Növényzet menü feletti sor mind az öt színt felkínálja.
trees_felled: Kidöntött fák
trees_felled_tooltip: |-
  Fa kiválasztásakor a Növényzet menü feletti sor felkínálja a fát állva (elsőként) és kidöntve, minden lehetséges rönkszámmal (kifejlett fánál 9-től 1-ig; a legkisebb fák 1 rönkkel dőlnek ki). Kattints egyre kidöntött fák lerakásához; kattints az álló fára, újra a kidöntöttre vagy a menübeli fára az álló fákhoz való visszatéréshez.
trees_random_mix: Véletlen keverékek a fasorokban
trees_random_mix_tooltip: |-
  „?” jelű gombokat ad a Növényzet menü feletti sorokhoz:
  - Véletlen fa (első a kidöntött fák sorában): a legkisebbtől az ecset méretéig minden növekedési fokozat véletlenszerűen keverve. A legkisebb és az elszáradt fáknál nem elérhető.
  - Véletlen kidöntött fa (utolsó a kidöntött fák sorában): kidöntött fák véletlen rönkszámmal.
  - Véletlen bokor (utolsó a bokrok sorában): az öt bokorszín véletlenszerű keveréke.
  Kattints újra, vagy válassz másik gombot a keverés leállításához.
trees_obstacles: Jelölőnégyzet akadályok melletti fákhoz
trees_obstacles_tooltip: |-
  Jelölőnégyzetet ad a Növényzet menü felső sorához. Bepipálva a fák közvetlenül épületek, sziklák, falak és más fák mellé is helyezhetők, amitől a játék egyébként távol tartja őket (bokrok eleve állhatnak ott). Mutass rá az állapot megtekintéséhez.
trees_rocks_and_water: Jelölőnégyzet sziklákra és vízre kerülő növényzethez
trees_rocks_and_water_tooltip: |-
  Jelölőnégyzet a Növényzet menü jobb oldalán, az akadályok melletti fáké alatt (kezdetben kikapcsolva). Bepipálva fák és bokrok mocsárra, folyóra, gázlóra, sziklás talajra, sziklatömbökre és kavicsra is helyezhetők.
trees_sorted_rows: A Növényzet menü sorainak rendezése
trees_sorted_rows_tooltip: |-
  Átteszi a felső sorból a bokrot az alsó sorba, és rendezi az alsó sor bokrait, így felül a fák (az almafával és a jelölőnégyzettel), alul pedig az összes bokor szerepel.
trees_preview: Fa-előnézet
trees_preview_tooltip: |-
  Fa vagy bokor kiválasztásakor az egér alatti mezőn megjelenik a lehelyezendő fa az ecset szerinti fokozatban (vagy kidöntve a megfelelő rönkszámmal), pontosan úgy, ahogy a játék kirajzolja. Kicsinyített nézetben nem látszik.
trees_no_stacking: Ne halmozódjanak a bokrok
trees_no_stacking_tooltip: |-
  Többé nem helyezhető fa vagy bokor olyan mezőre, amelyen már van egy. Egyes bokrok (a felső sor bokra és a mellé rendezett négy másik) korábban láthatatlanul egymásra halmozódtak, végleg elfoglalva a fakapacitást. A radír mostantól egy mező összes egymásra halmozott bokrát törli, így a régi halmok is megtisztíthatók.
textures_group: Talajtextúrák
textures_group_descr: |-
  A tájszerkesztő Textúrák menüje.
textures_gravel_and_iron: Kavics és vas a Textúrák menüben
textures_gravel_and_iron_tooltip: |-
  Kaviccsal bővíti a felső sort és vassal az alsót, egyenletesen elosztva mindkét sort. A kavics képe az images/gravel.png (valamint gravel_hover.png és gravel_selected.png).
textures_no_heights_iron: Vas csak a Textúrák menüben
textures_no_heights_iron_tooltip: |-
  Eltávolítja a vas gombot a Magasságok menüből, mivel a Textúrák menüben már van.
textures_mask: Maszk gomb
textures_mask_tooltip: |-
  Maszk gombot (félig kitöltött négyzet) ad a tájszerkesztő menüjének bal felső sarkába. Bekapcsolva a természeti eszközök (magasságok, textúrák, víz, fák és bokrok, sziklák és pipetta) csak azokat a mezőket módosítják, amelyek textúrája megegyezik az először kattintott mezőével; az egérgomb elengedése után a következő kattintás új céltextúrát választ.
textures_mask_by_type: A maszk egynek tekinti a vízvariánsokat
textures_mask_by_type_tooltip: |-
  A maszk csak az azonos textúrájú mezőket engedi át (fű, bozót, sűrű bozót, kövek, part… mind különálló). Bekapcsolva egy víztípus variánsai egynek számítanak: a teljes tenger szélekkel és mély részekkel együtt, a teljes folyó habbal, hullámokkal és vízesésszélekkel, illetve az összes gázló. A tenger, a folyó és a gázló külön marad.
water_group: Víz
water_group_descr: |-
  A tájszerkesztő Víz menüje.
water_decorations: Hab és kis hullámok
water_decorations_tooltip: |-
  Visszahoz két folyódíszt az első Stronghold szerkesztőjéből, amelyet a Crusader még támogat, de gombjai nincsenek hozzá: Hab (fehér tajték és permet, mint vízesés alatt, az ecset alatti minden folyómezőre) és Kis hullámok (az egér alatti egyetlen folyómezőre). Mindkettő csak folyóra tehető és a térképpel mentődik.
water_foam_on_sea: Hab a tengerre is
water_foam_on_sea_tooltip: |-
  A hab tengermezőkre is helyezhető, amelyek ekkor habos folyóvá alakulnak (ha a hab opció be van kapcsolva).
rocks_group: Sziklák
rocks_group_descr: |-
  A tájszerkesztő Sziklák menüje.
rocks_signpost: Útjelző tábla a csetepaté térképek Sziklák menüjében
rocks_signpost_tooltip: |-
  A csetepaté térképek ugyanazt a Sziklák menüt kapják, mint a küldetéstérképek, az útjelző tábla gombbal együtt.
rocks_random_preview: Véletlen forgatás az előnézetben
rocks_random_preview_tooltip: |-
  Véletlen forgatásnál a játék túl gyorsan forgatja a sziklát ahhoz, hogy az előnézet kövesse. Bekapcsolva másodpercenként egyszer fordul, így az előnézet pontosan a lehelyezendő sziklát mutatja.
rocks_variants: Sziklavariánsok sora
rocks_variants_tooltip: |-
  A Sziklák menü feletti sor a választott sziklaméret négy variánsát mutatja a lehelyezési tájolásban. Kattints egyre, hogy csak azt rakja le; újabb kattintás rá vagy bármely Sziklák menügombra visszaállítja a váltakozást.
rocks_extra_rock: Extra kis szikla
rocks_extra_rock_tooltip: |-
  A legkisebb szikláknál a variánssor egy ötödiket is kínál: egy kis sziklát, amely benne van a játékban, de a szerkesztő sosem helyezi le. Úgy mentődik, mint bármely másik szikla.
rocks_invisible: Láthatatlan sziklák jelölőnégyzet
rocks_invisible_tooltip: |-
  Jelölőnégyzetet ad a Sziklák menü gombjaitól jobbra. Bepipálva minden lerakott szikla rögtön „láthatatlan szikla” lesz, anélkül hogy előbb 4000 sziklát kellene lerakni: a mezők foglaltak (nem építhető és nem járható), de nem rajzolódik ki szikla, így a korábbi felszín marad látható (a „2k kő trükk”). Vedd ki a pipát a rendes sziklákhoz.
rocks_erase_invisible: A radír törli a láthatatlan sziklákat
rocks_erase_invisible_tooltip: |-
  A tájradír (és a vele sziklát törlő eszközök) a láthatatlan sziklák mezőit is felszabadítja, akárcsak a rendes sziklákét. Enélkül minden mezőnél az akadályt figyelmen kívül hagyó bokor lerakása és törlése kellene.
rocks_remove_lost: Elveszett sziklák eltávolítása gomb
rocks_remove_lost_tooltip: |-
  „Elveszett sziklák eltávolítása” gombot ad a Sziklák menü jobb alsó sarkába. Az emelés/süllyesztés által megtört szikla, amelynek minden mezőjét később bokrok fedték el, mező nélkül marad a térkép sziklalistájában: nem látható és nem törölhető, de foglal egyet a 4000 helyből. A gomb minden ilyen bejegyzést eltávolít a listából a mezők megváltoztatása nélkül.
heights_group: Magasságok
heights_group_descr: |-
  A tájszerkesztő magasságeszközei.
heights_max_height: Maximális magasság gomb
heights_max_height_tooltip: |-
  Visszahozza az első Stronghold Maximális magasság eszközét a Minimális magasságtól jobbra: az ecset alatti talajt 156-os magasságra emeli. A Crusaderben az eszköz és a gombképek megmaradtak, csak a gomb hiányzott.
heights_tool_options: Magasságeszköz-beállítások
heights_tool_options_tooltip: |-
  Magasságeszköz kiválasztásakor a Magasságok menü feletti panel (alulról felfelé) felkínálja:
  - Talajtextúrák visszaállítása (kezdetben ki): visszaállítsák-e az eszközök a talajt alapszínére (a fennsíkokat földre), mint a játékban. Kikapcsolva csak a magasságot módosítják.
  - Sziklamezők törése (kezdetben ki): megtörjék-e az emelés, süllyesztés, kiegyenlítés, domb és hegy eszközök az érintett sziklákat, mint a játékban (az érintett mezők láthatatlanná és járhatóvá válnak, miközben a szikla megmarad). Kikapcsolva a sziklák épek maradnak.
  - Víz mellőzése és Termőföld mellőzése (kezdetben ki): érintetlenül hagyja a tenger, folyó, gázló, mocsár és várárok, illetve a bozót, sűrű bozót és oázisfű mezőket.
  - Emeléshez, süllyesztéshez és kiegyenlítéshez: Tartományhoz igazítás (kezdetben be), Megfordítás (csak kiegyenlítés), magasságtartomány (kezdetben 8–156; mindkét vége húzható) és erősség. Tartományhoz igazítással a tartományon kívüli mezők behúzódnak bele; kikapcsolva érintetlenek maradnak. A Megfordítás simítás helyett érdesíti a talajt.
  - Sziklamagasság változása (kezdetben Egész szikla): mit tegyenek az eszközök egy érintett sziklával. Csak mező csak az ecset alatti mezőket mozgatja; Egész szikla a szikla minden mezőjét együtt; Szikla törlése eltávolítja a sziklát, mint a minimális magasság.
  A tartomány, az igazítás, a megfordítás és a mellőzés dobozok a szerkesztőből kilépve visszaállnak alapértelmezettre.
heights_invert_key_on: Tartsd lenyomva a kiegyenlítés megfordításához
heights_invert_key_on_tooltip: |-
  Ha ezt a billentyűt lenyomva tartod a kiegyenlítés eszköznél, a talajt érdesíti (mintha a Megfordítás be lenne pipálva); elengedve ismét simít.
heights_invert_key: Billentyű a kiegyenlítés megfordításához
heights_invert_key_tooltip: |-
  A kiegyenlítés eszköz megfordításához lenyomva tartandó billentyű.
castle_group: Vármód
castle_group_descr: |-
  A térképszerkesztő vármódjának építési menüje.
castle_building_counts: Épületszámlálók a minitérkép felett
castle_building_counts_tooltip: |-
  Megmutatja a minitérkép felett a térkép összes épületét a játék korlátjához képest (minden beleszámít, beleértve a vártornyokat, tájépületeket és épületrészeket), az összes játékos épületeinek számát és az aktuális játékosét. Játékosépület minden olyan épület, amelyet ellenség lerombolhat.
castle_tower_ruins: Toronyromok
castle_tower_ruins_tooltip: |-
  A Tornyok menü megnyitásakor a felette lévő sor felkínálja az öt torony romjait.
castle_tunnel_and_tents: Alagútbejárat és ostromsátrak
castle_tunnel_and_tents_tooltip: |-
  A katonai épületek menüjében: az alagútásók céhének kiválasztásakor egy alagútbejárat, a mérnökök céhénél pedig a hat ostromsátor jelenik meg a menü feletti sorban.
castle_statues: Szobor és szentélyek
castle_statues_tooltip: |-
  Hozzáadja a fel nem használt 2×2-es szobrot, 2×2-es szentélyt és 1×1-es szentélyt: a szobor és szentély variánsainak végére (lásd „Épületvariánsok”), vagy ha azok ki vannak kapcsolva, a jó dolgok menüje feletti sorba.
castle_barrier: Korlát a Romok menüben
castle_barrier_tooltip: |-
  Korlát gombot ad a Romok menü jobb alsó szabad helyére: egy később törölhető 1×1-es akadályt.
castle_several_keeps: Több vártorony játékosonként
castle_several_keeps_tooltip: |-
  Új vártorony lerakása többé nem törli a játékos korábbi vártornyát (és tábortüzét). A legújabb lesz a játékos aktív vártornya, a többi épületként megmarad.
castle_several_storage: Több raktár- és toborzóépület
castle_several_storage_tooltip: |-
  A kaszárnyák, zsoldostáborok, céhek és egyéb, rendesen egyedüli épületek nem törlődnek újabb lerakásakor, a további raktáraknak, magtáraknak és fegyvertáraknak pedig nem kell érintkezniük az elsővel. Bármennyi maradhat üresen is (a játék amúgy csak 8 üres magtárat/fegyvertárat és 32 üres raktárat enged).
castle_tower_engines: Torony-kővetőgépek és balliszták bárhová
castle_tower_engines_tooltip: |-
  A katonai menü torony-kővetőgépe és toronyballisztája bárhová lerakható, ahol egység állhat (talaj, falak, kapuk, tornyok, vártorony), nem csak a játékos saját szögletes és kerek tornyaira: a kattintott mezőre, mezőnként egy, legfeljebb 4 vártoronyra vagy nagy kapuházra és 8 a nagy erőd-vártornyokra. Az előnézet minden érvényes helyen tömör.
castle_keep_parts: Vártorony tábortűz vagy raktár nélkül
castle_keep_parts_tooltip: |-
  Vártorony kiválasztásakor a felette lévő sor két további módot kínál: „Csak vártorony” (vártorony és bejárat, tábortűz és raktár nélkül) és „Raktár nélkül” (vártorony, bejárat és tábortűzhely). A menüből választva ismét a teljes vártorony kerül le.
  Az előnézet és a helyellenőrzés csak ezeket a részeket vizsgálja.
castle_hover_text: Épületnevek balrább
castle_hover_text_tooltip: |-
  Az egér alatti épület neve („1. játékos vártornya”) 100 pixellel balrább kerül, így nem ütközik a minitérkép feletti épületszámlálókkal.
castle_damaged_walls: Sérült falak és lépcsők
castle_damaged_walls_tooltip: |-
  Lépcső, alacsony fal, magas fal vagy pártázat kiválasztásakor a várépületek menüje feletti sor felkínálja a „Sérült” változatot: a lerakott falak sérült fal tetejét kapják megőrzött magassággal. A menüből választva ismét ép falak kerülnek le.
castle_variant_panels: Épületvariánsok
castle_variant_panels_tooltip: |-
  Kert, szobor, szentély vagy pöcegödör kiválasztásakor a menü feletti sor megjeleníti minden variánsát; az ott választott változat rögzítve marad a másodpercenkénti váltás helyett. Ugyanez működik a kunyhónál a városmenü felett. A menüből választva visszatér az eredeti működés. A pipetta is a pontos variánst veszi fel.
castle_ruined_cathedral: Romos katedrális
castle_ruined_cathedral_tooltip: |-
  Katedrális kiválasztásakor a városmenü feletti sor felkínálja „Romos” változatban: a lerakott katedrális azt a romos képet kapja, amelyet a játék amúgy csak egy történelmi küldetésben mutat. A játékban teljesen működő katedrális marad, csak romosnak látszik. A menüből választva ismét ép katedrális kerül le. A pipetta romosként veszi fel. Az eredeti tile_churches.gm1 szükséges hozzá (régebbi verziókban nincs rom, így a katedrális ép marad).
castle_moat_kinds: Kiásott, tervezett és állandó várárok
castle_moat_kinds_tooltip: |-
  Várárok kiválasztásakor a kapuházak menüje feletti sor három típust kínál: Kiásott (a szerkesztő szokásos árka), Tervezett (kiásásra kijelölt árok, mint játék közben) és Állandó (kiásott árok, amelyet játékban senki nem temethet be és nem törölhet). A menüből választva visszaáll a kiásott árok.
castle_moat_on_marsh: Várárok mocsárra
castle_moat_on_marsh_tooltip: |-
  A térképszerkesztőben ismét helyezhető várárok mocsárra. A mocsár alatta marad, így az árok betemetésekor visszatér.
castle_moat_removal_keeps_ground: Az árok eltávolítása megőrzi a talajt
castle_moat_removal_keeps_ground_tooltip: |-
  A szerkesztő „várárok eltávolítása” eszköze csak a kiásott vagy tervezett várárkos mezőket módosítja: eltávolítja az árkot (visszaadva a rendes talajmagasságot) és békén hagyja a talajtextúrát. Enélkül az ecset alatti minden mező sima földdé válik.
herds_group: Csordák
herds_group_descr: |-
  A tájszerkesztő állatai.
herds_panel: Csordapanel
herds_panel_tooltip: |-
  Szarvas, oroszlán, nyúl vagy teve kiválasztásakor az Állatok menü feletti panel mutatja, hány állatból áll egy csorda (fix + véletlen rész) és milyen csoportos viselkedést használ. A jelölőnégyzettel a csordaméret az ecsethez igazodik: 2 × ecsetméret − 1 állat (1-től 13-ig), véletlen rész nélkül.
brushes_group: Ecsetek
brushes_group_descr: |-
  A tájszerkesztő ecsetei.
brushes_full_shape: Teljes alakú ecsetek
brushes_full_shape_tooltip: |-
  A játék ecsetei kétszer számolják az egér alatti mezőt, és kihagyják a bal felső sarokmezőt az előnézetben és a lerakáskor is. Bekapcsolva teljes alakjuk lesz (csak a térképszerkesztőben; a játék belső használata változatlan).
undo_group: Visszavonás és újra
undo_group_descr: |-
  Visszavonás és újra gombok a térképszerkesztő bal felső sarkában.
undo_enabled: Visszavonás és újra
undo_enabled_tooltip: |-
  Két nyílgomb a térképszerkesztő bal felső sarkában: a bal visszavonja a térkép utolsó módosítását (elhelyezés, törlés, festés, magasságok), a jobb visszaállítja, legfeljebb 20 lépésig. A gomb elszürkül, ha nincs mit visszavonni vagy újra végrehajtani. Minden kattintás egy lépés, akárcsak egy lenyomva tartott ecsetvonás. A térképet nem módosító kattintások nem hoznak létre lépést. Másik térkép betöltése újraindítja az előzményeket.
pipette_group: Pipetta
pipette_group_descr: |-
  Pipetta a tájszerkesztő bal oszlopában, az ecsetméret felett: felveszi egy mező magasságát és/vagy textúráját, és átadja az ecset alatti mezőknek.
pipette_enabled: Pipetta
pipette_enabled_tooltip: |-
  Pipetta gombot ad az ecsetméret fölé (az ecsetméret, a vonalzó és a radír kissé lejjebb kerül).
  Kiválasztásakor egy sor jelenik meg a menü felett — Magasságok, Textúrák, Objektumok, Mind — és felette a pipetta tartalma. Kattints egy mezőre a felvételhez (a pipetta egyetlen mezőt mutat), majd kattints vagy húzd az ecsetet az átadáshoz. A Magasságok békén hagyja a textúrát, a Textúrák a magasságot. Az Objektumok felveszi a mező épületét, falát, fáját vagy szikláját: az épületek és falak ugyanúgy rakhatók le az eredeti játékosnak (annak címere kiválasztódik), a fák (azonos fajta és fokozat vagy kidöntött rönkszám) és sziklák (azonos fajta és forgatás) pedig saját eszközeik módján, húzással is. A Mind egy fát vagy 1×1-es sziklát is felvesz és minden ecset alatti mezőre letesz belőle. A pipetta vagy valamelyik módjának újbóli kiválasztása kiüríti azt.
  Magasság nem adható tengerre, partra, mocsárra, várárokra, sziklákra, falakra és épületekre; textúra nem adható sziklákra, falakra és épületekre. A meredek peremeken lévő szirtkövek törlődnek és visszajönnek, ahol a perem meredek marad. A visszavonás a pipettára is működik.
pipette_select_key_on: Pipettabillentyű
pipette_select_key_on_tooltip: |-
  Billentyű, amely kiválasztja (és kiüríti) a pipettát. Ha a pipetta már aktív, újabb lenyomásra a következő módra lép: Magasságok, Textúrák, Objektumok, Mind.
pipette_select_key: Billentyű a pipettához
pipette_select_key_tooltip: |-
  A pipettát kiválasztó billentyű a térképszerkesztőben. Szokásos funkcióját is megtartja.
pipette_read_key_on: Tartsd lenyomva mező felvételéhez
pipette_read_key_on_tooltip: |-
  Lenyomva tartva a már feltöltött pipetta újra felvesz egy mezőt (a régi a kattintásig megmarad). Elengedve ismét fest, ha van benne valami.
pipette_read_key: Billentyű mező felvételéhez
pipette_read_key_tooltip: |-
  Mező felvételéhez lenyomva tartandó billentyű, amikor a pipettában már van tartalom.
pipette_any_tile_key_on: Tartsd lenyomva bármely mezőre festéshez
pipette_any_tile_key_on_tooltip: |-
  Kísérleti: lenyomva tartva a pipetta az ecset alatti minden mezőre átadja a magasságot és a textúrát, tengerre, mocsárra, sziklákra (amelyek megmaradnak), falakra és épületekre is (sosem a térkép szélére). Nem változtatja meg, hová helyezhetők objektumok.
pipette_any_tile_key: Billentyű bármely mezőre festéshez
pipette_any_tile_key_tooltip: |-
  Billentyű, amellyel a pipetta figyelmen kívül hagyja a mezőn lévő elemeket.
