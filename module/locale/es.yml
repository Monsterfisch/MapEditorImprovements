menu_group: Menú del editor
menu_group_descr: |-
  Cómo se dibuja el menú del editor en la parte inferior de la pantalla.
menu_dust_clouds: Las nubes de polvo no bloquean el juego
menu_dust_clouds_tooltip: |-
  Una nube de polvo que perdía sus datos de movimiento provocaba una división por cero y cerraba el juego. Con esto activado, simplemente permanece en su sitio.
menu_always_update: Mantener el menú siempre actualizado
menu_always_update_tooltip: |-
  El juego solo redibuja el menú cuando el ratón está encima. Cualquier cambio hecho fuera —como un atajo que cambia de herramienta o los contadores al colocar animales— no se refleja hasta devolver el ratón al menú. Con esto activado, el menú se redibuja continuamente en el editor de mapas.
castle_all_players: Los ocho escudos de jugador en todos los mapas
castle_all_players_tooltip: |-
  Los escudos junto al minimapa muestran a los ocho jugadores en cualquier tipo de mapa, no solo en mapas multijugador.
castle_all_keeps: Mansión y bastión en todos los mapas
castle_all_keeps_tooltip: |-
  El menú de fortalezas ofrece también la mansión y el bastión en mapas multijugador.
castle_player_zero: Escudo del jugador 0
castle_player_zero_tooltip: |-
  Un noveno escudo blanco en medio de los escudos de jugador selecciona al jugador 0, que también puede poseer edificios y unidades en un mapa.
castle_keep_crests: Escudos de fortaleza activa
castle_keep_crests_tooltip: |-
  Cada fortaleza muestra encima el escudo de su dueño; la fortaleza activa del jugador (donde aparecen el Señor, las unidades iniciales y los nuevos campesinos) aparece enmarcada. Haz clic en un escudo para activar esa fortaleza, o en el activo para dejar al jugador sin fortaleza activa. Una nueva fortaleza ya no quita el puesto automáticamente a la activa, y si se elimina la activa toma el relevo otra fortaleza del jugador. El almacén principal sigue siempre a la fortaleza activa (el juego conservaba antes el primer almacén colocado, de modo que con varias fortalezas la IA veía bloqueado su solar y no seguía ningún plano de castillo). Requiere «Varias fortalezas por jugador».
castle_keep_crest_tooltip: Descripción del escudo de fortaleza
castle_keep_crest_tooltip_tooltip: |-
  Pasar el ratón sobre un escudo de fortaleza muestra su significado y qué hace un clic. Requiere «Escudos de fortaleza activa».
castle_wall_tools: Alturas de muros y almenas libres
castle_wall_tools_tooltip: |-
  Las almenas pueden colocarse solas. Su panel ofrece baja, alta, baja dañada y alta dañada. Un deslizador sobre el panel de muros fija por separado la altura de muros altos, muros bajos y almenas (0–255) y la inclinación de escaleras (0–16); Restablecer devuelve su valor habitual al elegido, y al salir del editor se restablecen todos.
trees_spread_order: Árboles en orden de propagación
trees_spread_order_tooltip: |-
  En el menú Vegetación aparecen primero los árboles que se propagan en tierra fértil (hierba de oasis, matorral denso y ligero) y después el que se propaga en terreno árido (tierra, tierra pedregosa, dunas): el tercer y cuarto árbol intercambian su lugar.
trees_spread_outlines: Contornos según terreno de propagación
trees_spread_outlines_tooltip: |-
  Un fino contorno verde rodea los árboles que se propagan en tierra fértil y uno beige el árbol que se propaga en terreno árido. El manzano no se propaga y no lleva contorno.
herds_bird_bins: Botones Borrar todos los cuervos / gaviotas
herds_bird_bins_tooltip: |-
  Botones rojos de papelera a la derecha de los botones de cuervo y gaviota en el menú Animales: un clic elimina del mapa todos los cuervos (los árboles se quedan) o todas las gaviotas.
herds_animal_bin: Botón Borrar todos los animales
herds_animal_bin_tooltip: |-
  Botón rojo de papelera a la derecha del menú Animales que elimina todos los animales del mapa, como Alt + E. Cuervos y gaviotas permanecen.
herds_group_warning: Aviso de manadas y grupos
herds_group_warning_tooltip: |-
  Cuando quedan menos de 200 manadas y grupos por crear, una línea arriba de la pantalla indica cuántos faltan, como la línea propia del juego para unidades.
eraser_choice: Panel de selección del borrador
eraser_choice_tooltip: |-
  Con el borrador elegido, un panel sobre el menú decide qué borra: Todo (como antes), Animales (incluidos cuervos y gaviotas), Unidades, Edificios (con fortalezas, ruinas y muros), Vegetación o Rocas (también rocas invisibles).
eraser_seagulls: El borrador elimina gaviotas
eraser_seagulls_tooltip: |-
  El borrador también elimina las gaviotas que vuelen sobre las casillas borradas (con Todo o Animales).
map_settings_show_locked: Casilla Mostrar mapas bloqueados
map_settings_show_locked_tooltip: |-
  Añade la casilla «Mostrar mapas bloqueados» en el diálogo Cargar del editor. Marcada, los mapas bloqueados aparecen al instante en la lista.
map_settings_button: Botón Ajustes del mapa
map_settings_button_tooltip: |-
  Botón Ajustes del mapa en la pantalla de menú del mapa, a la derecha de Equilibrado / Desequilibrado e Invasión / Economía. Abre el menú Alt + ,.
map_settings_menu: Menú Ajustes del mapa ampliado
map_settings_menu_tooltip: |-
  El menú Alt + , recibe título, Un jugador y Multijugador, los cuatro tipos de mapa individual (Asedio, Invasión, Económico, Construcción libre), los cuatro tamaños más Personalizado y un deslizador de tamaño (de 10 a 400; aplica al soltar), Equilibrado, Rey de la colina, Bloquear mapa y un botón Atrás.
eraser_group: Borrador
eraser_group_descr: |-
  Qué elimina el borrador del editor de terreno.
map_settings_group: Ajustes del mapa
map_settings_group_descr: |-
  Los ajustes del mapa: tipo, tamaño, bloqueo y los menús que los muestran.
