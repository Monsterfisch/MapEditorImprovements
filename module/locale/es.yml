map_editor: Editor de mapas
grid_enabled: Mostrar cuadrícula de recursos
grid_enabled_tooltip: Pulsa Alt+G en el editor o reasigna la cuadrícula en Opciones > Teclas personalizadas.
grid_group_descr: Superpone la cuadrícula de recursos, límites de rotación de fortalezas o áreas de minas de hierro.
herds_animal_bin: Añadir un botón para borrar todos los animales terrestres (Alt+E)
key_configured: Usar tecla configurada
key_off: Desactivado
castle_buildings_group: Edificios del castillo
castle_buildings_group_descr: Coloca edificios en el modo Castillo.
keeps_group: Torres del homenaje y almacenes
keeps_group_descr: Configura torres del homenaje, almacenes y edificios de reclutamiento en el modo Castillo.
players_group: Jugadores
players_group_descr: Elige jugadores, colores y tipos de torre del homenaje en el modo Castillo.
fortifications_group: Muros y fosos
fortifications_group_descr: Coloca muros, escaleras y fosos en el modo Castillo.
tree_brush_group: Plantación y pinceles
tree_brush_group_descr: Ajusta cómo planta el pincel de vegetación en el modo Paisaje.
tree_spread_group: Propagación de árboles
tree_spread_group_descr: Muestra en el menú Vegetación sobre qué suelo se propaga cada árbol.
cat_terrain_water: Terreno y agua
cat_vegetation_animals: Vegetación y animales
cat_castle_placement: Colocación del castillo
cat_players_walls_moats: Jugadores, muros y fosos
cat_painting_corrections: Pintura y correcciones
cat_map_layout: Diseño y ajustes del mapa
