menu_group: Comportamiento del editor
menu_group_descr: Controla la visualización y actualización del editor.
menu_compass: Mostrar el norte en el editor
menu_compass_tooltip: Consulta el norte en la brújula fija arriba a la izquierda, debajo de Deshacer y Rehacer si están activos.
menu_compass_turn: Ctrl invierte el giro del mapa
menu_compass_turn_tooltip: Abre el anillo con clic derecho y mantén Ctrl al pasar sobre su brújula para girar en sentido antihorario.
menu_dust_clouds: Evitar cierres por nubes de polvo
menu_dust_clouds_tooltip: Evita cierres provocados por nubes de polvo al editar el mapa.
menu_always_update: Actualizar el panel del editor mientras trabajas
menu_always_update_tooltip: Mantiene actualizados los controles del editor mientras el cursor está sobre el mapa.
castle_all_players: Mostrar los ocho escudos de jugadores
castle_all_players_tooltip: Elige cualquiera de los ocho escudos junto al minimapa en el modo Castillo.
castle_all_keeps: Mansión y bastión en cualquier mapa
castle_all_keeps_tooltip: Selecciona Mansión o Bastión en Fortalezas en cualquier tipo de mapa.
castle_player_zero: Mostrar escudo del jugador neutral
castle_player_zero_tooltip: Haz clic en el noveno escudo blanco junto al minimapa para colocar objetos del jugador 0.
castle_keep_ground: Conservar el terreno al colocar fortalezas
castle_keep_ground_tooltip: Coloca fortalezas sin aplanar el terreno debajo de ellas.
castle_rotation: Lista de rotación de edificios
castle_rotation_tooltip: En modo Castillo, haz clic en «Rotation» justo sobre el menú inferior izquierdo y elige un ángulo antes de colocar un edificio compatible.
castle_unit_colour: Elegir color de unidad separado del dueño
castle_unit_colour_tooltip: Elige un blasón sobre el menú de unidades europeas o árabes para cambiar el color visible de la unidad.
castle_keep_crests: Elegir la fortaleza activa por su blasón
castle_keep_crests_tooltip: Con varias fortalezas activas, haz clic en un blasón para seleccionar o quitar la activa. La ayuda al pasar el cursor está activa por defecto.
castle_wall_tools: Alturas de muralla y almenas independientes
castle_wall_tools_tooltip: Selecciona murallas o escaleras y usa los controles sobre el menú. Haz clic en «Reset» al lado para restaurar.
trees_spread_order: Agrupar árboles por terreno de expansión
trees_spread_order_tooltip: Agrupa los árboles en Vegetación según el terreno donde se expanden. Los arbustos tienen fila propia por defecto.
trees_spread_outlines: Marcar dónde se expanden los árboles
trees_spread_outlines_tooltip: En Vegetación, el verde marca árboles que crecen en tierra fértil y el beige en tierra infértil.
herds_bird_bins: Eliminar todos los cuervos o gaviotas
herds_bird_bins_tooltip: En Animales, haz clic en la papelera junto al icono de cuervo o gaviota para quitar ese tipo de ave.
herds_group_warning: Avisar cerca del límite de manadas
herds_group_warning_tooltip: Muestra los huecos restantes cuando las manadas y grupos de tropas se acercan al límite del mapa.
eraser_choice: Elegir qué elimina el borrador
eraser_choice_tooltip: Selecciona Borrador y elige Todo, Animales, Unidades, Edificios, Vegetación o Rocas sobre el menú.
eraser_seagulls: Borrar gaviotas en vuelo
eraser_seagulls_tooltip: Usa el Borrador para quitar gaviotas en vuelo. Con los modos del borrador activos, elige Animales o Todo.
map_settings_show_locked: Mostrar mapas bloqueados en Cargar
map_settings_show_locked_tooltip: Marca «Show locked maps» debajo de la lista en el diálogo Cargar del editor.
map_settings_menu: Ajustes del mapa ampliados
map_settings_menu_tooltip: Pulsa Alt+, en el editor. Arrastra el control Map size y suéltalo para aplicar el tamaño. El botón Map Settings, sobre Ir al mapa, está activo por defecto.
map_settings_size_refresh: Aplicar mapas más pequeños al instante
map_settings_size_refresh_tooltip: Aplica un tamaño menor mientras editas y muestra los nuevos bordes al instante.
map_settings_camera_edge: Mostrar el borde completo del mapa
map_settings_camera_edge_tooltip: Mueve la cámara hasta el borde para ver las casillas más exteriores.
eraser_group: Borrador
eraser_group_descr: Elige qué borra el borrador de paisaje.
map_settings_group: Ajustes del mapa
map_settings_group_descr: Cambia el tipo de mapa, las dimensiones y opciones, o explora mapas bloqueados.
qol: Comodidad de juego
grid_group: Cuadrícula de recursos
grid_key: Atajo Alt sugerido para la cuadrícula
grid_outside_editor: Permitir cuadrícula durante la partida
grid_flattened_only: Cuadrícula solo en vista aplanada
grid_hide_in_v_view: Ocultar cuadrícula en vista V
grid_colour: Color de cuadrícula
grid_rotation_group: Orientación del castillo
grid_rotation_lines: Mostrar límites de rotación de fortalezas
grid_mine_group: Superficie de mina de hierro
grid_mine_boxes: Mostrar superficie de mina de hierro
