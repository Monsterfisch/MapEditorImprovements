counts_group: Contadores del mapa
counts_group_descr: Muestra qué tan cerca está el mapa de sus límites de objetos.
counts_enabled: Contadores de objetos del mapa
counts_enabled_tooltip: Haz clic en la i roja sobre el botón de llave y pasa el cursor sobre Animales, Vegetación, Rocas o sus elementos.
trees_group: Árboles y arbustos
trees_group_descr: Coloca y organiza vegetación en el modo Paisaje.
trees_growth: El tamaño del pincel define el crecimiento del árbol
trees_growth_tooltip: Elige un árbol y un tamaño de pincel en Vegetación. El tamaño 4 coloca árboles adultos y los tamaños 6 y 7 colocan árboles muertos.
trees_apple: Manzano en Vegetación
trees_apple_tooltip: Elige el manzano en Vegetación antes de plantarlo.
trees_shrubs: Colores de arbustos
trees_shrubs_tooltip: Selecciona un arbusto en Vegetación y elige un color en la fila sobre el menú.
trees_felled: Variantes de árboles talados
trees_felled_tooltip: Selecciona un árbol en Vegetación y elige la variante talada por número de troncos sobre el menú.
trees_random_mix: Mezcla aleatoria de vegetación
trees_random_mix_tooltip: Haz clic en ? en la fila de variantes de arbusto o árbol para mezclar. Vuelve a hacer clic o elige otra variante para parar.
trees_obstacles: Árboles junto a obstáculos
trees_obstacles_tooltip: Marca la casilla superior a la derecha de Vegetación para plantar árboles junto a obstáculos.
trees_rocks_and_water: Vegetación sobre rocas y agua
trees_rocks_and_water_tooltip: Marca la casilla inferior a la derecha de Vegetación para plantar sobre rocas y agua.
trees_preview: Previsualizar vegetación bajo el cursor
trees_preview_tooltip: Con zoom normal, apunta al mapa para previsualizar el árbol o arbusto elegido.
trees_no_stacking: Evitar vegetación apilada
trees_no_stacking_tooltip: Impide apilar vegetación en una casilla y limpia pilas antiguas con el borrador.
textures_group: Texturas de terreno
textures_group_descr: Elige cómo pinta texturas del terreno el pincel de Paisaje.
textures_gravel_and_iron: Grava y hierro en Texturas
textures_gravel_and_iron_tooltip: Elige Grava o Hierro en Texturas y píntalos en el mapa.
textures_mask: Pintar solo la textura inicial
textures_mask_tooltip: Haz clic en el cuadrado medio relleno arriba a la izquierda y empieza cada trazo sobre la textura a cambiar.
textures_mask_by_type: Tratar variantes de agua como una sola textura
textures_mask_by_type_tooltip: Con la máscara activa, pinta sobre variantes de la textura inicial de mar, río o vado.
water_group: Agua
water_group_descr: Pinta detalles de río en el modo Paisaje.
water_decorations: Espuma y pequeñas olas en Agua
water_decorations_tooltip: Elige Espuma o Pequeñas olas en Agua y píntalas sobre casillas de río.
water_foam_on_sea: Convertir casillas de mar en río espumoso
water_foam_on_sea_tooltip: Pinta Espuma del menú Agua sobre casillas de mar para convertirlas en río.
rocks_group: Rocas
rocks_group_descr: Coloca, orienta y quita rocas en el modo Paisaje.
rocks_signpost: Señal en mapas de escaramuza
rocks_signpost_tooltip: Abre Rocas en un mapa de escaramuza y elige Señal.
rocks_random_preview: Ángulo de roca aleatorio en cada colocación
rocks_random_preview_tooltip: En Paisaje → Rocas, elige un tamaño y pulsa Rotación aleatoria. La vista previa cambia de ángulo tras cada intento.
rocks_variants: Elegir una variante de roca
rocks_variants_tooltip: Elige un tamaño de roca y haz clic en una variante sobre Rocas. El tamaño menor ofrece una quinta roca por defecto.
rocks_invisible: Colocar rocas invisibles
rocks_invisible_tooltip: Marca la casilla a la derecha de Rocas antes de colocar. Las rocas invisibles bloquean paso y construcción.
rocks_erase_invisible: Borrar rocas invisibles
rocks_erase_invisible_tooltip: Usa el borrador de paisaje para despejar casillas bloqueadas por rocas invisibles.
rocks_remove_lost: Limpiar registros de rocas perdidas
rocks_remove_lost_tooltip: Haz clic en «Remove lost rocks» abajo a la derecha de Rocas para liberar huecos sin alterar casillas.
heights_group: Alturas
heights_group_descr: Modela el terreno en el modo Paisaje.
heights_max_height: Altura máxima en Alturas
heights_max_height_tooltip: Elige «Max Height» junto a Altura mínima para elevar el terreno bajo el pincel al máximo.
heights_tool_options: Controles del pincel de altura
heights_tool_options_tooltip: Elige una herramienta de Alturas para ajustar rango, fuerza, protección del terreno y rocas sobre el menú.
heights_invert_key: Mantener para invertir Igualar
heights_invert_key_tooltip: Con Igualar seleccionado, mantén pulsada esta tecla para volver rugoso el terreno y suéltala para volver a alisarlo.
castle_building_counts: Contadores de edificios sobre el minimapa
castle_building_counts_tooltip: Lee los contadores de edificios sobre el minimapa en modo Castillo. El texto flotante se aparta por defecto.
castle_tower_ruins: Ruinas de torres
castle_tower_ruins_tooltip: Elige una ruina en la fila de variantes sobre Torres.
castle_tunnel_and_tents: Entrada de túnel y tiendas de asedio
castle_tunnel_and_tents_tooltip: Selecciona el gremio de zapadores o de ingenieros y elige la entrada o una tienda sobre el menú.
castle_statues: Estatua y santuarios adicionales
castle_statues_tooltip: Selecciona una estatua o santuario y elige su variante sobre el menú, o busca los extras en Cosas buenas.
castle_barrier: Barrera en Ruinas
castle_barrier_tooltip: Encuentra Barrera abajo a la derecha de Ruinas.
castle_several_keeps: Varias fortalezas por jugador
castle_several_keeps_tooltip: Coloca fortalezas adicionales normalmente. Con blasones activos, haz clic en uno para elegir la fortaleza activa.
castle_several_storage: Varios edificios de almacén y reclutamiento
castle_several_storage_tooltip: Coloca edificios adicionales normalmente. Almacenes separados pueden cambiar qué recursos hay disponibles cerca.
castle_tower_engines: Colocar máquinas de torre en casillas transitables
castle_tower_engines_tooltip: Elige una máquina de asedio montada en torre en Edificios militares y colócala en una casilla transitable.
castle_keep_parts: Colocar partes de una fortaleza
castle_keep_parts_tooltip: Selecciona una fortaleza y elige «Keep only» o «No stockpile» en la fila sobre Fortalezas.
castle_damaged_walls: Colocar murallas o escaleras dañadas
castle_damaged_walls_tooltip: Selecciona una muralla o escalera y pulsa «Damaged» sobre el menú de edificios antes de colocarla.
castle_variant_panels: Elegir variante de edificio
castle_variant_panels_tooltip: Selecciona un edificio compatible y haz clic en una variante en la fila sobre el menú.
castle_ruined_cathedral: Colocar catedral de aspecto derruido
castle_ruined_cathedral_tooltip: Elige la variante en ruinas sobre el menú de edificios. Funciona como una catedral normal.
castle_moat_kinds: Elegir tipo de foso
castle_moat_kinds_tooltip: Selecciona Foso en Puertas y elige «Dug», «Planned» o «Permanent» sobre el menú.
castle_moat_on_marsh: Permitir fosos sobre pantano
castle_moat_on_marsh_tooltip: Coloca fosos sobre pantano. Rellenar el foso restaura el pantano debajo.
castle_moat_removal_keeps_ground: Conservar el terreno al quitar fosos
castle_moat_removal_keeps_ground_tooltip: Quitar un foso devuelve el terreno original que había debajo.
herds_group: Manadas
herds_group_descr: Gestiona manadas y aves en el modo Paisaje.
herds_panel: Tamaño y comportamiento de manadas
herds_panel_tooltip: Selecciona un animal de manada y usa el panel sobre Animales para fijar tamaño y comportamiento.
brushes_group: Pinceles
brushes_group_descr: Cambia cómo cubre casillas el pincel del editor.
brushes_full_shape: Corregir forma del pincel
brushes_full_shape_tooltip: Rellena toda la vista previa del pincel sin aplicar la herramienta dos veces en el centro.
undo_group: Deshacer y rehacer
undo_group_descr: Retrocede y avanza entre ediciones recientes.
undo_enabled: Deshacer y rehacer
undo_enabled_tooltip: Usa las flechas de arriba a la izquierda para deshacer o rehacer hasta 20 cambios, o asigna Deshacer y Rehacer en Opciones > Teclas personalizadas.
pipette_group: Cuentagotas
pipette_group_descr: Toma muestra de una casilla y reutiliza su contenido en el mapa.
pipette_enabled: Copiar terreno u objetos con el cuentagotas
pipette_enabled_tooltip: Haz clic en el cuentagotas sobre el tamaño del pincel, elige Alturas, Texturas, Objetos o Todo, selecciona una casilla origen y pinta.
pipette_select_key: Atajo del cuentagotas
pipette_select_key_tooltip: Pulsa de nuevo esta tecla para cambiar de modo, o asigna Cuentagotas en Opciones > Teclas personalizadas.
pipette_read_key: Mantener para muestrear otra casilla
pipette_read_key_tooltip: Mantén pulsada esta tecla al hacer clic en una nueva casilla origen con el cuentagotas.
