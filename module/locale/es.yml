counts_group: Contadores del mapa
counts_group_descr: |-
  Muestra en el editor de terreno cuántos animales, árboles y rocas tiene el mapa y cuán cerca está de los límites del juego.
counts_enabled: Mostrar contadores del mapa
counts_enabled_tooltip: |-
  Apunta a los botones Animales, Vegetación o Rocas para ver una descripción emergente con el total y el límite del juego, por ejemplo «Árboles y arbustos: 812/1999». La de Animales también muestra manadas y grupos, que tienen su propio límite.
  En el menú Animales, los botones de ciervo, camello, conejo y león muestran cuántos hay de cada uno; en el menú Vegetación, cada botón de árbol y arbusto muestra cuántos ejemplares hay de esa planta.
  Un botón rojo «i» sobre el botón de la llave activa o desactiva todo esto mientras trabajas.
counts_shown: Mostrar números al abrir el editor
counts_shown_tooltip: |-
  Desactivado: los números empiezan ocultos y el botón «i» los muestra.
trees_group: Árboles y arbustos
trees_group_descr: |-
  Más opciones al colocar vegetación en el editor de terreno.
trees_growth: El tamaño del pincel define la fase de crecimiento del árbol
trees_growth_tooltip: |-
  Los árboles se colocan en la fase de crecimiento correspondiente al tamaño del pincel: el pincel 1 coloca los árboles más pequeños, el 4 árboles adultos (los que siempre coloca el editor por defecto), el 5 árboles adultos que los leñadores dejan en paz un tiempo, y el 6 y 7 árboles muertos (el 7 desaparece antes). No afecta a los arbustos.
trees_apple: Botón de manzano
trees_apple_tooltip: |-
  Añade un manzano al menú Vegetación. Su imagen es images/apple.png (junto con apple_hover.png y apple_selected.png) en la carpeta del módulo; reemplázalas para cambiarla.
trees_shrubs: Más arbustos
trees_shrubs_tooltip: |-
  Cuando está seleccionado el arbusto que tiene otros cuatro colores, una fila sobre el menú Vegetación ofrece los cinco colores.
trees_felled: Árboles talados
trees_felled_tooltip: |-
  Con un árbol seleccionado, una fila sobre el menú Vegetación lo ofrece en pie (primero) y talado con cada cantidad posible de troncos (de 9 a 1 para un árbol adulto; los más pequeños caen con 1 tronco). Haz clic en uno para colocar árboles talados; haz clic en el árbol en pie, de nuevo en el talado o en el árbol del menú para volver a los árboles en pie.
trees_random_mix: Mezclas aleatorias en las filas de árboles
trees_random_mix_tooltip: |-
  Añade botones marcados con «?» en las filas sobre el menú Vegetación:
  - Árbol aleatorio (primero en la fila de árboles talados): árboles de todas las fases de crecimiento desde la menor hasta la del pincel mezclados al azar. No se ofrece para los árboles más pequeños ni los muertos.
  - Árbol talado aleatorio (último en la fila de árboles talados): árboles talados con un número aleatorio de troncos.
  - Arbusto aleatorio (último en la fila de arbustos): los cinco colores de arbusto mezclados al azar.
  Vuelve a hacer clic o elige otro botón para detener la mezcla.
trees_obstacles: Casilla para árboles junto a obstáculos
trees_obstacles_tooltip: |-
  Añade una casilla en la fila superior del menú Vegetación. Cuando está marcada, se pueden colocar árboles justo al lado de edificios, rocas, muros y otros árboles, algo que el juego normalmente impide (los arbustos ya pueden estar ahí). Apunta sobre ella para ver si está activa.
trees_rocks_and_water: Casilla para vegetación sobre rocas y agua
trees_rocks_and_water_tooltip: |-
  Casilla a la derecha del menú Vegetación, debajo de la de árboles junto a obstáculos (desactivada al inicio). Marcada, también permite colocar árboles y arbustos en pantano, río, vado, suelo rocoso, peñascos y grava.
trees_sorted_rows: Ordenar las filas del menú Vegetación
trees_sorted_rows_tooltip: |-
  Mueve el arbusto de la fila superior a la inferior y ordena los arbustos de la fila inferior, de modo que la fila superior agrupa los árboles (con el manzano y la casilla) y la inferior todos los arbustos.
trees_preview: Vista previa de árbol
trees_preview_tooltip: |-
  Con un árbol o arbusto seleccionado, muestra en la casilla bajo el ratón el árbol que se plantaría, en la fase del pincel (o talado con sus troncos), tal como lo dibujará el juego. No se muestra con el zoom alejado.
trees_no_stacking: Sin apilamiento de arbustos
trees_no_stacking_tooltip: |-
  Ya no se puede colocar un árbol o arbusto sobre una casilla que ya tiene uno. Algunos arbustos (el de la fila superior y los cuatro ordenados con él) se apilaban antes de forma invisible, ocupando para siempre plazas del límite de árboles. El borrador ahora también elimina todos los arbustos apilados en una casilla para limpiar pilas antiguas.
textures_group: Texturas de terreno
textures_group_descr: |-
  El menú Texturas del editor de terreno.
textures_gravel_and_iron: Grava y hierro en el menú Texturas
textures_gravel_and_iron_tooltip: |-
  Añade Grava a la fila superior y Hierro a la inferior, y reparte ambas filas de forma uniforme. La imagen de la grava es images/gravel.png (con gravel_hover.png y gravel_selected.png).
textures_no_heights_iron: Hierro solo en el menú Texturas
textures_no_heights_iron_tooltip: |-
  Quita el botón de hierro del menú Alturas, ahora que el menú Texturas dispone de uno.
textures_mask: Botón de máscara
textures_mask_tooltip: |-
  Añade un botón de Máscara (un cuadrado medio relleno) en la esquina superior izquierda del menú del editor de terreno. Mientras está activo, las herramientas naturales (alturas, texturas, agua, árboles y arbustos, rocas y cuentagotas) solo modifican casillas con la misma textura que la primera casilla clicada; al soltar el ratón, el siguiente clic elige una nueva textura objetivo.
textures_mask_by_type: La máscara agrupa variantes de agua
textures_mask_by_type_tooltip: |-
  La máscara solo deja pasar casillas de la misma textura que la clicada; cada textura es distinta (hierba, matorral, matorral denso, piedras, playa…). Con esto activado, las variantes de un mismo tipo de agua cuentan como una sola: todo el mar con sus bordes y zonas profundas, todo el río con espuma, olas y bordes de cascada, y todos los vados. Mar, río y vado siguen separados.
water_group: Agua
water_group_descr: |-
  El menú Agua del editor de terreno.
water_decorations: Espuma y olas pequeñas
water_decorations_tooltip: |-
  Recupera dos adornos de río del editor del primer Stronghold que Crusader aún soporta pero sin botones: Espuma (agua blanca y rocío, como bajo una cascada, en cada casilla de río bajo el pincel) y Olas pequeñas (en la casilla de río bajo el ratón). Ambos solo van en río y se guardan en el mapa.
water_foam_on_sea: Espuma también en el mar
water_foam_on_sea_tooltip: |-
  La espuma también puede aplicarse sobre casillas de mar, que pasan a ser río con espuma (con la opción de espuma activada).
rocks_group: Rocas
rocks_group_descr: |-
  El menú Rocas del editor de terreno.
rocks_signpost: Poste indicador en el menú Rocas de mapas de escaramuza
rocks_signpost_tooltip: |-
  Los mapas de escaramuza reciben el mismo menú Rocas que los mapas de escenario, incluido el botón del poste indicador.
rocks_random_preview: Rotación aleatoria visible en la vista previa
rocks_random_preview_tooltip: |-
  Con el botón de rotación aleatoria activado, el juego gira la roca tan rápido que la vista previa bajo el ratón no puede seguirla. Con esto activado gira una vez por segundo y muestra exactamente la roca que vas a colocar.
rocks_variants: Fila de variantes de roca
rocks_variants_tooltip: |-
  Una fila sobre el menú Rocas muestra las cuatro variantes del tamaño de roca elegido, giradas tal como se colocarán. Haz clic en una para colocar solo esa variante; vuelve a hacer clic en ella o en cualquier botón del menú Rocas para recuperar el cambio automático.
rocks_extra_rock: Roca pequeña adicional
rocks_extra_rock_tooltip: |-
  Para las rocas más pequeñas, la fila de variantes ofrece una quinta: una roca pequeña presente en el juego que el editor nunca coloca. Se guarda en el mapa como cualquier otra roca.
rocks_invisible: Casilla de rocas invisibles
rocks_invisible_tooltip: |-
  Añade una casilla a la derecha de los botones del menú Rocas. Marcada, cada roca que coloques es al instante una «roca invisible», sin tener que poner primero 4000 rocas: las casillas quedan ocupadas (no se puede construir ni caminar) pero no se dibuja ninguna roca, mostrando lo que había antes (el truco de las «2k piedras»). Desmárcala para rocas normales.
rocks_erase_invisible: El borrador elimina rocas invisibles
rocks_erase_invisible_tooltip: |-
  El borrador de terreno (y las herramientas que eliminan rocas con él) libera también las casillas de rocas invisibles igual que las normales. Sin esto, cada casilla requería el truco del arbusto: colocar el arbusto que ignora obstáculos y borrarlo.
rocks_remove_lost: Botón Eliminar rocas perdidas
rocks_remove_lost_tooltip: |-
  Añade un botón «Eliminar rocas perdidas» abajo a la derecha del menú Rocas. Una roca rota por subir/bajar terreno cuyas casillas luego quedaron cubiertas por arbustos permanece en la lista de rocas del mapa sin ninguna casilla: no se puede ver ni borrar y consume una de las 4000 plazas. El botón limpia todas esas entradas sin alterar casillas.
heights_group: Alturas
heights_group_descr: |-
  Las herramientas de altura del editor de terreno.
heights_max_height: Botón de altura máxima
heights_max_height_tooltip: |-
  Recupera la herramienta Altura máxima del primer Stronghold, a la derecha de Altura mínima en el menú Alturas: fija el terreno bajo el pincel a altura 156. Crusader conserva la herramienta y sus iconos; solo faltaba el botón.
heights_tool_options: Opciones de herramientas de altura
heights_tool_options_tooltip: |-
  Con una herramienta de altura elegida, un panel sobre el menú Alturas ofrece (de abajo arriba):
  - Restablecer texturas de terreno (desactivado al inicio): si las herramientas de altura devuelven también el terreno a su aspecto básico (y las mesetas a tierra), como en el juego. Desactivado, solo cambian la altura.
  - Romper casillas de roca (desactivado al inicio): si subir, bajar, igualar, colina y montaña rompen las rocas que tocan como en el juego (las casillas tocadas quedan invisibles y transitables mientras la roca sigue existiendo). Desactivado, las rocas quedan intactas.
  - Ignorar agua e Ignorar tierra fértil (desactivados al inicio): dejan intactas las casillas de mar, río, vado, pantano y foso, o las de matorral, matorral denso e hierba de oasis.
  - Para subir, bajar e igualar: Ajustar al rango (activado al inicio), Invertir (solo igualar), el rango de altura (8 a 156 al inicio; arrastra ambos extremos) y la intensidad. Con Ajustar al rango activado, las casillas fuera del rango se llevan dentro; desactivado, se dejan intactas. Invertir hace que igualar vuelva el terreno irregular en vez de suavizarlo.
  - Cambio de altura de rocas (Roca entera al inicio): qué hacen las herramientas a una roca tocada. Solo casilla mueve solo las casillas bajo el pincel; Roca entera mueve toda la roca por igual; Borrar roca la elimina, como siempre hizo Altura mínima.
  El rango, Ajustar al rango, Invertir y las casillas de ignorar vuelven a sus valores iniciales al salir del editor.
heights_invert_key_on: Mantener pulsada para invertir igualar
heights_invert_key_on_tooltip: |-
  Mientras se mantiene pulsada esta tecla con la herramienta igualar elegida, vuelve irregular el terreno (como con Invertir marcado); al soltarla vuelve a suavizar.
heights_invert_key: Tecla para invertir igualar
heights_invert_key_tooltip: |-
  La tecla que se mantiene pulsada para invertir la herramienta igualar.
castle_group: Modo castillo
castle_group_descr: |-
  El menú de construcción del modo castillo en el editor de mapas.
castle_building_counts: Contadores de edificios sobre el minimapa
castle_building_counts_tooltip: |-
  Muestra sobre el minimapa cuántos edificios tiene el mapa frente al límite del juego (cuentan todos, incluidas fortalezas, edificios de paisaje y piezas compuestas), cuántos edificios de jugador tienen todos los jugadores juntos y cuántos el jugador actual. Los edificios de jugador son los que un enemigo puede destruir.
castle_tower_ruins: Ruinas de torres
castle_tower_ruins_tooltip: |-
  Con el menú Torres abierto, una fila encima ofrece las ruinas de las cinco torres.
castle_tunnel_and_tents: Entrada de túnel y tiendas de asedio
castle_tunnel_and_tents_tooltip: |-
  En el menú de edificios militares: con el gremio de zapadores seleccionado, una fila sobre el menú ofrece una entrada de túnel; con el gremio de ingenieros seleccionado, las seis tiendas de asedio.
castle_statues: Estatua y santuarios
castle_statues_tooltip: |-
  Añade la estatua 2×2, el santuario 2×2 y el santuario 1×1 sin usar: al final de las variantes de estatua y santuario (véase «Variantes de edificios») o, si están desactivadas, en una fila sobre el menú de cosas buenas.
castle_barrier: Barrera en el menú Ruinas
castle_barrier_tooltip: |-
  Añade un botón Barrera en el hueco libre abajo a la derecha del menú Ruinas: una barrera 1×1 que puede eliminarse de nuevo.
castle_several_keeps: Varias fortalezas por jugador
castle_several_keeps_tooltip: |-
  Colocar una fortaleza ya no elimina la fortaleza anterior del jugador (ni su hoguera). La más reciente pasa a ser la fortaleza activa del jugador y las demás permanecen como edificios.
castle_several_storage: Varios edificios de almacén y reclutamiento
castle_several_storage_tooltip: |-
  Cuarteles, campamentos de mercenarios, gremios y demás edificios normalmente únicos ya no se eliminan al colocar otro, y los almacenes, graneros y arsenales adicionales ya no necesitan tocar al primero. También puede haber cualquier cantidad vacíos (el juego solo permite 8 graneros o arsenales vacíos y 32 almacenes vacíos).
castle_tower_engines: Mangoneles y balistas de torre en cualquier lugar
castle_tower_engines_tooltip: |-
  El mangonel de torre y la balista de torre del menú militar pueden colocarse donde pueda haber una unidad (suelo, muros, puertas, torres, fortaleza), no solo en torres cuadradas y redondas propias: en la casilla clicada, una por casilla, hasta 4 en una fortaleza o puerta grande y 8 en las grandes fortalezas. La vista previa es sólida donde pueda colocarse.
castle_keep_parts: Fortaleza sin hoguera ni almacén
castle_keep_parts_tooltip: |-
  Con una fortaleza seleccionada, una fila sobre el menú de fortalezas ofrece dos formas más: «Solo fortaleza» (fortaleza y entrada, sin hoguera ni almacén) y «Sin almacén» (fortaleza, entrada y zona de hoguera). Volver a elegirla en el menú coloca la fortaleza completa.
  La vista previa y la comprobación de espacio solo cubren esas partes.
castle_hover_text: Nombres de edificios más a la izquierda
castle_hover_text_tooltip: |-
  El nombre del edificio bajo el ratón («Fortaleza del jugador 1») se desplaza 100 píxeles a la izquierda para no solaparse con los contadores sobre el minimapa.
castle_damaged_walls: Muros y escaleras dañados
castle_damaged_walls_tooltip: |-
  Con escaleras, muro bajo, muro alto o almenas seleccionados, una fila sobre el menú de edificios de castillo los ofrece en modo «Dañado»: los muros colocados reciben la coronación de un muro dañado manteniendo su altura. Elegir el muro en el menú coloca de nuevo muros intactos.
castle_variant_panels: Variantes de edificios
castle_variant_panels_tooltip: |-
  Con un jardín, estatua, santuario o pozo negro seleccionado, una fila sobre el menú muestra todas sus variantes; la elegida allí permanece fija en lugar de rotar cada segundo. Lo mismo para la choza sobre el menú Ciudad. Elegir el edificio en el menú vuelve al comportamiento original. El cuentagotas también toma la variante exacta.
castle_ruined_cathedral: Catedral en ruinas
castle_ruined_cathedral_tooltip: |-
  Con la catedral seleccionada, una fila sobre el menú Ciudad la ofrece «En ruinas»: recibe el aspecto derruido que el juego solo muestra en una misión histórica, pero en partida sigue siendo una catedral completa y funcional. Elegirla en el menú vuelve a colocar catedrales intactas. El cuentagotas la toma en ruinas. Requiere el tile_churches.gm1 original del juego (copias antiguas no tienen la ruina y las dejan enteras).
castle_moat_kinds: Foso excavado, planificado y permanente
castle_moat_kinds_tooltip: |-
  Con el foso seleccionado en el menú de puertas, una fila encima ofrece tres modos: Excavado (el habitual del editor), Planificado (marcado para excavar, como en partida) y Permanente (foso excavado que nadie puede rellenar ni borrar en partida). Elegir el foso en el menú vuelve al foso excavado.
castle_moat_on_marsh: Foso sobre pantano
castle_moat_on_marsh_tooltip: |-
  En el editor de mapas puede volver a colocarse foso sobre pantano. El pantano permanece debajo y reaparece cuando el foso se rellena.
castle_moat_removal_keeps_ground: Quitar foso conserva el terreno
castle_moat_removal_keeps_ground_tooltip: |-
  «Quitar foso» solo modifica casillas con foso excavado o planificado: quita el foso (recuperando la altura normal) y deja intacta la textura del suelo. Sin esto convierte cada casilla bajo el pincel en tierra desnuda.
herds_group: Manadas
herds_group_descr: |-
  Los animales del editor de terreno.
herds_panel: Panel de manadas
herds_panel_tooltip: |-
  Con ciervo, león, conejo o camello seleccionado, un panel sobre el menú Animales muestra cuántos animales forman una manada (parte fija más parte aleatoria) y qué tipo de comportamiento grupal usa. Su casilla ajusta el tamaño al pincel: 2 × tamaño del pincel − 1 animales (de 1 a 13), sin parte aleatoria.
brushes_group: Pinceles
brushes_group_descr: |-
  Los pinceles del editor de terreno.
brushes_full_shape: Pinceles con forma completa
brushes_full_shape_tooltip: |-
  Los pinceles del juego cuentan dos veces la casilla bajo el ratón y omiten la esquina superior izquierda, tanto en la vista previa como al colocar. Con esto activado tienen su forma completa (en el editor de mapas; el uso interno del juego queda intacto).
undo_group: Deshacer y rehacer
undo_group_descr: |-
  Botones de deshacer y rehacer en la esquina superior izquierda del editor de mapas.
undo_enabled: Deshacer y rehacer
undo_enabled_tooltip: |-
  Dos botones de flecha en la esquina superior izquierda del editor: el izquierdo deshace la última acción en el mapa (colocar, borrar, pintar, alturas) y el derecho la rehace, hasta 20 pasos. Un botón aparece atenuado si no hay nada que deshacer o rehacer. Cada clic es un paso, y un trazo mantenido también. Los clics sin efecto no crean paso. Cargar otro mapa reinicia el historial.
pipette_group: Cuentagotas
pipette_group_descr: |-
  Un cuentagotas en la columna izquierda del editor de terreno, sobre el tamaño del pincel: toma alturas y/o texturas de una casilla y las aplica a las casillas bajo el pincel.
pipette_enabled: Cuentagotas
pipette_enabled_tooltip: |-
  Añade el botón del cuentagotas sobre el tamaño del pincel (tamaño del pincel, regla y borrador bajan un poco).
  Al elegirlo aparece una fila sobre el menú —Alturas, Texturas, Objetos, Todo— y encima lo que contiene el cuentagotas. Haz clic en una casilla para tomar muestra (muestra una sola casilla) y luego haz clic o arrastra para aplicarla bajo el pincel. Alturas no altera el suelo, Texturas no altera las alturas. Objetos toma el edificio, muro, árbol o roca de una casilla: edificios y muros se colocan como desde su propio menú para el mismo jugador (se elige su escudo), árboles (mismo tipo y fase, o talado con los mismos troncos) y rocas (mismo tipo y giro) como con sus herramientas, arrastre incluido. Todo también toma un árbol o roca 1×1 y coloca uno en cada casilla bajo el pincel. Volver a elegir el cuentagotas o uno de sus modos lo vacía.
  No se aplican alturas a mar, playa, pantano, foso, rocas, muros ni edificios; ni texturas a rocas, muros o edificios. Las rocas de acantilado en pendientes fuertes se limpian y vuelven donde la pendiente siga siendo fuerte. Deshacer revierte también sus trazos.
pipette_select_key_on: Tecla del cuentagotas
pipette_select_key_on_tooltip: |-
  Una tecla que elige (y vacía) el cuentagotas. Si se pulsa de nuevo con el cuentagotas activo, pasa al siguiente modo: Alturas, Texturas, Objetos, Todo.
pipette_select_key: Tecla para el cuentagotas
pipette_select_key_tooltip: |-
  La tecla que selecciona el cuentagotas en el editor de mapas. También mantiene su función habitual.
pipette_read_key_on: Mantener para tomar muestra de casilla
pipette_read_key_on_tooltip: |-
  Mientras se mantiene pulsada esta tecla, un cuentagotas ya cargado vuelve a tomar una casilla (la anterior se conserva hasta hacer clic). Al soltarla vuelve a aplicar, si contiene algo.
pipette_read_key: Tecla para tomar muestra de casilla
pipette_read_key_tooltip: |-
  La tecla que se mantiene pulsada para tomar otra casilla mientras el cuentagotas ya contiene algo.
pipette_any_tile_key_on: Mantener para aplicar a cualquier casilla
pipette_any_tile_key_on_tooltip: |-
  Experimental: mientras se mantiene pulsada esta tecla, el cuentagotas aplica alturas y texturas a todas las casillas bajo el pincel, incluidos mar, pantano, rocas (permanecen), muros y edificios (nunca el borde del mapa). No cambia dónde pueden colocarse objetos.
pipette_any_tile_key: Tecla para aplicar a cualquier casilla
pipette_any_tile_key_tooltip: |-
  La tecla que se mantiene pulsada para que el cuentagotas ignore lo que haya en una casilla.
