menu_group: Düzenleyici davranışı
menu_group_descr: Düzenleyicinin görüntüleme ve yeniden çizme davranışını kontrol eder.
menu_compass: Düzenleyicide kuzeyi göster
menu_compass_tooltip: Sol üstteki sabit pusuladan kuzeyi görün (açıksa Geri al ve Yinele’nin altında).
menu_compass_turn: Ctrl harita dönüşünü ters çevirir
menu_compass_turn_tooltip: Sağ tık halkasını açın ve saat yönünün tersine dönmek için pusulasına giderken Ctrl’yi basılı tutun.
menu_dust_clouds: Toz bulutu çökmelerini önle
menu_dust_clouds_tooltip: Haritayı düzenlerken toz bulutlarından kaynaklanan çökmeleri önler.
menu_always_update: Çalışırken düzenleyici panelini güncelle
menu_always_update_tooltip: Fare harita üzerindeyken düzenleyici kontrollerini güncel tutar.
castle_all_players: Sekiz oyuncu kalkanının tümünü göster
castle_all_players_tooltip: Kale modunda mini haritanın yanındaki sekiz kalkandan herhangi birini seçin.
castle_all_keeps: Her haritada malikâne ve kale
castle_all_keeps_tooltip: Herhangi bir harita türünde İç Kaleler’den Malikâne veya Kale’yi seçin.
castle_player_zero: Tarafsız oyuncu kalkanını göster
castle_player_zero_tooltip: Oyuncu 0 için nesne yerleştirmek üzere mini haritanın yanındaki dokuzuncu beyaz kalkana tıklayın.
castle_keep_ground: İç kale yerleştirirken zemini koru
castle_keep_ground_tooltip: İç kaleleri altındaki zemini düzleştirmeden yerleştirir.
castle_rotation: Bina döndürme listesi
castle_rotation_tooltip: Kale modunda sol alt menünün hemen üstündeki “Rotation” düğmesine tıklayın ve desteklenen bir binayı yerleştirmeden önce bir açı seçin.
castle_unit_colour: Birim renklerini sahiplikten ayrı seç
castle_unit_colour_tooltip: Birimin görünümünü değiştirmek için Avrupa veya Arap birim menüsünün üstünden bir arma seçin.
castle_keep_crests: Etkin iç kaleyi armasından seç
castle_keep_crests_tooltip: Birden fazla iç kale etkinken bir armaya tıklayarak iç kaleyi seçin veya seçimi kaldırın. İmleçle üzerine gelince gösterilen yardım varsayılan olarak açıktır.
castle_wall_tools: Sur yükseklikleri ve bağımsız mazgallar
castle_wall_tools_tooltip: Sur veya merdiven seçip menü üstündeki kontrolleri kullanın. Ayarlarını geri yüklemek için yanındaki “Reset” düğmesine tıklayın.
trees_spread_order: Ağaçları yayıldıkları zemine göre grupla
trees_spread_order_tooltip: Bitki Örtüsü’nde ağaçları yayıldıkları zemine göre gruplar. Çalılar varsayılan olarak ayrı satır alır.
trees_spread_outlines: Ağaçların yayıldığı zemini işaretle
trees_spread_outlines_tooltip: Bitki Örtüsü’nde yeşil verimli toprakta, bej ise verimsiz toprakta yayılan ağaçları gösterir.
herds_bird_bins: Tüm kargaları veya martıları kaldır
herds_bird_bins_tooltip: Hayvanlar’da o kuş türünü kaldırmak için karga veya martı simgesinin yanındaki çöp kutusuna tıklayın.
herds_group_warning: Sürü sınırına yaklaşınca uyar
herds_group_warning_tooltip: Sürüler ve birlik grupları harita sınırına yaklaştığında kalan yuvaları gösterir.
eraser_choice: Silginin neleri sileceğini seç
eraser_choice_tooltip: Silgi’yi seçin, ardından menünün üstünden Tümü, Hayvanlar, Birimler, Binalar, Bitki Örtüsü veya Kayalar’ı seçin.
eraser_seagulls: Uçan martıları sil
eraser_seagulls_tooltip: Uçan martıları kaldırmak için Silgi’yi kullanın. Silgi modları açıkken Hayvanlar veya Tümü’nü seçin.
map_settings_show_locked: Yükle penceresinde kilitli haritaları göster
map_settings_show_locked_tooltip: Düzenleyicinin Yükle penceresinde dosya listesinin altındaki “Show locked maps” kutusunu işaretleyin.
map_settings_menu: Genişletilmiş Harita Ayarları
map_settings_menu_tooltip: Düzenleyicide Alt+, tuşlarına basın. Boyutu uygulamak için “Map size” kaydırıcısını sürükleyip bırakın. “Haritaya Git” üzerindeki “Map Settings” düğmesi varsayılan olarak açıktır.
map_settings_size_refresh: Daha küçük haritaları hemen uygula
map_settings_size_refresh_tooltip: Düzenlerken daha küçük harita boyutunu hemen uygular ve yeni kenarları anında gösterir.
map_settings_camera_edge: Harita kenarının tamamını göster
map_settings_camera_edge_tooltip: En dıştaki harita karelerini görmek için kamerayı kenara kaydırın.
eraser_group: Silgi
eraser_group_descr: Arazi silgisinin neleri temizleyeceğini seçin.
map_settings_group: Harita ayarları
map_settings_group_descr: Harita türünü, boyutlarını ve bayraklarını değiştirin ya da kilitli haritalara göz atın.
qol: Kullanım kolaylığı
grid_group: Kaynak ızgarası
grid_key: Izgara için önerilen Alt kısayolu
grid_outside_editor: Oyun sırasında ızgaraya izin ver
grid_flattened_only: Izgara yalnızca düzleştirilmiş görünümde
grid_hide_in_v_view: V görünümünde ızgarayı gizle
grid_colour: Izgara rengi
grid_rotation_group: Kale yönü
grid_rotation_lines: İç kale dönüş sınırlarını göster
grid_mine_group: Demir madeni alanı
grid_mine_boxes: Demir madeni alanını göster
