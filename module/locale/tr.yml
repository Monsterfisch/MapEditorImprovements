counts_group: Harita sayaçları
counts_group_descr: Haritanın nesne sınırlarına ne kadar yaklaştığını gösterir.
counts_enabled: Harita nesne sayaçları
counts_enabled_tooltip: Anahtar düğmesinin üzerindeki kırmızı i’ye tıklayın, sonra Hayvanlar, Bitki Örtüsü, Kayalar veya içindeki bir öğenin üzerine gelin.
trees_group: Ağaçlar ve çalılar
trees_group_descr: Arazi modunda bitki örtüsü yerleştirip düzenleyin.
trees_growth: Fırça boyutu ağaç büyümesini belirler
trees_growth_tooltip: Bitki Örtüsü’nde bir ağaç ve fırça boyutu seçin. Boyut 4 yetişkin ağaç, 6 ve 7 ise kuru ağaç yerleştirir.
trees_apple: Bitki Örtüsü’nde elma ağacı
trees_apple_tooltip: Dikmeden önce Bitki Örtüsü’nden elma ağacını seçin.
trees_shrubs: Çalı renkleri
trees_shrubs_tooltip: Bitki Örtüsü’nde bir çalı seçin, ardından menünün üstündeki satırdan bir renk seçin.
trees_felled: Kesilmiş ağaç çeşitleri
trees_felled_tooltip: Bitki Örtüsü’nde bir ağaç seçin ve menünün üstündeki satırdan kütük sayısına göre kesilmiş çeşidi seçin.
trees_random_mix: Rastgele bitki örtüsü karışımı
trees_random_mix_tooltip: Çeşitleri karıştırmak için çalı veya ağaç satırındaki ? simgesine tıklayın. Durdurmak için tekrar tıklayın veya başka çeşit seçin.
trees_obstacles: Engellerin yanına ağaç
trees_obstacles_tooltip: Engellerin yanına ağaç dikmek için Bitki Örtüsü’nün sağ üst kutusunu işaretleyin.
trees_rocks_and_water: Kayalar ve su üzerine bitki örtüsü
trees_rocks_and_water_tooltip: Kayalar ve su üzerine dikim için Bitki Örtüsü’nün sağ alt kutusunu işaretleyin.
trees_preview: İmleç altında bitki örtüsü önizlemesi
trees_preview_tooltip: Normal yakınlaştırmada haritaya işaret ederek seçili ağaç veya çalıyı önizleyin.
trees_no_stacking: Üst üste binen bitki örtüsünü önle
trees_no_stacking_tooltip: Bitki örtüsünün aynı karede yığılmasını önler ve eski yığınları silgiyle temizler.
textures_group: Zemin dokuları
textures_group_descr: Arazi fırçasının zemin dokularını nasıl boyayacağını seçin.
textures_gravel_and_iron: Dokular’da çakıl ve demir
textures_gravel_and_iron_tooltip: Dokular’dan Çakıl veya Demir seçip haritaya boyayın.
textures_mask: Yalnızca başlangıç dokusunu boya
textures_mask_tooltip: Sol üstteki yarım dolu kareye tıklayın, sonra her darbeye değiştirmek istediğiniz dokudan başlayın.
textures_mask_by_type: Su çeşitlerini tek doku say
textures_mask_by_type_tooltip: Maske açıkken başlangıçtaki deniz, nehir veya sığlık dokusunun tüm çeşitleri üzerinde boyar.
water_group: Su
water_group_descr: Arazi modunda nehir ayrıntıları boyayın.
water_decorations: Su’da köpük ve küçük dalgalar
water_decorations_tooltip: Su menüsünden Köpük veya Küçük dalgalar seçip nehir karelerine boyayın.
water_foam_on_sea: Deniz karelerini köpüklü nehre çevir
water_foam_on_sea_tooltip: Deniz karelerini nehre çevirmek için Su menüsünden Köpük boyayın.
rocks_group: Kayalar
rocks_group_descr: Arazi modunda kayaları yerleştirin, döndürün ve silin.
rocks_signpost: Çarpışma haritalarında yön tabelası
rocks_signpost_tooltip: Bir çarpışma haritasında Kayalar’ı açıp Yön tabelası seçin.
rocks_random_preview: Her yerleştirmede rastgele kaya açısı
rocks_random_preview_tooltip: Arazi → Kayalar’da bir boyut seçip Rastgele döndürme’ye tıklayın. Her denemeden sonra önizleme başka açı seçer.
rocks_variants: Kaya çeşidi seç
rocks_variants_tooltip: Bir kaya boyutu seçip Kayalar’ın üstündeki bir çeşide tıklayın. En küçük boyut varsayılan olarak beşinci bir kaya sunar.
rocks_invisible: Görünmez kayalar yerleştir
rocks_invisible_tooltip: Yerleştirmeden önce Kayalar’ın sağındaki kutuyu işaretleyin. Görünmez kayalar hareketi ve inşaatı engeller.
rocks_erase_invisible: Görünmez kayaları sil
rocks_erase_invisible_tooltip: Görünmez kayalarla tıkalı kareleri temizlemek için arazi silgisini kullanın.
rocks_remove_lost: Kayıp kaya kayıtlarını temizle
rocks_remove_lost_tooltip: Kareleri değiştirmeden kaya yuvalarını boşaltmak için Kayalar’ın sağ altındaki “Remove lost rocks” düğmesine tıklayın.
heights_group: Yükseklikler
heights_group_descr: Arazi modunda araziyi şekillendirin.
heights_max_height: Yükseklikler’de Azami Yükseklik
heights_max_height_tooltip: Fırça altındaki zemini en yüksek seviyeye çıkarmak için Asgari Yükseklik yanındaki “Max Height” düğmesini seçin.
heights_tool_options: Yükseklik fırçası kontrolleri
heights_tool_options_tooltip: Menü üstünde fırça aralığı, gücü, arazi koruması ve kaya işlemesini ayarlamak için bir Yükseklikler aracı seçin.
heights_invert_key: Düzleştirmeyi ters çevirmek için basılı tut
heights_invert_key_tooltip: Düzleştir seçiliyken zemini pürüzlü yapmak için bu tuşu basılı tutun; tekrar düzleştirmek için bırakın.
castle_building_counts: Mini harita üzerinde bina sayaçları
castle_building_counts_tooltip: Kale modunda mini harita üzerindeki bina sayılarını görün. Üzerine gelme metni varsayılan olarak kenara çekilir.
castle_tower_ruins: Kule yıkıntıları
castle_tower_ruins_tooltip: Kuleler’in üstündeki çeşit satırından bir harabe seçin.
castle_tunnel_and_tents: Tünel girişi ve kuşatma çadırları
castle_tunnel_and_tents_tooltip: Tünelciler veya mühendisler loncasını seçin, menünün üstünden girişi veya bir çadırı seçin.
castle_statues: Ek heykel ve tapınaklar
castle_statues_tooltip: Bir heykel veya tapınak seçip menü üstünden çeşidini belirleyin ya da ek öğeleri İyi Şeyler’de bulun.
castle_barrier: Harabeler’de bariyer
castle_barrier_tooltip: Bariyeri Harabeler’in sağ altında bulabilirsiniz.
castle_several_keeps: Oyuncu başına birden fazla iç kale
castle_several_keeps_tooltip: Ek iç kaleleri normal yerleştirin. İç kale armaları açıkken etkin iç kaleyi seçmek için bir armaya tıklayın.
castle_several_storage: Birden fazla depolama ve asker toplama binası
castle_several_storage_tooltip: Ek depolama ve asker toplama binalarını normal yerleştirin. Ayrı depolar yakındaki kaynak erişimini değiştirebilir.
castle_tower_engines: Kule araçlarını yürünebilir karelere yerleştir
castle_tower_engines_tooltip: Ordu Binaları’ndan bir kule aracı seçip yürünebilir bir kareye yerleştirin.
castle_keep_parts: İç kalenin parçalarını yerleştir
castle_keep_parts_tooltip: Bir iç kale seçin ve İç Kaleler üstündeki satırdan “Keep only” veya “No stockpile” seçeneğini seçin.
castle_damaged_walls: Hasarlı sur veya merdiven yerleştir
castle_damaged_walls_tooltip: Bir sur veya merdiven seçip yerleştirmeden önce bina menüsünün üstündeki “Damaged” düğmesine tıklayın.
castle_variant_panels: Bina çeşidi seç
castle_variant_panels_tooltip: Desteklenen bir bina seçip bina menüsünün üstündeki satırdan bir çeşide tıklayın.
castle_ruined_cathedral: Yıkık görünümlü katedral yerleştir
castle_ruined_cathedral_tooltip: Bina menüsünün üstünden yıkık çeşidi seçin. Normal bir katedral gibi işlev görür.
castle_moat_kinds: Hendek türünü seç
castle_moat_kinds_tooltip: Kapı Binaları’nda Hendek’i seçin ve menünün üstünden “Dug”, “Planned” veya “Permanent” seçeneğini seçin.
castle_moat_on_marsh: Bataklıkta hendeğe izin ver
castle_moat_on_marsh_tooltip: Bataklığa hendek yerleştirin. Hendeği doldurmak altındaki bataklığı geri getirir.
castle_moat_removal_keeps_ground: Hendeği kaldırırken zemini koru
castle_moat_removal_keeps_ground_tooltip: Bir hendeği kaldırmak altındaki eski zemini geri getirir.
herds_group: Sürüler
herds_group_descr: Arazi modunda sürüleri ve kuşları yönetin.
herds_panel: Sürü boyutu ve davranışı
herds_panel_tooltip: Sürü hâlinde yaşayan bir hayvan türünü seçin. Sürünün büyüklüğünü ve davranışını Hayvanlar menüsünün üzerindeki panelden ayarlayın.
brushes_group: Fırçalar
brushes_group_descr: Düzenleyici fırçasının kareleri nasıl kapladığını değiştirir.
brushes_full_shape: Fırça şeklini düzelt
brushes_full_shape_tooltip: Aracı merkezde iki kez uygulamadan tüm fırça önizlemesini doldurur.
undo_group: Geri al ve yinele
undo_group_descr: Son düzenlemeler arasında geri ve ileri gidin.
undo_enabled: Geri al ve yinele
undo_enabled_tooltip: En fazla 20 düzenleme için sol üstteki oklara tıklayın veya Seçenekler > Özel Kısayollar altından Geri al/Yinele atayın.
pipette_group: Damlalık
pipette_group_descr: Bir kareden örnek alıp içeriğini haritada yeniden kullanın.
pipette_enabled: Damlalıkla arazi veya nesne kopyala
pipette_enabled_tooltip: Fırça boyutunun üstündeki damlalığa tıklayın; Yükseklikler, Dokular, Nesneler veya Tümü’nü seçip bir kaynak kareye tıklayarak boyayın.
pipette_select_key: Damlalık kısayolu
pipette_select_key_tooltip: Modlar arasında geçmek için bu tuşa tekrar basın veya Seçenekler > Özel Kısayollar altında Damlalık atayın.
pipette_read_key: Başka bir kareden örnek almak için basılı tut
pipette_read_key_tooltip: Damlalıkla yeni bir kaynak kareye tıklarken bu tuşu basılı tutun.
