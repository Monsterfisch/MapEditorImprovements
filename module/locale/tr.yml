counts_group: Harita sayaçları
counts_group_descr: |-
  Arazi düzenleyicide haritada kaç hayvan, ağaç ve kaya bulunduğunu ve oyun sınırlarına ne kadar yaklaşıldığını gösterir.
counts_enabled: Harita sayaçlarını göster
counts_enabled_tooltip: |-
  Hayvanlar, Bitki Örtüsü veya Kayalar düğmelerinin üzerine gelerek mevcut sayıyı ve oyun sınırını gösteren bir ipucu görün; örneğin «Ağaçlar ve çalılar: 812/1999». Hayvanlar ipucu ayrıca kendi sınırına sahip sürü ve grupları da gösterir.
  Hayvanlar menüsünde geyik, deve, tavşan ve aslan düğmeleri her birinin sayısını gösterir; Bitki Örtüsü menüsünde her ağaç ve çalı düğmesi o bitkinin sayısını gösterir.
  Anahtar düğmesinin üzerindeki kırmızı «i» düğmesi çalışırken tüm bunları açıp kapatır.
counts_shown: Düzenleyici açıldığında sayıları göster
counts_shown_tooltip: |-
  Kapalı: sayılar başlangıçta gizlidir ve «i» düğmesiyle açılır.
trees_group: Ağaçlar ve çalılar
trees_group_descr: |-
  Arazi düzenleyicide bitki örtüsü yerleştirirken daha fazla seçenek sunar.
trees_growth: Fırça boyutu ağacın büyüme aşamasını belirler
trees_growth_tooltip: |-
  Ağaçlar fırça boyutunun belirlediği büyüme aşamasında yerleştirilir: fırça 1 en küçük ağaçları, fırça 4 tam büyümüş ağaçları (düzenleyicinin normalde hep yerleştirdiği), fırça 5 oduncuların bir süre dokunmadığı tam büyümüş ağaçları, fırça 6 ve 7 kurumuş ağaçları (7 daha çabuk çürür) koyar. Çalılar etkilenmez.
trees_apple: Elma ağacı düğmesi
trees_apple_tooltip: |-
  Bitki Örtüsü menüsüne bir elma ağacı ekler. Görseli modül klasöründeki images/apple.png dosyasıdır (apple_hover.png ve apple_selected.png ile birlikte); değiştirmek için bunları yenileyin.
trees_shrubs: Daha fazla çalı
trees_shrubs_tooltip: |-
  Dört ek rengi bulunan çalı seçildiğinde, Bitki Örtüsü menüsünün üzerindeki satır beş rengin tamamını sunar.
trees_felled: Devrilmiş ağaçlar
trees_felled_tooltip: |-
  Bir ağaç seçildiğinde, Bitki Örtüsü menüsünün üzerindeki satır o ağacı önce ayakta, ardından tutabileceği her kütük sayısıyla devrilmiş olarak sunar (tam büyümüş ağaç için 9'dan 1'e kadar; en küçük ağaçlar 1 kütükle devrilir). Devrilmiş ağaç yerleştirmek için birine tıklayın; tekrar dik ağaçlara dönmek için ayaktaki ağaca, devrilmiş olana yeniden veya menüdeki ağaca tıklayın.
trees_random_mix: Ağaç satırlarında rastgele karışımlar
trees_random_mix_tooltip: |-
  Bitki Örtüsü menüsünün üzerindeki satırlara «?» işaretli düğmeler ekler:
  - Rastgele ağaç (devrilmiş ağaç satırının ilki): en küçükten fırça boyutuna kadar tüm büyüme aşamalarının rastgele karışımı. En küçük veya kurumuş ağaçlar için sunulmaz.
  - Rastgele devrilmiş ağaç (devrilmiş ağaç satırının sonuncusu): rastgele kütük sayılı devrilmiş ağaçlar.
  - Rastgele çalı (çalı satırının sonuncusu): beş çalı renginin rastgele karışımı.
  Karıştırmayı durdurmak için düğmeye tekrar tıklayın veya başka bir düğme seçin.
trees_obstacles: Engellerin yanına ağaç için onay kutusu
trees_obstacles_tooltip: |-
  Bitki Örtüsü menüsünün üst satırına bir onay kutusu ekler. İşaretliyken ağaçlar, oyunun normalde izin vermediği binaların, kayaların, surların ve diğer ağaçların hemen yanına yerleştirilebilir (çalılar zaten konulabilir). Durumunu görmek için üzerine gelin.
trees_rocks_and_water: Kaya ve su üzerine bitki örtüsü onay kutusu
trees_rocks_and_water_tooltip: |-
  Bitki Örtüsü menüsünün sağında, engellerin yanına ağaç kutusunun altında yer alan onay kutusu (başlangıçta kapalı). İşaretliyken ağaçlar ve çalılar bataklık, nehir, geçit, kayalık, iri taş ve çakıl zeminlere de yerleştirilebilir.
trees_sorted_rows: Bitki Örtüsü menüsü satırlarını düzenle
trees_sorted_rows_tooltip: |-
  Üst satırdaki çalıyı alt satıra taşır ve alt satırdaki çalıları sıralar; böylece üst satırda ağaçlar (elma ağacı ve onay kutusuyla birlikte), alt satırda ise tüm çalılar yer alır.
trees_preview: Ağaç önizlemesi
trees_preview_tooltip: |-
  Bir ağaç veya çalı seçiliyken fare altındaki karede dikilecek ağaç, fırçanın verdiği aşamada (veya seçili kütük sayısıyla devrilmiş hâlde) oyunun çizeceği biçimde gösterilir. Uzaklaştırılmış görünümde gösterilmez.
trees_no_stacking: Çalı yığılmasını önle
trees_no_stacking_tooltip: |-
  Zaten ağaç veya çalı bulunan bir kareye yeni bitki yerleştirilemez. Bazı çalılar (üst satırdaki çalı ve onunla sıralanan dört çalı) daha önce görünmez biçimde üst üste yığılıp ağaç sınırını kalıcı olarak tüketiyordu. Silgi artık bir karede üst üste binmiş tüm çalıları da temizler.
textures_group: Zemin dokuları
textures_group_descr: |-
  Arazi düzenleyicinin Dokular menüsü.
textures_gravel_and_iron: Dokular menüsünde çakıl ve demir
textures_gravel_and_iron_tooltip: |-
  Üst satıra Çakıl, alt satıra Demir ekler ve iki satırı dengeli dağıtır. Çakıl görseli images/gravel.png (gravel_hover.png ve gravel_selected.png ile) dosyasıdır.
textures_no_heights_iron: Demir yalnızca Dokular menüsünde
textures_no_heights_iron_tooltip: |-
  Dokular menüsünde zaten bulunduğu için Yükseklikler menüsündeki demir düğmesini kaldırır.
textures_mask: Maske düğmesi
textures_mask_tooltip: |-
  Arazi düzenleyici menüsünün sol üstüne bir Maske düğmesi (yarısı dolu kare) ekler. Açıkken doğa araçları (yükseklikler, dokular, su, ağaçlar ve çalılar, kayalar ve damlalık) yalnızca ilk tıkladığınız kareyle aynı dokuya sahip kareleri değiştirir; fareyi bıraktığınızda sonraki tıklama hedef dokuyu yeniden seçer.
textures_mask_by_type: Maske su çeşitlerini tek sayar
textures_mask_by_type_tooltip: |-
  Maske yalnızca tıklanan kareyle birebir aynı dokuya sahip kareleri geçirir (çimen, çalılık, sık çalılık, taşlar, kumsal… hepsi ayrıdır). Bu ayar açıkken aynı su türünün çeşitleri tek su sayılır: kenar ve derinlikleriyle tüm deniz; köpük, dalga ve şelale kenarlarıyla tüm nehir; tüm nehir geçitleri. Deniz, nehir ve geçit ayrı kalır.
water_group: Su
water_group_descr: |-
  Arazi düzenleyicinin Su menüsü.
water_decorations: Köpük ve küçük dalgalar
water_decorations_tooltip: |-
  İlk Stronghold'un düzenleyicisinden iki nehir süslemesini geri getirir; Crusader bunları hâlâ destekler ama düğmeleri yoktur: Köpük (şelale altındaki gibi beyaz köpük ve serpinti, fırça altındaki her nehir karesinde) ve Küçük dalgalar (fare altındaki tek nehir karesinde). İkisi de yalnızca nehir karelerine konur ve haritaya kaydedilir.
water_foam_on_sea: Denizde de köpük
water_foam_on_sea_tooltip: |-
  Köpük deniz karelerine de yerleştirilebilir; bu kareler köpüklü nehire dönüşür (köpük seçeneği açıkken).
rocks_group: Kayalar
rocks_group_descr: |-
  Arazi düzenleyicinin Kayalar menüsü.
rocks_signpost: Çarpışma haritalarının Kayalar menüsünde yol tabelası
rocks_signpost_tooltip: |-
  Çarpışma haritaları, yol tabelası düğmesi dâhil senaryo haritalarıyla aynı Kayalar menüsüne kavuşur.
rocks_random_preview: Rastgele döndürme önizlemede görünür
rocks_random_preview_tooltip: |-
  Rastgele döndürme düğmesi seçiliyken oyun kayayı o kadar hızlı döndürür ki fare altındaki önizleme yetişemez. Bu ayar açıkken saniyede bir kez döner ve tam koyacağınız kayayı gösterir.
rocks_variants: Kaya çeşitleri satırı
rocks_variants_tooltip: |-
  Kayalar menüsünün üzerindeki satır, seçilen kaya boyutunun dört çeşidini yerleştirileceği yönde gösterir. Yalnızca o çeşidi koymak için birine tıklayın; oyunun değişen çeşitlerine dönmek için tekrar tıklayın veya Kayalar menüsünden herhangi bir düğme seçin.
rocks_extra_rock: Ek küçük kaya
rocks_extra_rock_tooltip: |-
  En küçük kayalar için çeşit satırı beşinci bir seçenek daha sunar: oyunda bulunan ancak düzenleyicinin hiç koymadığı küçük bir kaya. Diğer tüm kayalar gibi haritaya kaydedilir.
rocks_invisible: Görünmez kayalar onay kutusu
rocks_invisible_tooltip: |-
  Kayalar menüsü düğmelerinin sağına bir onay kutusu ekler. İşaretliyken koyduğunuz her kaya, önce 4000 kaya koymaya gerek kalmadan doğrudan «görünmez kaya» olur: kareler doludur (bina dikilemez ve yürünemez) ancak kaya çizilmez, böylece önceki zemin görünmeye devam eder («2k taş numarası»). Normal kayalar için işareti kaldırın.
rocks_erase_invisible: Silgi görünmez kayaları da kaldırır
rocks_erase_invisible_tooltip: |-
  Arazi silgisi (ve onunla kaya kaldıran araçlar) görünmez kayaların karelerini de normal kayalar gibi boşaltır. Bu ayar olmadan her karede engel yok sayan çalıyı koyup silmek gerekirdi.
rocks_remove_lost: Kayıp kayaları kaldır düğmesi
rocks_remove_lost_tooltip: |-
  Kayalar menüsünün sağ altına «Kayıp kayaları kaldır» düğmesi ekler. Yükseltme/alçaltma aracının kırdığı ve tüm kareleri sonradan çalılarla örtülen bir kaya, hiç karesi kalmadan haritanın kaya listesinde kalır: görülemez, silinemez ama 4000 kaya yuvasından birini tüketir. Bu düğme tüm bu kayıtları listeden çıkarır; kareler değişmez.
heights_group: Yükseklikler
heights_group_descr: |-
  Arazi düzenleyicinin yükseklik araçları.
heights_max_height: Azami Yükseklik düğmesi
heights_max_height_tooltip: |-
  İlk Stronghold'un Azami Yükseklik aracını Yükseklikler menüsünde Asgari Yükseklik'in sağına geri getirir: fırça altındaki zemini 156 yüksekliğine çıkarır. Araç ve düğme görselleri Crusader'da hâlâ mevcuttu, yalnızca düğmesi çıkarılmıştı.
heights_tool_options: Yükseklik aracı seçenekleri
heights_tool_options_tooltip: |-
  Bir yükseklik aracı seçiliyken Yükseklikler menüsünün üzerindeki panel (alttan üste) şunları sunar:
  - Zemin dokularını sıfırla (başlangıçta kapalı): yükseklik araçlarının zemini oyundaki gibi düz görünümüne (platoları toprağa) döndürüp döndürmeyeceği. Kapalıyken yalnızca yükseklik değişir.
  - Kaya karelerini kır (başlangıçta kapalı): yükselt, alçalt, eşitle, tepe ve dağ araçlarının dokunduğu kayaları oyundaki gibi kırıp kırmayacağı (dokunulan kareler görünmez ve yürünebilir olurken kaya kalır). Kapalıyken kayalar bütün kalır.
  - Suyu yok say ve Tarım arazisini yok say (başlangıçta kapalı): deniz, nehir, geçit, bataklık ve hendek karelerini ya da çalılık, sık çalılık ve vaha çimeni karelerini değiştirmeden bırakır.
  - Yükselt, alçalt ve eşitle için: Aralığa oturt (başlangıçta açık), Ters çevir (yalnızca eşitle), yükseklik aralığı (başlangıçta 8–156; iki uçtan sürüklenebilir) ve güç. Aralığa oturt açıkken aralık dışındaki kareler aralığa çekilir; kapalıyken dokunulmaz. Ters çevir, eşitlemenin düzleştirmek yerine zemini engebeli yapmasını sağlar.
  - Kaya yüksekliği değişiklikleri (başlangıçta Tüm kaya): araçların dokunduğu kayaya ne yapacağı. Yalnızca kare sadece fırça altındaki kareleri hareket ettirir; Tüm kaya kayanın tüm karelerini birlikte taşır; Kayayı sil kayayı kaldırır (Asgari Yükseklik gibi).
  Aralık, Aralığa oturt, Ters çevir ve yok sayma kutuları harita düzenleyiciden çıkınca varsayılana döner.
heights_invert_key_on: Eşitlemeyi ters çevirmek için basılı tut
heights_invert_key_on_tooltip: |-
  Eşitleme aracı seçiliyken bu tuş basılı tutulduğu sürece araç zemini engebelendirir (Ters çevir işaretliymiş gibi); bırakınca tekrar düzleştirir.
heights_invert_key: Eşitlemeyi ters çevirme tuşu
heights_invert_key_tooltip: |-
  Eşitleme aracını ters çevirmek için basılı tutulacak tuş.
castle_group: Kale modu
castle_group_descr: |-
  Harita düzenleyicinin kale modundaki bina menüsü.
castle_building_counts: Mini haritanın üstünde bina sayaçları
castle_building_counts_tooltip: |-
  Mini haritanın üstünde haritanın toplam bina sayısını oyun sınırına karşı (iç kaleler, arazi yapıları ve bileşik bina parçaları dâhil her yapı sayılır), tüm oyuncuların toplam oyuncu binalarını ve seçili oyuncunun binalarını gösterir. Oyuncu binaları, bir düşmanın yok etmek üzere gönderilebileceği binalardır.
castle_tower_ruins: Kule yıkıntıları
castle_tower_ruins_tooltip: |-
  Kuleler menüsü açıkken üzerindeki bir satır beş kulenin yıkıntılarını sunar.
castle_tunnel_and_tents: Tünel girişi ve kuşatma çadırları
castle_tunnel_and_tents_tooltip: |-
  Askerî binalar menüsünde: tünelciler loncası seçiliyken üstteki satır bir tünel girişi; mühendisler loncası seçiliyken altı kuşatma çadırını sunar.
castle_statues: Heykel ve tapınaklar
castle_statues_tooltip: |-
  Kullanılmayan 2×2 heykeli, 2×2 tapınağı ve 1×1 tapınağı ekler: heykel ve tapınak çeşitlerinin sonunda (bkz. «Bina çeşitleri») veya bunlar kapalıysa iyi şeyler menüsünün üzerindeki satırda.
castle_barrier: Yıkıntılar menüsünde bariyer
castle_barrier_tooltip: |-
  Yıkıntılar menüsünün sağ altındaki boş yuvaya bir Bariyer düğmesi ekler: sonradan silinebilen 1×1 boyutunda bir bariyer.
castle_several_keeps: Oyuncu başına birden fazla iç kale
castle_several_keeps_tooltip: |-
  Yeni bir iç kale yerleştirmek artık oyuncunun önceki iç kalesini (ve kamp ateşini) silmez. En yeni iç kale oyuncunun etkin iç kalesi olur; diğerleri bina olarak kalır.
castle_several_storage: Birden fazla depolama ve asker toplama binası
castle_several_storage_tooltip: |-
  Kışlalar, paralı asker kampları, loncalar ve normalde oyuncuda yalnızca bir tane bulunan diğer binalar yenisi konduğunda artık silinmez; ek depolar, ambarlar ve cephaneliklerin ilkiyle bitişik olması gerekmez. İstediğiniz kadarı boş da kalabilir (oyun normalde en fazla 8 boş ambar/cephanelik ve 32 boş depo izin verir).
castle_tower_engines: Kule mangonelleri ve balistaları her yere
castle_tower_engines_tooltip: |-
  Askerî binalar menüsündeki kule mangoneli ve kule balistası yalnızca oyuncunun kendi kare ve yuvarlak kulelerine değil, bir birimin durabileceği her yere (zemin, surlar, kapılar, kuleler, iç kale) yerleştirilebilir: tıklanan kareye, kare başına bir tane, iç kale veya büyük kapı binasına 4'e kadar, büyük kale iç kalelerine 8'e kadar. Yerleştirilebilen her yerde önizleme dolu görünür.
castle_keep_parts: Kamp ateşi veya deposuz iç kale
castle_keep_parts_tooltip: |-
  Bir iç kale seçiliyken iç kaleler menüsünün üzerindeki satır iki ek seçenek sunar: «Yalnızca iç kale» (kamp ateşi alanı ve depo olmadan iç kale ile girişi) ve «Deposuz» (iç kale, girişi ve kamp ateşi alanı). Menüden bir iç kale seçmek tekrar tam iç kale yerleştirir.
  Önizleme ve alan kontrolü yalnızca o parçaları kapsar.
castle_hover_text: Bina adları daha solda
castle_hover_text_tooltip: |-
  Fare altındaki binanın adı («Oyuncu 1'in İç Kalesi») 100 piksel sola kayar, böylece mini haritanın üstündeki bina sayaçlarıyla çakışmaz.
castle_damaged_walls: Hasarlı surlar ve merdivenler
castle_damaged_walls_tooltip: |-
  Merdiven, alçak sur, yüksek sur veya mazgal seçiliyken kale binaları menüsünün üzerindeki satır «Hasarlı» seçeneğini sunar: konulan surlar yüksekliklerini koruyarak hasarlı sur tepesi alır. Menüden suru seçmek tekrar sağlam surlara döndürür.
castle_variant_panels: Bina çeşitleri
castle_variant_panels_tooltip: |-
  Bahçe, heykel, tapınak veya lağım çukuru seçiliyken menünün üzerindeki satır tüm çeşitlerini gösterir; oradan seçilen çeşit her saniye bir sonrakine dönmek yerine sabit kalır. Aynısı şehir menüsünün üstünde kulübe için de geçerlidir. Binayı menüden seçmek oyunun normal döngüsüne döner. Damlalık da tam çeşidi alır.
castle_ruined_cathedral: Yıkık katedral
castle_ruined_cathedral_tooltip: |-
  Katedral seçiliyken şehir menüsünün üzerindeki satır «Yıkık» seçeneğini sunar: yerleştirdiğiniz katedral, oyunun normalde yalnızca bir tarihî görevde gösterdiği yıkık görseli alır. Oyun içinde hâlâ tam çalışan bir katedraldir, yalnızca yıkık görünür. Menüden katedrali seçmek tekrar sağlam katedral koyar. Damlalık da yıkık katedrali yıkık olarak alır. Oyunun kendi tile_churches.gm1 dosyasını gerektirir (eski kopyalarda yıkık hâli yoktur, katedraller sağlam kalır).
castle_moat_kinds: Kazılmış, planlı ve kalıcı hendek
castle_moat_kinds_tooltip: |-
  Kapı binaları menüsünde hendek seçiliyken menünün üzerindeki satır üç seçenek sunar: Kazılmış (düzenleyicinin normal hendeği), Planlı (oyundaki gibi kazılmak üzere işaretli hendek) ve Kalıcı (oyunda kimsenin dolduramayacağı veya silemeyeceği kazılmış hendek). Menüden hendeği seçmek kazılmış hendeğe döner.
castle_moat_on_marsh: Bataklık üzerine hendek
castle_moat_on_marsh_tooltip: |-
  Harita düzenleyicide hendek tekrar bataklık üzerine yerleştirilebilir. Bataklık altta kalır ve hendek doldurulduğunda geri gelir.
castle_moat_removal_keeps_ground: Hendek kaldırma zemini korur
castle_moat_removal_keeps_ground_tooltip: |-
  Düzenleyicinin «hendeği kaldır» aracı yalnızca kazılmış veya planlı hendek bulunan kareleri değiştirir: hendeği kaldırır (kazılmış hendek normal zemin yüksekliğini geri alır) ve zemin dokusuna dokunmaz. Bu ayar olmadan fırça altındaki her kare düz toprağa döner.
herds_group: Sürüler
herds_group_descr: |-
  Arazi düzenleyicinin hayvanları.
herds_panel: Sürü paneli
herds_panel_tooltip: |-
  Geyik, aslan, tavşan veya deve seçiliyken Hayvanlar menüsünün üzerindeki panel bir sürünün kaç hayvandan oluştuğunu (sabit kısım artı rastgele kısım) ve hangi grup davranış türünü kullandığını gösterir. Onay kutusu sürüleri fırça büyüklüğünde yapar: 2 × fırça boyutu − 1 hayvan (1 ile 13 arası), rastgele kısım olmadan.
brushes_group: Fırçalar
brushes_group_descr: |-
  Arazi düzenleyicinin fırçaları.
brushes_full_shape: Tam şekilli fırçalar
brushes_full_shape_tooltip: |-
  Oyunun fırçaları fare altındaki kareyi iki kez sayar ve hem önizlemede hem yerleştirmede sol üst köşe karesini atlar. Bu ayar açıkken tam şekillerine kavuşurlar (harita düzenleyicide; oyunun kendi iç kullanımı değişmez).
undo_group: Geri al ve yinele
undo_group_descr: |-
  Harita düzenleyicinin sol üst köşesindeki geri al ve yinele düğmeleri.
undo_enabled: Geri al ve yinele
undo_enabled_tooltip: |-
  Harita düzenleyicinin sol üst köşesinde iki ok düğmesi: soldaki haritada yapılan son işlemi (yerleştirme, silme, boyama, yükseklikler) geri alır, sağdaki geri getirir; 20 adıma kadar. Yapılacak bir şey yoksa düğme gri görünür. Her tıklama bir adımdır, basılı tutularak yapılan bir fırça darbesi de öyledir. Haritada değişiklik yapmayan tıklamalar adım oluşturmaz. Başka bir harita yüklemek geçmişi sıfırlar.
pipette_group: Damlalık
pipette_group_descr: |-
  Arazi düzenleyicinin sol sütununda fırça boyutunun üstünde bir damlalık: bir karenin yüksekliğini ve/veya dokusunu alıp fırça altındaki karelere aktarır.
pipette_enabled: Damlalık
pipette_enabled_tooltip: |-
  Fırça boyutunun üstüne damlalık düğmesini ekler (fırça boyutu, cetvel ve silgi biraz aşağı kayar).
  Seçildiğinde menünün üzerinde bir satır — Yükseklikler, Dokular, Nesneler, Tümü — ve onun üzerinde damlalığın tuttuğu içerik görünür. Örnek almak için bir kareye tıklayın (damlalık tek kare gösterir), ardından fırça altındaki karelere uygulamak için tıklayın veya sürükleyin. Yükseklikler zemini, Dokular yükseklikleri değiştirmez. Nesneler karedeki bina, sur, ağaç veya kayayı alır: binalar ve surlar aynı oyuncu için kendi menü düğmesi gibi yerleştirilir (o oyuncunun arması seçilir); ağaçlar (aynı tür ve aşama veya aynı kütük sayısıyla devrilmiş) ve kayalar (aynı tür ve yön) kendi araçları gibi sürükleme dâhil yerleştirilir. Tümü ayrıca bir ağaç veya 1×1 kayayı alır ve fırça altındaki her kareye koyar. Damlalığı veya bir türünü tekrar seçmek onu boşaltır.
  Yükseklikler deniz, kumsal, bataklık, hendek, kaya, sur veya binalara uygulanmaz; dokular kaya, sur veya binalara uygulanmaz. Dik kenarlardaki uçurum kayaları temizlenir ve dik kalan yerlerde yeniden oluşur. Geri al damlalık darbelerini de geri alır.
pipette_select_key_on: Damlalık tuşu
pipette_select_key_on_tooltip: |-
  Damlalığı seçen (ve boşaltan) bir tuş. Damlalık seçiliyken tekrar basıldığında sonraki türe geçer: Yükseklikler, Dokular, Nesneler, Tümü.
pipette_select_key: Damlalık için tuş
pipette_select_key_tooltip: |-
  Harita düzenleyicide damlalığı seçen tuş. Olağan işlevini de sürdürür.
pipette_read_key_on: Kare almak için basılı tut
pipette_read_key_on_tooltip: |-
  Bu tuş basılı tutulurken dolu bir damlalık yeniden kare örneği alır (tıklayana kadar eskisi kalır). Bırakıldığında — içinde bir şey varsa — tekrar uygular.
pipette_read_key: Kare alma tuşu
pipette_read_key_tooltip: |-
  Damlalık doluyken yeni bir kare örneği almak için basılı tutulacak tuş.
pipette_any_tile_key_on: Herhangi bir kareye uygulamak için basılı tut
pipette_any_tile_key_on_tooltip: |-
  Deneysel: bu tuş basılı tutulurken damlalık deniz, bataklık, kayalar (yerinde kalır), surlar ve binalar dâhil fırça altındaki her kareye yükseklik ve doku uygular (harita kenarına asla). Nesnelerin nereye konabileceğini değiştirmez.
pipette_any_tile_key: Herhangi bir kareye uygulama tuşu
pipette_any_tile_key_tooltip: |-
  Damlalığın karenin üzerinde ne olduğunu yok sayması için basılı tutulacak tuş.
