menu_group: Düzenleyici menüsü
menu_group_descr: |-
  Ekranın altındaki düzenleyici menüsünün nasıl çizileceği.
menu_dust_clouds: Toz bulutları oyunu çökertebilir hatasını düzelt
menu_dust_clouds_tooltip: |-
  Hareket verisi kaybolmuş bir toz bulutu oyunun sıfıra bölüp çökmesine yol açıyordu. Bu ayar açıkken böyle bir bulut olduğu yerde kalır.
menu_always_update: Menüyü her zaman güncel tut
menu_always_update_tooltip: |-
  Oyun menüyü yalnızca fare üzerindeyken yeniden çizer. Başka bir yerde yapılan değişiklik — örneğin başka araç seçen bir kısayol ya da hayvan koyarken değişen sayaçlar — yalnızca fareyi menüye geri götürdüğünüzde görünür. Bu ayar açıkken menü harita düzenleyicide sürekli yeniden çizilir.
castle_all_players: Her haritada sekiz oyuncu arması
castle_all_players_tooltip: |-
  Mini haritanın yanındaki armalar yalnızca çok oyunculu haritalarda değil, her harita türünde sekiz oyuncunun tamamını gösterir.
castle_all_keeps: Her haritada malikâne ve büyük kale
castle_all_keeps_tooltip: |-
  İç kaleler menüsü çok oyunculu haritalarda da malikâne ve büyük kaleyi sunar.
castle_player_zero: Oyuncu 0 arması
castle_player_zero_tooltip: |-
  Oyuncu armalarının ortasındaki beyaz dokuzuncu arma, haritada bina ve birimlere sahip olabilen Oyuncu 0'ı seçer.
castle_keep_crests: Etkin iç kale armaları
castle_keep_crests_tooltip: |-
  Her iç kale üzerinde sahibinin armasını gösterir; oyuncunun etkin iç kalesi (lordun, başlangıç birimlerinin ve yeni köylülerin çıktığı yer) çerçeveli görünür. Bir armaya tıklamak o iç kaleyi etkin yapar; etkin olana tıklamak oyuncuyu etkin iç kalesiz bırakır. Yeni bir iç kale artık etkinliği otomatik devralmaz; etkin iç kale kaldırıldığında oyuncunun başka bir iç kalesi devralır. Ana depo her zaman etkin iç kaleyi takip eder (oyun eskiden ilk konulan depoyu tutuyordu, bu yüzden birden fazla iç kalede yapay zekâ kale alanını kapalı bulup kale planı kuramıyordu). «Oyuncu başına birden fazla iç kale» gerektirir.
castle_keep_crest_tooltip: İç kale arması ipucu
castle_keep_crest_tooltip_tooltip: |-
  Bir iç kale armasının üzerine gelindiğinde ne anlama geldiğini ve tıklamanın ne yapacağını gösterir. «Etkin iç kale armaları» gerektirir.
castle_wall_tools: Sur yükseklikleri ve serbest mazgallar
castle_wall_tools_tooltip: |-
  Mazgallar tek başına durabilir. Panelleri alçak, yüksek, hasarlı alçak ve hasarlı yüksek seçeneklerini sunar. Sur panelinin üzerindeki kaydırıcı yüksek surların, alçak surların ve mazgalların yüksekliğini (0–255) ve merdiven dikliğini (0–16) ayrı ayrı ayarlar; yanındaki Sıfırla seçili olanı olağan değerine döndürür ve harita düzenleyiciden çıkınca hepsi sıfırlanır.
trees_spread_order: Ağaçları yayılma zeminine göre sırala
trees_spread_order_tooltip: |-
  Bitki Örtüsü menüsünde önce verimli zeminde yayılan ağaçlar (vaha çimeni, sık ve seyrek çalılık), ardından verimsiz zeminde yayılan ağaç (toprak, taşlı toprak, kumullar) gelir: üçüncü ve dördüncü ağaç yer değiştirir.
trees_spread_outlines: Yayılma zemini için çerçeveler
trees_spread_outlines_tooltip: |-
  Verimli zeminde yayılan ağaçların etrafında ince yeşil çerçeve, verimsiz zeminde yayılan ağacın etrafında ince bej çerçeve gösterir. Elma ağacı yayılmaz ve çerçeve almaz.
herds_bird_bins: Tüm kargaları / martıları sil düğmeleri
herds_bird_bins_tooltip: |-
  Hayvanlar menüsünde karga ve martı düğmelerinin sağında kırmızı çöp kutusu düğmeleri: tek tıkla haritadaki tüm kargaları (ağaçlar kalır) veya tüm martıları kaldırır.
herds_animal_bin: Tüm hayvanları sil düğmesi
herds_animal_bin_tooltip: |-
  Hayvanlar menüsünün sağında Alt + E gibi haritadaki tüm hayvanları kaldıran kırmızı çöp kutusu düğmesi. Kargalar ve martılar kalır.
herds_group_warning: Sürü ve grup uyarısı
herds_group_warning_tooltip: |-
  Oluşturulabilecek 200'den az sürü ve grup kaldığında ekranın üstündeki bir satır kaç tane kaldığını bildirir — tıpkı oyunun birimler için gösterdiği satır gibi.
eraser_choice: Silgi seçim paneli
eraser_choice_tooltip: |-
  Silgi seçiliyken menünün üzerindeki panel neyi sileceğini belirler: Tümü (eskisi gibi), Hayvanlar (kargalar ve martılar dâhil), Birimler, Binalar (iç kaleler, yıkıntılar ve surlarla), Bitki Örtüsü veya Kayalar (görünmez kayalar dâhil).
eraser_seagulls: Silgi martıları da kaldırır
eraser_seagulls_tooltip: |-
  Silgi, sildiği karelerin üzerinde uçan martıları da kaldırır (Tümü veya Hayvanlar modunda).
map_settings_show_locked: Kilitli haritaları göster kutusu
map_settings_show_locked_tooltip: |-
  Düzenleyicinin Yükle penceresinde «Kilitli haritaları göster» onay kutusu. İşaretliyken kilitli haritalar da listelenir ve liste anında güncellenir.
map_settings_button: Harita Ayarları düğmesi
map_settings_button_tooltip: |-
  Haritanın menü ekranında Dengeli / Dengesiz ve İstila / Ekonomi düğmelerinin sağında bir Harita Ayarları düğmesi. Alt + , menüsünü açar.
map_settings_menu: Genişletilmiş Harita Ayarları menüsü
map_settings_menu_tooltip: |-
  Alt + , menüsüne bir başlık, Tek Oyunculu ve Çok Oyunculu, dört tek oyunculu harita türü (Kuşatma, İstila, Ekonomi, Serbest İnşa), dört harita boyutu artı Özel ve bir Harita boyutu kaydırıcısı (10 ile 400 arası; bırakıldığında boyut değişir), Dengeli, Tepenin Kralı, Haritayı kilitle ve bir Geri düğmesi ekler.
eraser_group: Silgi
eraser_group_descr: |-
  Arazi düzenleyicinin silgisinin neleri kaldıracağı.
map_settings_group: Harita ayarları
map_settings_group_descr: |-
  Haritanın ayarları: harita türü, boyutu, kilidi ve bunları gösteren menüler.
