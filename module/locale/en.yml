counts_group: Map counts
counts_group_descr: 'Shows in the landscape editor how many animals, trees and rocks the map has, and how close

  it is to the game''s limits.

  '
counts_enabled: Show map counts
counts_enabled_tooltip: 'Point at the Animals, Vegetation or Rocks button for a tooltip with the count and the

  game''s limit, for example "Trees and shrubs: 812/1999". The Animals tooltip also shows the

  herds and troops, which have a limit of their own.

  In the Animals menu, the deer, camel, rabbit and lion buttons show how many of each there

  are; in the Vegetation menu, every tree and shrub button shows how many of that plant there

  are.

  A red "i" button above the key button switches all of this on and off while you work.

  '
counts_shown: Numbers shown when the editor opens
counts_shown_tooltip: 'Off: the numbers start hidden, and the "i" button brings them up.

  '
trees_group: Trees and shrubs
trees_group_descr: 'More choice when placing vegetation in the landscape editor.

  '
trees_growth: Brush size sets the tree's growth stage
trees_growth_tooltip: 'Trees are placed at the growth stage of the brush size: brush 1 places the smallest trees,

  brush 4 fully grown ones (what the editor always places otherwise), brush 5 fully grown

  ones the woodcutters leave alone for a while, brush 6 and 7 dead trees (7 decays sooner).

  Shrubs are not affected.

  '
trees_apple: Apple tree button
trees_apple_tooltip: 'Adds an apple tree to the Vegetation menu. The picture is images/apple.png (with

  apple_hover.png and apple_selected.png) in the module''s folder; replace them to change it.

  '
trees_shrubs: More shrubs
trees_shrubs_tooltip: 'While the shrub with four more colours is chosen, a row above the Vegetation menu offers

  all five of them.

  '
trees_felled: Felled trees
trees_felled_tooltip: 'While a tree is chosen, a row above the Vegetation menu offers that tree standing (first)
  and

  felled, with every number of logs it can still hold (9 down to 1 for a fully grown tree; the

  smallest trees are felled with 1 log). Click one to place felled trees; click the standing

  tree, the felled one again or the tree in the menu to go back to standing trees.

  '
trees_random_mix: Random mixes in the tree rows
trees_random_mix_tooltip: "Adds buttons marked \"?\" to the rows above the Vegetation menu:\n- Random tree (first\
  \ in the felled tree row): trees of every growth stage from the smallest\n  up to the brush's, mixed at random.\
  \ Not offered for the smallest trees or dead ones.\n- Random felled tree (last in the felled tree row): felled\
  \ trees with a random number of\n  logs.\n- Random shrub (last in the shrub row): the five shrub colours mixed\
  \ at random.\nClick one again, or choose another button, to stop mixing.\n"
trees_obstacles: Check box for trees next to obstacles
trees_obstacles_tooltip: 'Adds a check box to the top row of the Vegetation menu. While it is ticked, trees can
  be

  placed right next to buildings, rocks, walls and other trees, which the game normally keeps

  them away from (shrubs can stand there anyway). Point at it to see whether it is on.

  '
trees_rocks_and_water: Check box for vegetation on rocks and water
trees_rocks_and_water_tooltip: A check box on the right of the Vegetation menu, below the one for trees next to
  obstacles (off at first). Ticked, trees and shrubs can also be placed on marsh, river, ford, rocky, boulder and
  gravel ground.
trees_sorted_rows: Tidy the Vegetation menu's rows
trees_sorted_rows_tooltip: 'Moves the shrub from the top row to the bottom row and sorts the bottom row''s shrubs,
  so

  the top row holds the trees (and the apple tree and the check box) and the bottom row all

  the shrubs.

  '
trees_preview: Tree preview
trees_preview_tooltip: 'While a tree or shrub is chosen, the tree it would plant is shown on the tile under the
  mouse,

  at the stage the brush gives it (or felled, with the felled tree''s logs), the way the game

  will draw it. Not while zoomed out.

  '
trees_no_stacking: No shrub stacks
trees_no_stacking_tooltip: 'A tree or shrub can no longer be placed on a tile that already has one. Some shrubs
  (the

  shrub of the top row and the four shrubs it was sorted with) used to pile up there, invisible

  but each taking a place of the tree limit for good. The eraser now also takes away every

  shrub piled up on a tile, so old stacks can be cleared.

  '
textures_group: Ground textures
textures_group_descr: 'The Textures menu of the landscape editor.

  '
textures_gravel_and_iron: Gravel and iron in the Textures menu
textures_gravel_and_iron_tooltip: 'Adds Gravel to the top row and Iron to the bottom row, and spreads both rows
  evenly. The

  gravel picture is images/gravel.png (with gravel_hover.png and gravel_selected.png).

  '
textures_no_heights_iron: Iron only in the Textures menu
textures_no_heights_iron_tooltip: 'Takes the iron button out of the Heights menu, now that the Textures menu has
  one.

  '
textures_mask: Mask button
textures_mask_tooltip: 'Adds a Mask button (a square, half filled) at the top left of the landscape editor''s menu.
  While

  it is on, the nature tools (heights, textures, water, trees and shrubs, rocks and the pipette) only

  change tiles that have the same texture as the tile you first clicked on;

  when you let go of the mouse, the next click picks the texture to paint over anew.

  '
textures_mask_by_type: Mask treats water variants as one
textures_mask_by_type_tooltip: 'The mask only lets through tiles of the same texture as the one you clicked; every
  texture stays

  its own (grass, scrub, thick scrub, stones, beach ... are all different). With this on, the

  variants of one water count as that water: all sea including its edges and deeper parts, all

  river including foam, waves and the waterfall edges where it runs down a slope, all river

  crossing. Sea, river and river crossing stay apart.

  '
water_group: Water
water_group_descr: 'The water menu of the landscape editor.

  '
water_decorations: Foam and small waves
water_decorations_tooltip: 'Brings back two river decorations from the first Stronghold''s editor, which Crusader
  still

  supports but has no buttons for: Foam (white water and rising spray, as below a waterfall,

  on every river tile under the brush) and Small waves (on the one river tile under the

  mouse). Both only go on river tiles and are saved in the map.

  '
water_foam_on_sea: Foam on the ocean too
water_foam_on_sea_tooltip: 'Foam can also be laid on ocean tiles, which then become river with foam (with the foam

  setting on).

  '
rocks_group: Rocks
rocks_group_descr: 'The Rocks menu of the landscape editor.

  '
rocks_signpost: Signpost in the Rocks menu of skirmish maps
rocks_signpost_tooltip: 'Skirmish maps get the same Rocks menu as scenario maps, with the signpost button.

  '
rocks_random_preview: Random rotation shows in the preview
rocks_random_preview_tooltip: 'With the random rotation button chosen, the game turns the rock so fast that the
  preview

  under the mouse cannot follow it. With this on it turns once a second instead, and the

  preview shows the rock you are about to place.

  '
rocks_variants: Rock variant row
rocks_variants_tooltip: 'A row above the Rocks menu shows the four variants of the chosen rock size, turned the
  way

  they would be placed. Click one to place only that variant; click it again, or any button

  of the Rocks menu, to go back to the game''s changing variants.

  '
rocks_extra_rock: Extra small rock
rocks_extra_rock_tooltip: 'For the smallest rocks, the variant row also offers a fifth one: a small rock the game
  has

  but the editor never places. It is saved in the map like any other rock.

  '
rocks_invisible: Invisible rocks check box
rocks_invisible_tooltip: 'Adds a check box to the right of the Rocks menu''s buttons. While it is ticked, every
  rock

  you place is an "invisible rock" straight away, without placing 4000 rocks first: the

  tiles are taken (nothing can be built or walk there) but no rock is drawn, so they keep

  showing what was there before (the "2k stones trick"). Untick it for normal rocks.

  '
rocks_erase_invisible: The eraser removes invisible rocks
rocks_erase_invisible_tooltip: 'The landscape eraser (and the tools that remove rocks with it) frees the tiles of
  invisible

  rocks too, the way it removes normal rocks. Without this, each tile needs the shrub trick:

  place the shrub that ignores obstacles on it and erase that.

  '
rocks_remove_lost: Remove lost rocks button
rocks_remove_lost_tooltip: 'Adds a "Remove lost rocks" button at the bottom right of the Rocks menu. A rock the
  raise or

  lower tool broke, whose tiles were then all covered with shrubs, stays in the map''s list of

  rocks with no tile left: you cannot see, erase or reach it, and it uses up one of the 4000

  rock slots. The button finds every such rock and takes it off the list. Tiles are not changed.

  '
heights_group: Heights
heights_group_descr: 'The height tools of the landscape editor.

  '
heights_max_height: Max Height button
heights_max_height_tooltip: 'Brings back the first Stronghold''s Max Height tool, right of Min Height in the Heights
  menu:

  it sets the ground under the brush to height 156. Crusader still has the tool and its button

  pictures, only the button was taken out.

  '
heights_tool_options: Height tool options
heights_tool_options_tooltip: 'While a height tool is chosen, a panel above the Heights menu offers (in rows from
  the bottom):

  - Reset ground textures (off at first): whether the height tools also turn the ground under

  them back to its plain look (and the plateaus to dirt), as the game does. Off, they only

  change the height.

  - Break rock tiles (off at first): whether raise, lower, equalize, hill and mountain break the

  rocks they touch the way the game does (the touched tiles turn invisible and walkable while the

  rock stays). Off, rocks stay whole.

  - Ignore water and Ignore farmland (off at first): the height tools leave sea, river, ford,

  marsh and moat tiles, or scrub, thick scrub and oasis grass tiles, as they are.

  - For raise, lower and equalize: Snap to range (on at first), Invert (equalize only), the

  height range (8 to 156 at first; drag either end) and the strength. With Snap to range on,

  tiles outside the range are brought into it, as the game does; off, they are left alone.

  Invert makes equalize roughen the ground instead of smoothing it.

  - Rock height changes (Whole rock at first): what the height tools do to a rock they touch.

  Tile only moves just the tiles under the brush; Whole rock moves all of the rock''s tiles by the

  same amount; Erase rock removes the rock, as min height always did.

  The range, Snap to range, Invert and the ignore boxes go back to their defaults when you leave

  the map editor.

  '
heights_invert_key_on: Hold to invert equalize
heights_invert_key_on_tooltip: 'While this key is held with the equalize tool chosen, equalize roughens the ground
  (as with

  Invert ticked); let go and it smooths again.

  '
heights_invert_key: Key to invert equalize
heights_invert_key_tooltip: 'The key to hold for inverting the equalize tool.

  '
castle_group: Castle mode
castle_group_descr: 'The building menu of the map editor''s castle mode.

  '
castle_building_counts: Building counts above the minimap
castle_building_counts_tooltip: 'Shows above the minimap how many buildings the map has against the game''s limit
  (every

  building counts, including keeps, landscape buildings and the parts some buildings are made

  of), how many player buildings all players have together, and how many the current player

  has. Player buildings are the ones an enemy can be sent to destroy.

  '
castle_tower_ruins: Tower ruins
castle_tower_ruins_tooltip: 'While the Towers menu is open, a row above it offers the ruins of the five towers.

  '
castle_tunnel_and_tents: Tunnel entrance and siege tents
castle_tunnel_and_tents_tooltip: 'In the army buildings menu: with the tunnelers'' guild chosen, a row above the
  menu offers a

  tunnel entrance; with the engineers'' guild chosen, the six siege tents.

  '
castle_statues: Statue and shrines
castle_statues_tooltip: 'Adds the unused 2x2 statue, 2x2 shrine and 1x1 shrine: at the end of the statue''s and
  the

  shrine''s variants (see "Building variants"), or, with those off, in a row above the menu of

  good things.

  '
castle_barrier: Barrier in the Ruins menu
castle_barrier_tooltip: 'Adds a Barrier button in the free spot at the bottom right of the Ruins menu: a 1x1 barrier

  that can be deleted again.

  '
castle_several_keeps: Several keeps per player
castle_several_keeps_tooltip: 'Placing a keep no longer removes the player''s earlier keep (and its campfire). The
  newest

  keep is the player''s active one, the others stay as buildings.

  '
castle_several_storage: Several storage and recruitment buildings
castle_several_storage_tooltip: 'Barracks, mercenary posts, guilds and the other buildings a player has only one
  of are no

  longer removed when another one is placed, and further stockpiles, granaries and armouries

  need not touch the first one. Any number of them may also be empty (the game allows only 8

  empty granaries or armouries and 32 empty stockpiles).

  '
castle_tower_engines: Tower mangonels and ballistae anywhere
castle_tower_engines_tooltip: 'The tower mangonel and tower ballista of the army buildings menu can be put wherever
  a unit

  could be put (the ground, walls, gates, towers, the keep), not only on the player''s own square

  and round towers: on the clicked tile, one to a tile, up to 4 on a keep or large gatehouse and

  8 on the large stronghold keeps. The preview is solid wherever a click places one.

  '
castle_keep_parts: Keep without campfire or stockpile
castle_keep_parts_tooltip: 'While one of the keeps is chosen, a row above the keeps menu offers it placed in two
  more

  ways: "Keep only" (the keep and its entrance, no campfire area and no stockpile) and "No

  stockpile" (keep, entrance and campfire area). Choosing a keep in the menu places the whole

  keep again.

  The preview and the check for room show only those parts.

  '
castle_hover_text: Building names further left
castle_hover_text_tooltip: 'The name of the building under the mouse ("Player 1''s Keep") moves 100 pixels to the
  left,

  so it no longer runs into the building counts above the minimap.

  '
castle_damaged_walls: Damaged walls and stairs
castle_damaged_walls_tooltip: 'While the stairs, low wall, high wall or crenellated wall is chosen, a row above
  the castle

  buildings menu offers it "Damaged": the walls you place get the top of a damaged wall (they

  keep their height). Choosing the wall in the menu places undamaged walls again.

  '
castle_variant_panels: Building variants
castle_variant_panels_tooltip: 'While a garden, statue, shrine or cesspit is chosen, a row above the menu offers
  each of its

  variants; one chosen there stays chosen instead of turning into the next one every second.

  The same for the hovel: a variant chosen above the town menu is placed every time instead of

  the player''s next one. Choosing the building in the menu itself goes back to the game''s way.

  The pipette takes the exact variant too.

  '
castle_ruined_cathedral: Ruined cathedral
castle_ruined_cathedral_tooltip: 'While the cathedral is chosen, a row above the town menu offers it "Ruined": the
  cathedral you

  place gets the ruined picture the game otherwise shows only in one historical mission. In a

  game it is still a whole, working cathedral that just looks ruined. Choosing the cathedral in

  the menu places normal ones again. The pipette takes a ruined cathedral as ruined. Needs the

  game''s own tile_churches.gm1 (older copies have no ruin in it; then cathedrals stay whole).

  '
castle_moat_kinds: Dug, planned and permanent moat
castle_moat_kinds_tooltip: 'While the moat is chosen in the gatehouses menu, a row above the menu offers it three
  ways:

  Dug (the editor''s usual moat), Planned (moat marked out to be dug, as in a game) and

  Permanent (dug moat that nobody can fill in or delete in a game). Choosing the moat in the

  menu goes back to dug moat.

  '
castle_moat_on_marsh: Moat on marsh
castle_moat_on_marsh_tooltip: 'In the map editor moat can be placed on marsh again. The marsh stays under it, so
  it comes

  back when the moat is filled in.

  '
castle_moat_removal_keeps_ground: Removing moat keeps the ground
castle_moat_removal_keeps_ground_tooltip: 'The editor''s "remove moat" only changes tiles with dug or planned moat:
  it takes the moat

  away (dug moat gets the normal ground height back) and leaves the ground''s texture alone.

  Without this it turns every tile under the brush into plain dirt.

  '
herds_group: Herds
herds_group_descr: 'The animals of the landscape editor.

  '
herds_panel: Herd panel
herds_panel_tooltip: 'While the deer, lion, rabbit or camel is chosen, a panel above the Animals menu shows how

  many animals a herd gets (a fixed part plus a random part) and which group behaviour type the herd

  uses. Its check box makes herds as big as the brush: 2 x brush size - 1 animals (1 to 13),

  with no random part.

  '
brushes_group: Brushes
brushes_group_descr: 'The brushes of the landscape editor.

  '
brushes_full_shape: Brushes with their full shape
brushes_full_shape_tooltip: 'The game''s brushes count the tile under the mouse twice and leave out the tile that
  should

  be their top left corner, in the preview and when placing. With this on they have their

  whole shape (in the map editor; the game''s own use of the same walk is left alone).

  '
undo_group: Undo and redo
undo_group_descr: 'Undo and redo buttons in the map editor''s top left corner.

  '
undo_enabled: Undo and redo
undo_enabled_tooltip: 'Two arrow buttons in the top left corner of the map editor: the left one takes back the last

  thing done on the map - placing, removing, painting, heights - and the right one puts it

  back, for up to 20 steps. A button is greyed out while there is nothing to take back or put

  back. Every click is one step, and so is a brush stroke held down. Clicks that change

  nothing on the map (with no tool chosen, for example) make no step. Loading another map

  starts the history afresh.

  '
pipette_group: Pipette
pipette_group_descr: 'A pipette in the landscape editor''s left column, above the brush size: it takes the heights

  and/or textures of one tile and gives them to the tiles under the brush.

  '
pipette_enabled: Pipette
pipette_enabled_tooltip: 'Adds the pipette button above the brush size (brush size, ruler and eraser move down a
  little).

  Choosing it shows a row above the menu - Heights, Textures, Objects, All - and above that what

  the pipette holds. Click a tile to take it (the pipette shows one tile), then click or drag to

  give it to the tiles under the brush. Heights leave the ground alone, textures leave the

  heights alone. Objects takes the building, wall, tree or rock on a tile: buildings and walls

  are then placed like their own menu button does, for the same player (that player''s shield

  gets chosen), trees (same kind and stage, or felled with

  the same logs) and rocks (same kind and turn) like the tree and rock tools, dragging included. All also takes
  a tree or 1x1 rock

  and puts one on every tile under the brush. Choosing the pipette or one of its kinds again

  empties it.

  Heights are not given to sea, beach, marsh, moat, rocks, walls or buildings; textures not to

  rocks, walls or buildings. Cliff rocks (the ones the editor puts on steep edges) are cleared

  and come back where an edge stays steep. Undo takes pipette strokes back like any other.

  '
pipette_select_key_on: Pipette key
pipette_select_key_on_tooltip: 'A key that chooses the pipette (and empties it). Pressed again while the pipette
  is chosen,

  it goes on to the next kind: Heights, Textures, Objects, All.

  '
pipette_select_key: Key for the pipette
pipette_select_key_tooltip: 'The key that chooses the pipette in the map editor. It still does its usual job as
  well.

  '
pipette_read_key_on: Hold to take a tile
pipette_read_key_on_tooltip: 'While this key is held, a pipette that holds something takes a tile again (the old
  one stays

  until you click). Let go and it gives again - if it holds anything.

  '
pipette_read_key: Key to take a tile
pipette_read_key_tooltip: 'The key to hold for taking a tile while the pipette holds something.

  '
pipette_any_tile_key_on: Hold to give to any tile
pipette_any_tile_key_on_tooltip: 'Experimental: while this key is held, the pipette gives heights and textures to
  every tile

  under the brush, also sea, marsh, rocks (which stay), walls and buildings (never the map''s

  edge). It does not change where objects may be placed.

  '
pipette_any_tile_key: Key to give to any tile
pipette_any_tile_key_tooltip: 'The key to hold so that the pipette ignores what a tile has on it.

  '
