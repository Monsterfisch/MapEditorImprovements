counts_group: Map counts
counts_group_descr: See how close the map is to its object limits.
counts_enabled: Map object counts
counts_enabled_tooltip: Click the red i above the key button, then hover over Animals, Vegetation, Rocks or an item in those menus.
trees_group: Trees and shrubs
trees_group_descr: Place and arrange vegetation in Landscape mode.
trees_growth: Brush size sets tree growth
trees_growth_tooltip: Choose a tree and brush size in Vegetation. Size 4 is fully grown and sizes 6 and 7 place dead trees.
trees_apple: Apple tree in Vegetation
trees_apple_tooltip: Choose the apple tree in Vegetation before planting.
trees_shrubs: Shrub colors
trees_shrubs_tooltip: Select a shrub in Vegetation, then choose a color in the row above the menu.
trees_felled: Felled tree variants
trees_felled_tooltip: Select a tree in Vegetation and choose the felled variant by log count in the row above the menu.
trees_random_mix: Random vegetation mix
trees_random_mix_tooltip: Click ? in a shrub or tree variant row to mix variants. Click it again or choose another variant to stop.
trees_obstacles: Trees next to obstacles
trees_obstacles_tooltip: Tick the upper box on the right of Vegetation to plant trees beside obstacles.
trees_rocks_and_water: Vegetation on rocks and water
trees_rocks_and_water_tooltip: Tick the lower box on the right of Vegetation to plant on rocks and water.
trees_preview: Preview vegetation under the cursor
trees_preview_tooltip: At normal zoom, point at the map to preview the selected tree or shrub.
trees_no_stacking: Prevent stacked vegetation
trees_no_stacking_tooltip: Keep vegetation from piling up on one tile and clear old stacks with the eraser.
textures_group: Ground textures
textures_group_descr: Choose how the Landscape brush paints ground textures.
textures_gravel_and_iron: Gravel and iron in Textures
textures_gravel_and_iron_tooltip: Choose Gravel or Iron in Textures and paint it onto the map.
textures_mask: Paint only the starting texture
textures_mask_tooltip: Click the half-filled square at the top left, then start each stroke on the texture to change.
textures_mask_by_type: Treat water variants as one texture
textures_mask_by_type_tooltip: With the mask on, paint across variants of the starting sea, river or ford texture.
water_group: Water
water_group_descr: Paint river details in Landscape mode.
water_decorations: Foam and small waves in Water
water_decorations_tooltip: Choose Foam or Small waves in Water and paint them onto river tiles.
water_foam_on_sea: Turn sea tiles into foaming river
water_foam_on_sea_tooltip: Paint Foam from the Water menu onto sea tiles to turn them into river.
rocks_group: Rocks
rocks_group_descr: Place, orient and remove rocks in Landscape mode.
rocks_signpost: Signpost in skirmish maps
rocks_signpost_tooltip: Open Rocks on a skirmish map and choose Signpost.
rocks_random_preview: Random rock angle per placement
rocks_random_preview_tooltip: In Landscape → Rocks, choose a size and click Random rotation. The preview picks another angle after each placement attempt.
rocks_variants: Choose a rock variant
rocks_variants_tooltip: Choose a rock size and click a variant above Rocks. The smallest size offers a fifth rock by default.
rocks_invisible: Place invisible rocks
rocks_invisible_tooltip: Tick the box to the right of Rocks before placing. Invisible rocks block movement and building.
rocks_erase_invisible: Erase invisible rocks
rocks_erase_invisible_tooltip: Use the landscape eraser to clear tiles blocked by invisible rocks.
rocks_remove_lost: Clear lost rock records
rocks_remove_lost_tooltip: Click Remove lost rocks at the bottom right of Rocks to free rock slots without changing tiles.
heights_group: Heights
heights_group_descr: Shape terrain in Landscape mode.
heights_max_height: Max Height in Heights
heights_max_height_tooltip: Choose Max Height beside Min Height to raise the ground under the brush to its maximum height.
heights_tool_options: Height brush controls
heights_tool_options_tooltip: Choose a Heights tool to adjust brush range, strength, terrain protection and rock handling above the menu.
heights_invert_key: Hold to reverse Equalize
heights_invert_key_tooltip: With Equalize selected, hold this key to roughen the ground and release it to smooth again.
castle_building_counts: Building counts above the minimap
castle_building_counts_tooltip: Read building counts above the minimap in Castle mode. Hover text moves aside by default.
castle_tower_ruins: Tower ruins
castle_tower_ruins_tooltip: Choose a ruin in the variant row above Towers.
castle_tunnel_and_tents: Tunnel entrance and siege tents
castle_tunnel_and_tents_tooltip: Select the tunnellers’ or engineers’ guild and choose the entrance or a tent above the menu.
castle_statues: Extra statue and shrines
castle_statues_tooltip: Select a statue or shrine and choose its variant above the menu, or find the extra items in Good Things.
castle_barrier: Barrier in Ruins
castle_barrier_tooltip: Find Barrier at the lower right of Ruins.
castle_several_keeps: Multiple keeps per player
castle_several_keeps_tooltip: Place extra keeps normally. With keep crests enabled, click a crest to choose the active keep.
castle_several_storage: Multiple storage and recruitment buildings
castle_several_storage_tooltip: Place extra storage and recruitment buildings normally. Separate stockpiles can change which resources are available nearby.
castle_tower_engines: Place tower engines on walkable tiles
castle_tower_engines_tooltip: Choose a tower engine in Army Buildings and place it on a walkable tile.
castle_keep_parts: Place parts of a keep
castle_keep_parts_tooltip: Select a keep and choose Keep only or No stockpile in the row above Keeps.
castle_damaged_walls: Place damaged walls or stairs
castle_damaged_walls_tooltip: Select a wall or stair and click Damaged above the building menu before placing it.
castle_variant_panels: Choose a building variant
castle_variant_panels_tooltip: Select a supported building and click a variant in the row above the building menu.
castle_ruined_cathedral: Place a ruined-looking cathedral
castle_ruined_cathedral_tooltip: Choose the ruined variant above the building menu. It functions as a cathedral.
castle_moat_kinds: Choose the moat type
castle_moat_kinds_tooltip: Select Moat in Gatehouses and choose Dug, Planned or Permanent above the menu.
castle_moat_on_marsh: Allow moats on marsh
castle_moat_on_marsh_tooltip: Place moats on marsh. Filling a moat restores the marsh underneath.
castle_moat_removal_keeps_ground: Keep terrain when removing moats
castle_moat_removal_keeps_ground_tooltip: Removing a moat brings back the ground underneath.
herds_group: Herds
herds_group_descr: Manage herds and birds in Landscape mode.
herds_panel: Herd size and behavior
herds_panel_tooltip: Select a herd animal and use the panel above Animals to set its size and behavior.
brushes_group: Brushes
brushes_group_descr: Change how the editor brush covers tiles.
brushes_full_shape: Fix the brush shape
brushes_full_shape_tooltip: Fill the whole brush preview without applying the tool twice at the center.
undo_group: Undo and redo
undo_group_descr: Step back and forward through recent edits.
undo_enabled: Undo and redo
undo_enabled_tooltip: Click the arrows at the top left for up to 20 edits, or bind Undo and Redo under Options → Custom Hotkeys.
pipette_group: Pipette
pipette_group_descr: Sample a tile and reuse its contents on the map.
pipette_enabled: Copy terrain or objects with the pipette
pipette_enabled_tooltip: Click the pipette above brush size, choose Heights, Textures, Objects or All, then click a source tile and paint.
pipette_select_key: Pipette shortcut
pipette_select_key_tooltip: Press this key again to cycle modes, or bind Pipette under Options → Custom Hotkeys.
pipette_read_key: Hold to sample another tile
pipette_read_key_tooltip: Hold this key while clicking a new source tile with the pipette.
