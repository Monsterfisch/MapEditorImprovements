menu_group: Editor behavior
menu_group_descr: Control the editor’s display and redraw behavior.
map_settings_size_refresh: Apply smaller maps immediately
map_settings_size_refresh_tooltip: Apply a smaller map size while editing and see the new edges immediately.
map_settings_camera_edge: Show the full map edge
map_settings_camera_edge_tooltip: Move the camera to the edge to see the outermost map tiles.
menu_compass: Show north in the editor
menu_compass_tooltip: Read north from the fixed compass at the top left, below Undo and Redo if enabled.
menu_compass_turn: Ctrl reverses the map turn
menu_compass_turn_tooltip: Open the right-click ring and hold Ctrl while moving onto its compass to turn counterclockwise.
menu_dust_clouds: Prevent dust-cloud crashes
menu_dust_clouds_tooltip: Prevent dust-cloud crashes while editing the map.
menu_always_update: Update the editor panel while working
menu_always_update_tooltip: Keep the editor controls up to date while the mouse is over the map.
castle_all_players: Show all eight player shields
castle_all_players_tooltip: Choose any of the eight shields next to the minimap in Castle mode.
castle_all_keeps: Manor and stronghold on every map
castle_all_keeps_tooltip: Select the Manor or Stronghold from Keeps on any map type.
castle_player_zero: Show the neutral player shield
castle_player_zero_tooltip: Click the white ninth shield next to the minimap to place objects for player 0.
castle_keep_ground: Preserve ground when placing keeps
castle_keep_ground_tooltip: Place keeps without flattening the ground beneath them.
castle_rotation: Building rotation list
castle_rotation_tooltip: In Castle mode, click Rotation just above the lower-left menu and choose an angle before placing a supported building.
castle_unit_colour: Choose unit colors separately from ownership
castle_unit_colour_tooltip: Choose a crest above the European or Arabian unit menu to change how the unit looks.
castle_keep_crests: Choose the active keep by its crest
castle_keep_crests_tooltip: With multiple keeps enabled, click a crest to select or clear the active keep. Hover help is on by default.
castle_wall_tools: Wall heights and freestanding crenellations
castle_wall_tools_tooltip: Select walls or stairs and use the controls above the menu. Click the adjacent Reset to restore their settings.
trees_spread_order: Group trees by spreading ground
trees_spread_order_tooltip: Find trees grouped by the ground they spread on in Vegetation. Shrubs get their own row by default.
trees_spread_outlines: Mark where trees spread
trees_spread_outlines_tooltip: In Vegetation, green marks trees that spread on fertile ground and beige marks those that spread on infertile ground.
herds_bird_bins: Remove all crows or seagulls
herds_bird_bins_tooltip: In Animals, click the bin beside the crow or seagull icon to remove that bird type.
herds_animal_bin: Add a button to erase all land animals (Alt+E)
herds_group_warning: Warn near the herd limit
herds_group_warning_tooltip: See the remaining slots when herds and troop groups approach the map limit.
eraser_choice: Choose what the eraser removes
eraser_choice_tooltip: Select Eraser, then choose All, Animals, Units, Buildings, Vegetation or Rocks above the menu.
eraser_seagulls: Erase flying seagulls
eraser_seagulls_tooltip: Use Eraser to remove flying gulls. With eraser modes enabled, choose Animals or All.
map_settings_show_locked: Show locked maps in Load
map_settings_show_locked_tooltip: Tick Show locked maps below the file list in the editor’s Load dialog.
map_settings_menu: Expanded Map Settings
map_settings_menu_tooltip: Press Alt+, in the editor. Drag the Map size slider and release to apply the size. The Map Settings button above To Map is on by default.
eraser_group: Eraser
eraser_group_descr: Choose what the landscape eraser clears.
map_settings_group: Map settings
map_settings_group_descr: Change the map type, dimensions and flags, or browse locked maps.
