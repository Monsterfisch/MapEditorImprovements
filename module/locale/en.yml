menu_group: Editor menu
menu_group_descr: 'How the editor''s menu at the bottom of the screen is drawn.

  '
menu_dust_clouds: Dust clouds cannot crash the game
menu_dust_clouds_tooltip: 'A dust cloud whose movement data has been lost made the game divide by zero and crash.
  With

  this on, such a cloud stays where it is instead.

  '
menu_always_update: Always keep the menu up to date
menu_always_update_tooltip: 'The game only redraws the menu while the mouse is over it. A change made elsewhere,
  for

  example a hotkey that picks another tool, or the counts changing as you place animals,

  only shows once you move the mouse back onto the menu. With this on, the menu is redrawn

  all the time in the map editor.

  '
castle_all_players: All eight player shields on every map
castle_all_players_tooltip: The shields beside the minimap show all eight players on every map type, not only on
  multiplayer maps.
castle_all_keeps: Manor house and stronghold on every map
castle_all_keeps_tooltip: The keeps menu offers the manor house and the stronghold on multiplayer maps too.
castle_player_zero: Player 0 shield
castle_player_zero_tooltip: A white ninth shield in the middle of the player shields chooses player 0, who can own
  buildings and units on a map too.
castle_keep_crests: Active keep crests
castle_keep_crests_tooltip: Every keep shows its owner's shield above it; the player's active keep (where the lord,
  the starting units and new peasants appear) shows it framed. Click a shield to make that keep active, or click
  the active one to leave the player without one. A new keep no longer takes over the active keep, and when the
  active keep is removed another keep of that player takes over. The player's main stockpile always follows the
  active keep (the game kept the first stockpile ever placed, so with several keeps the AI found its castle spot
  blocked and used no castle plan). Needs Several keeps.
castle_keep_crest_tooltip: Keep crest tooltip
castle_keep_crest_tooltip_tooltip: Hovering over a keep crest shows what it means and what a click on it does. Needs
  Active keep crests.
castle_wall_tools: Wall heights and free crenellations
castle_wall_tools_tooltip: Crenellations can stand on their own. Their panel offers low, high, low damaged and high
  damaged. A slider above the wall panel sets the height of high walls, low walls and crenellations (0-255) and
  the steepness of stairs (0-16), each on its own; Reset beside it gives the chosen one its usual value back, and
  leaving the map editor puts them all back.
trees_spread_order: Trees in spreading order
trees_spread_order_tooltip: 'In the Vegetation menu the trees that spread on fertile ground (oasis grass, thick
  and thin

  scrub) come first, then the tree that spreads on infertile ground (dirt, stony dirt, dunes): the

  third and fourth tree swap places.

  '
trees_spread_outlines: Outlines for spreading ground
trees_spread_outlines_tooltip: 'A thin green outline round the trees that spread on fertile ground and a thin beige
  outline

  round the tree that spreads on infertile ground. The apple tree does not spread and gets none.

  '
herds_bird_bins: Erase all crows / seagulls buttons
herds_bird_bins_tooltip: 'Red wastebin buttons right of the crow and the seagull button in the Animals menu: one
  click

  takes every crow (the trees stay) or every seagull off the map.

  '
herds_animal_bin: Erase all animals button
herds_animal_bin_tooltip: 'A red wastebin button on the right of the Animals menu that takes every animal off the
  map,

  like Alt + E. Crows and seagulls stay.

  '
herds_group_warning: Herds and groups warning
herds_group_warning_tooltip: 'When fewer than 200 herds and groups can still be made, a line at the top of the screen
  says

  how many are left, like the game''s own line for units.

  '
eraser_choice: Eraser choice panel
eraser_choice_tooltip: 'While the eraser is chosen, a panel above the menu picks what it takes: All (as before),

  Animals (also crows and seagulls), Units, Buildings (with keeps, ruins and walls), Vegetation or

  Rocks (also invisible rocks).

  '
eraser_seagulls: Eraser takes seagulls
eraser_seagulls_tooltip: 'The eraser also takes the seagulls flying over the tiles it erases (with All or Animals).

  '
map_settings_show_locked: Show locked maps box
map_settings_show_locked_tooltip: 'A "Show locked maps" box in the editor''s Load dialog. Ticked, locked maps are
  listed too;

  the list updates at once.

  '
map_settings_button: Map Settings button
map_settings_button_tooltip: 'A Map Settings button on the map''s menu screen, right of the Balanced / Unbalanced
  and

  Invasion / Economy buttons. It opens the Alt + , menu.

  '
map_settings_menu: Bigger Map Settings menu
map_settings_menu_tooltip: 'The Alt + , menu gets a title, Singleplayer and Multiplayer, the four singleplayer map
  types

  (Siege, Invasion, Economic, Just Build), the four map sizes plus Custom and a Map size slider (10

