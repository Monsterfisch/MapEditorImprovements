counts_group: Map counts
counts_group_descr: |
  Shows in the landscape editor how many animals, trees and rocks the map has, and how close
  it is to the game's limits.
counts_enabled: Show map counts
counts_enabled_tooltip: |
  Point at the Animals, Vegetation or Rocks button for a tooltip with the count and the
  game's limit, for example "Trees and shrubs: 812/1999". The Animals tooltip also shows the
  herds and troops, which have a limit of their own.
  In the Animals menu, the deer, camel, rabbit and lion buttons show how many of each there
  are; in the Vegetation menu, every tree and shrub button shows how many of that plant there
  are.
  A red "i" button above the key button switches all of this on and off while you work.
counts_shown: Numbers shown when the editor opens
counts_shown_tooltip: |
  Off: the numbers start hidden, and the "i" button brings them up.

menu_group: Editor menu
menu_group_descr: |
  How the editor's menu at the bottom of the screen is drawn.
menu_always_update: Always keep the menu up to date
menu_always_update_tooltip: |
  The game only redraws the menu while the mouse is over it. A change made elsewhere, for
  example a hotkey that picks another tool, or the counts changing as you place animals,
  only shows once you move the mouse back onto the menu. With this on, the menu is redrawn
  all the time in the map editor.
