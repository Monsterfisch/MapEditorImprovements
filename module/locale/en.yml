counts_group: Map counts
counts_group_descr: |
  Shows in the landscape editor how many animals, trees and rocks the map has, and how close
  it is to the game's limits.
counts_enabled: Show map counts
counts_enabled_tooltip: |
  Point at the Animals, Vegetation or Rocks button for a tooltip with the count and the
  game's limit, for example "Trees and shrubs: 812/1999". The Animals tooltip also shows the
  herds and troops, which have a limit of their own.
  In the Animals menu, the deer, camel, rabbit and lion buttons show how many of each there
  are; in the Vegetation menu, every tree and shrub button shows how many of that plant there
  are.
  A red "i" button above the key button switches all of this on and off while you work.
counts_shown: Numbers shown when the editor opens
counts_shown_tooltip: |
  Off: the numbers start hidden, and the "i" button brings them up.

trees_group: Trees and shrubs
trees_group_descr: |
  More choice when placing vegetation in the landscape editor.
trees_growth: Brush size sets the tree's growth stage
trees_growth_tooltip: |
  Trees are placed at the growth stage of the brush size: brush 1 places the smallest trees,
  brush 4 fully grown ones (what the editor always places otherwise), brush 5 fully grown
  ones the woodcutters leave alone for a while, brush 6 and 7 dead trees (7 decays sooner).
  Shrubs are not affected.
trees_apple: Apple tree button
trees_apple_tooltip: |
  Adds an apple tree to the Vegetation menu. The picture is images/apple.png (with
  apple_hover.png and apple_selected.png) in the module's folder; replace them to change it.
trees_shrubs: More shrubs
trees_shrubs_tooltip: |
  While the shrub with four more colours is chosen, a row above the Vegetation menu offers
  all five of them.
trees_felled: Felled trees
trees_felled_tooltip: |
  While a tree is chosen, a row above the Vegetation menu offers that tree felled, with every
  number of logs it can still hold (9 down to 1 for a fully grown tree). Click one to place
  felled trees, click it again to go back to standing trees.

trees_random_mix: Random mixes in the tree rows
trees_random_mix_tooltip: |
  Adds buttons marked "?" to the rows above the Vegetation menu:
  - Random tree (first in the felled tree row): trees of every growth stage from the smallest
    up to the brush's, mixed at random. Not offered for the smallest trees or dead ones.
  - Random felled tree (last in the felled tree row): felled trees with a random number of
    logs.
  - Random shrub (last in the shrub row): the five shrub colours mixed at random.
  Click one again, or choose another button, to stop mixing.
trees_obstacles: Check box for trees next to obstacles
trees_obstacles_tooltip: |
  Adds a check box to the top row of the Vegetation menu. While it is ticked, trees and
  shrubs can be placed right next to buildings, rocks, walls and other trees, which the game
  normally keeps them away from. Point at it to see whether it is on.
trees_sorted_rows: Tidy the Vegetation menu's rows
trees_sorted_rows_tooltip: |
  Moves the shrub from the top row to the bottom row and sorts the bottom row's shrubs, so
  the top row holds the trees (and the apple tree and the check box) and the bottom row all
  the shrubs.

textures_group: Ground textures
textures_group_descr: |
  The Textures menu of the landscape editor.
textures_gravel_and_iron: Gravel and iron in the Textures menu
textures_gravel_and_iron_tooltip: |
  Adds Gravel to the top row and Iron to the bottom row, and spreads both rows evenly. The
  gravel picture is images/gravel.png (with gravel_hover.png and gravel_selected.png).

rocks_group: Rocks
rocks_group_descr: |
  The Rocks menu of the landscape editor.
rocks_signpost: Signpost in the Rocks menu of skirmish maps
rocks_signpost_tooltip: |
  Skirmish maps get the same Rocks menu as scenario maps, with the signpost button.
rocks_random_preview: Random rotation shows in the preview
rocks_random_preview_tooltip: |
  With the random rotation button chosen, the game turns the rock so fast that the preview
  under the mouse cannot follow it. With this on it turns once a second instead, and the
  preview shows the rock you are about to place.
rocks_variants: Rock variant row
rocks_variants_tooltip: |
  A row above the Rocks menu shows the four variants of the chosen rock size, turned the way
  they would be placed. Click one to place only that variant; click it again, or any button
  of the Rocks menu, to go back to the game's changing variants.
rocks_extra_rock: Extra small rock
rocks_extra_rock_tooltip: |
  For the smallest rocks, the variant row also offers a fifth one: a small rock the game has
  but the editor never places. It is saved in the map like any other rock.
rocks_invisible: Invisible rocks check box
rocks_invisible_tooltip: |
  Adds a check box to the right of the Rocks menu's buttons. While it is ticked, every rock
  you place is an "invisible rock" straight away, without placing 4000 rocks first: the
  tiles are taken (nothing can be built or walk there) but no rock is drawn, so they keep
  showing what was there before (the "2k stones trick"). Untick it for normal rocks.

castle_group: Castle mode
castle_group_descr: |
  The building menu of the map editor's castle mode.
castle_building_counts: Building counts above the minimap
castle_building_counts_tooltip: |
  Shows above the minimap how many buildings the map has against the game's limit (every
  building counts, including keeps, landscape buildings and the parts some buildings are made
  of), how many player buildings all players have together, and how many the current player
  has. Player buildings are the ones an enemy can be sent to destroy.
castle_tower_ruins: Tower ruins
castle_tower_ruins_tooltip: |
  While the Towers menu is open, a row above it offers the ruins of the five towers.
castle_tunnel_and_tents: Tunnel entrance and siege tents
castle_tunnel_and_tents_tooltip: |
  In the army buildings menu: with the tunnelers' guild chosen, a row above the menu offers a
  tunnel entrance; with the engineers' guild chosen, the six siege tents.
castle_statues: Statue and shrines
castle_statues_tooltip: |
  While the menu of good things is open, a row above it offers the unused 2x2 statue, 2x2
  shrine and 1x1 shrine.
castle_barrier: Barrier in the Ruins menu
castle_barrier_tooltip: |
  Adds a Barrier button in the free spot at the bottom right of the Ruins menu: a 1x1 barrier
  that can be deleted again.
castle_several_keeps: Several keeps per player
castle_several_keeps_tooltip: |
  Placing a keep no longer removes the player's earlier keep (and its campfire). The newest
  keep is the player's active one, the others stay as buildings.
castle_several_storage: Several storage and recruitment buildings
castle_several_storage_tooltip: |
  Barracks, mercenary posts, guilds and the other buildings a player has only one of are no
  longer removed when another one is placed, and further stockpiles, granaries and armouries
  need not touch the first one.
castle_tower_engines: Tower mangonels and ballistae anywhere
castle_tower_engines_tooltip: |
  The tower mangonel and tower ballista of the army buildings menu can be put wherever no unit
  stands: on the ground, walls, gates, any tower or the keep, not only on the player's own
  square and round towers.

herds_group: Herds
herds_group_descr: |
  The animals of the landscape editor.
herds_panel: Herd panel
herds_panel_tooltip: |
  While the deer, lion, rabbit or camel is chosen, a panel above the Animals menu shows how
  many animals a herd gets (a fixed part plus a random part) and which troop type the herd
  uses. Its check box makes herds as big as the brush: 2 x brush size - 1 animals (1 to 13),
  with no random part.

menu_group: Editor menu
menu_group_descr: |
  How the editor's menu at the bottom of the screen is drawn.
menu_always_update: Always keep the menu up to date
menu_always_update_tooltip: |
  The game only redraws the menu while the mouse is over it. A change made elsewhere, for
  example a hotkey that picks another tool, or the counts changing as you place animals,
  only shows once you move the mouse back onto the menu. With this on, the menu is redrawn
  all the time in the map editor.
