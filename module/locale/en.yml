map_editor: Map editor
grid_enabled: Show the resource grid
grid_enabled_tooltip: Press Alt+G in the editor or rebind the grid under Options → Custom Hotkeys.
grid_group_descr: Overlay the resource grid, keep rotation boundaries or iron mine footprints.
key_configured: Use configured key
key_off: 'Off'
castle_buildings_group: Castle buildings
castle_buildings_group_descr: Place buildings in Castle mode.
keeps_group: Keeps and storage
keeps_group_descr: Set up keeps, storage and recruitment buildings in Castle mode.
players_group: Players
players_group_descr: Choose players, colors and keep types in Castle mode.
fortifications_group: Walls and moats
fortifications_group_descr: Place walls, stairs and moats in Castle mode.
tree_brush_group: Planting and brushes
tree_brush_group_descr: Control how the vegetation brush plants in Landscape mode.
tree_spread_group: Tree spreading
tree_spread_group_descr: Show which ground each tree spreads on in the Vegetation menu.
