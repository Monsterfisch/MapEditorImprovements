map_editor: Редактор карт
grid_enabled: Показывать сетку ресурсов
grid_enabled_tooltip: Нажмите Alt+G в редакторе или переназначьте сетку в «Настройки > Горячие клавиши».
grid_group_descr: Накладывает сетку ресурсов, границы поворота цитадели или контуры железных рудников.
herds_animal_bin: Кнопка удаления всех наземных животных (Alt+E)
key_configured: Использовать настроенную клавишу
key_off: Выкл.
castle_buildings_group: Здания замка
castle_buildings_group_descr: Размещение зданий в режиме замка.
keeps_group: Донжоны и склады
keeps_group_descr: Настройка донжонов, складов и зданий найма в режиме замка.
players_group: Игроки
players_group_descr: Выбор игроков, цветов и типов донжона в режиме замка.
fortifications_group: Стены и рвы
