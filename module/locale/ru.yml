menu_group: Меню редактора
menu_group_descr: |-
  Как отрисовывается меню редактора в нижней части экрана.
menu_dust_clouds: Облака пыли не вызывают вылет игры
menu_dust_clouds_tooltip: |-
  Облако пыли с утраченными данными движения вызывало деление на ноль и вылет игры. С этой опцией такое облако просто остаётся на месте.
menu_always_update: Всегда обновлять меню
menu_always_update_tooltip: |-
  Игра перерисовывает меню только когда курсор находится над ним. Изменения, сделанные снаружи — например переключение инструмента горячей клавишей или обновление счётчиков при размещении животных — появляются лишь при возврате курсора на меню. С этой опцией меню перерисовывается постоянно в редакторе карт.
castle_all_players: Все восемь гербов игроков на любой карте
castle_all_players_tooltip: |-
  Гербы рядом с миникартой показывают всех восемь игроков на любом типе карты, а не только на сетевых картах.
castle_all_keeps: Поместье и крепость на любой карте
castle_all_keeps_tooltip: |-
  Меню цитаделей предлагает поместье и крепость также и на сетевых картах.
castle_player_zero: Герб игрока 0
castle_player_zero_tooltip: |-
  Белый девятый герб в центре панели гербов выбирает игрока 0, который также может владеть зданиями и юнитами на карте.
castle_keep_crests: Гербы активной цитадели
castle_keep_crests_tooltip: |-
  Над каждой цитаделью отображается герб её владельца; у активной цитадели игрока (где появляются лорд, стартовые войска и новые крестьяне) герб обведён рамкой. Клик по гербу делает цитадель активной, а клик по активному оставляет игрока без активной цитадели. Новая цитадель больше не перехватывает активность автоматически, а при удалении активной её место занимает другая цитадель того же игрока. Главный склад всегда следует за активной цитаделью (иначе игра держала самый первый склад, из-за чего ИИ при нескольких цитаделях считал место замка занятым и не строился по плану). Требует «Несколько цитаделей на игрока».
castle_keep_crest_tooltip: Подсказка герба цитадели
castle_keep_crest_tooltip_tooltip: |-
  При наведении на герб цитадели показывает его значение и действие клика. Требует «Гербы активной цитадели».
castle_wall_tools: Высота стен и свободные зубцы
castle_wall_tools_tooltip: |-
  Зубцы можно ставить отдельно. Их панель предлагает низкие, высокие, низкие повреждённые и высокие повреждённые. Ползунок над панелью стен отдельно задаёт высоту высоких стен, низких стен и зубцов (0–255) и крутизну лестниц (0–16); кнопка «Сброс» рядом возвращает стандартное значение для выбранного типа, а выход из редактора сбрасывает всё.
trees_spread_order: Деревья по порядку разрастания
trees_spread_order_tooltip: |-
  В меню «Растительность» сначала идут деревья, разрастающиеся на плодородной земле (трава оазиса, густой и редкий кустарник), а затем дерево для бесплодной земли (земля, каменистая земля, дюны): третье и четвёртое деревья меняются местами.
trees_spread_outlines: Контуры для грунта разрастания
trees_spread_outlines_tooltip: |-
  Тонкий зелёный контур вокруг деревьев, разрастающихся на плодородной земле, и тонкий бежевый контур вокруг дерева для бесплодной земли. Яблоня не разрастается и не получает контура.
herds_bird_bins: Кнопки удаления всех ворон / чаек
herds_bird_bins_tooltip: |-
  Красные кнопки-корзины справа от кнопок ворон и чаек в меню «Животные»: один клик удаляет с карты всех ворон (деревья остаются) или всех чаек.
herds_animal_bin: Кнопка удаления всех животных
herds_animal_bin_tooltip: |-
  Красная кнопка-корзина справа в меню «Животные», удаляющая всех животных с карты, как Alt + E. Вороны и чайки остаются.
herds_group_warning: Предупреждение о стадах и группах
herds_group_warning_tooltip: |-
  Когда остаётся меньше 200 свободных стад и групп, строка вверху экрана показывает остаток — как стандартная строка игры для юнитов.
eraser_choice: Панель выбора ластика
eraser_choice_tooltip: |-
  Когда выбран ластик, панель над меню задаёт, что именно стирать: Всё (как раньше), Животные (включая ворон и чаек), Юниты, Здания (включая цитадели, руины и стены), Растительность или Камни (включая невидимые).
eraser_seagulls: Ластик удаляет чаек
eraser_seagulls_tooltip: |-
  Ластик также удаляет чаек, пролетающих над стираемыми клетками (в режиме «Всё» или «Животные»).
map_settings_show_locked: Флажок «Показывать заблокированные карты»
map_settings_show_locked_tooltip: |-
  Флажок «Показывать заблокированные карты» в окне загрузки редактора. Когда отмечен, заблокированные карты тоже отображаются в списке; список обновляется сразу.
map_settings_button: Кнопка «Настройки карты»
map_settings_button_tooltip: |-
  Кнопка «Настройки карты» на экране меню карты, справа от кнопок «Сбалансированная / Несбалансированная» и «Вторжение / Экономика». Открывает меню Alt + ,.
map_settings_menu: Расширенное меню «Настройки карты»
map_settings_menu_tooltip: |-
  Меню Alt + , получает заголовок, «Одиночная игра» и «Сетевая игра», четыре типа одиночных карт (Осада, Вторжение, Экономика, Свободное строительство), четыре размера карты плюс «Свой» и ползунок размера (от 10 до 400; применяется при отпускании), «Сбалансированная», «Царь горы», «Заблокировать карту» и кнопку «Назад».
eraser_group: Ластик
eraser_group_descr: |-
  Что именно удаляет ластик редактора ландшафта.
map_settings_group: Настройки карты
map_settings_group_descr: |-
  Параметры карты: тип, размер, блокировка и соответствующие меню.
