counts_group: Счётчики карты
counts_group_descr: |-
  Показывает в редакторе ландшафта, сколько животных, деревьев и камней находится на карте и насколько близко это к лимитам игры.
counts_enabled: Показывать счётчики карты
counts_enabled_tooltip: |-
  Наведите курсор на кнопки «Животные», «Растительность» или «Камни», чтобы увидеть подсказку с текущим количеством и лимитом игры, например «Деревья и кусты: 812/1999». Подсказка «Животные» также показывает стада и группы, у которых есть собственный лимит.
  В меню «Животные» на кнопках оленей, верблюдов, кроликов и львов отображается их количество; в меню «Растительность» — на каждой кнопке дерева и куста.
  Красная кнопка «i» над кнопкой ключа включает и выключает отображение прямо во время работы.
counts_shown: Показывать числа при открытии редактора
counts_shown_tooltip: |-
  Выкл.: числа изначально скрыты, и кнопка «i» отображает их.
trees_group: Деревья и кусты
trees_group_descr: |-
  Больше возможностей при размещении растительности в редакторе ландшафта.
trees_growth: Размер кисти задаёт стадию роста дерева
trees_growth_tooltip: |-
  Деревья размещаются на стадии роста, соответствующей размеру кисти: кисть 1 ставит самые маленькие деревья, кисть 4 — взрослые (которые редактор обычно ставит всегда), кисть 5 — взрослые деревья, которые лесорубы некоторое время не трогают, кисти 6 и 7 — засохшие деревья (7 исчезает быстрее). На кусты не влияет.
trees_apple: Кнопка яблони
trees_apple_tooltip: |-
  Добавляет яблоню в меню «Растительность». Изображение берётся из images/apple.png (вместе с apple_hover.png и apple_selected.png) в папке модуля; замените их, чтобы изменить иконку.
trees_shrubs: Больше кустов
trees_shrubs_tooltip: |-
  Когда выбран куст с четырьмя дополнительными расцветками, ряд над меню «Растительность» предлагает все пять вариантов.
trees_felled: Поваленные деревья
trees_felled_tooltip: |-
  Когда выбрано дерево, ряд над меню «Растительность» предлагает его стоящим (первым) и поваленным — для каждого возможного числа брёвен (от 9 до 1 у взрослого дерева; самые маленькие деревья лежат с 1 бревном). Нажмите на вариант, чтобы ставить поваленные деревья; нажмите на стоящее дерево, повторно на поваленное или на дерево в меню, чтобы вернуться к стоящим деревьям.
trees_random_mix: Случайные наборы в рядах деревьев
trees_random_mix_tooltip: |-
  Добавляет кнопки «?» в ряды над меню «Растительность»:
  - Случайное дерево (первая в ряду поваленных деревьев): случайная смесь всех стадий роста от самой маленькой до размера кисти. Недоступно для самых маленьких и засохших деревьев.
  - Случайное поваленное дерево (последняя в ряду поваленных деревьев): поваленные деревья со случайным числом брёвен.
  - Случайный куст (последняя в ряду кустов): случайная смесь всех пяти расцветок куста.
  Нажмите кнопку ещё раз или выберите другую, чтобы отключить перемешивание.
trees_obstacles: Флажок для деревьев рядом с препятствиями
trees_obstacles_tooltip: |-
  Добавляет флажок в верхний ряд меню «Растительность». Когда он отмечен, деревья можно ставить вплотную к зданиям, камням, стенам и другим деревьям, что игра обычно запрещает (кусты и так можно ставить). Наведите курсор, чтобы увидеть состояние.
trees_rocks_and_water: Флажок для растительности на камнях и воде
trees_rocks_and_water_tooltip: |-
  Флажок справа в меню «Растительность», под флажком деревьев у препятствий (изначально снят). Когда отмечен, деревья и кусты можно размещать также на болотах, реках, бродах, скалистом грунте, валунах и гравии.
trees_sorted_rows: Упорядочить ряды меню «Растительность»
trees_sorted_rows_tooltip: |-
  Переносит куст из верхнего ряда в нижний и сортирует кусты в нижнем ряду, так что в верхнем ряду находятся деревья (плюс яблоня и флажок), а в нижнем — все кусты.
trees_preview: Предпросмотр дерева
trees_preview_tooltip: |-
  Когда выбрано дерево или куст, на клетке под курсором отображается именно то дерево, которое будет посажено — в стадии роста кисти (или поваленное с выбранными брёвнами), как его нарисует игра. Не работает в отдалённом виде.
trees_no_stacking: Запретить наслоение кустов
trees_no_stacking_tooltip: |-
  Дерево или куст больше нельзя поставить на клетку, где уже есть растение. Некоторые кусты (куст из верхнего ряда и четыре объединённых с ним) раньше невидимо накапливались на одной клетке, навсегда занимая лимит деревьев. Ластик теперь также удаляет все наслоенные кусты на клетке, позволяя очистить старые карты.
textures_group: Текстуры грунта
textures_group_descr: |-
  Меню «Текстуры» редактора ландшафта.
textures_gravel_and_iron: Гравий и железо в меню «Текстуры»
textures_gravel_and_iron_tooltip: |-
  Добавляет гравий в верхний ряд и железо в нижний ряд, равномерно распределяя оба ряда. Изображение гравия: images/gravel.png (вместе с gravel_hover.png и gravel_selected.png).
textures_no_heights_iron: Железо только в меню «Текстуры»
textures_no_heights_iron_tooltip: |-
  Убирает кнопку железа из меню «Высоты», поскольку теперь она есть в меню «Текстуры».
textures_mask: Кнопка «Маска»
textures_mask_tooltip: |-
  Добавляет кнопку «Маска» (наполовину закрашенный квадрат) в левом верхнем углу меню редактора ландшафта. Когда она включена, инструменты природы (высоты, текстуры, вода, деревья и кусты, камни и пипетка) изменяют только клетки с той же текстурой, что и первая нажатая клетка; при отпускании кнопки мыши следующий клик выбирает новую целевую текстуру.
textures_mask_by_type: Маска объединяет варианты воды
textures_mask_by_type_tooltip: |-
  Маска пропускает только клетки с точно такой же текстурой, как у нажатой (трава, кустарник, густой кустарник, камни, пляж и т. д. остаются раздельными). С этой опцией варианты одного типа воды считаются одной водой: всё море с берегами и глубинами, вся река с пеной, волнами и краями водопадов, все броды. Море, река и брод остаются раздельными.
water_group: Вода
water_group_descr: |-
  Меню «Вода» редактора ландшафта.
water_decorations: Пена и мелкие волны
water_decorations_tooltip: |-
  Возвращает два речных украшения из редактора первого Stronghold, которые Crusader по-прежнему поддерживает, но без кнопок: «Пена» (белая пена и брызги, как под водопадом, на каждой речной клетке под кистью) и «Мелкие волны» (на одной речной клетке под курсором). Оба ставятся только на реку и сохраняются в карте.
water_foam_on_sea: Пена также на море
water_foam_on_sea_tooltip: |-
  Пену можно наносить и на морские клетки — они при этом превращаются в реку с пеной (при включённой опции пены).
rocks_group: Камни
rocks_group_descr: |-
  Меню «Камни» редактора ландшафта.
rocks_signpost: Указатель в меню «Камни» на картах схватки
rocks_signpost_tooltip: |-
  Карты схватки получают то же меню «Камни», что и сценарные карты, включая кнопку указателя.
rocks_random_preview: Случайный поворот виден в предпросмотре
rocks_random_preview_tooltip: |-
  При включённой кнопке случайного поворота игра вращает камень слишком быстро для предпросмотра под курсором. С этой опцией он поворачивается раз в секунду, и предпросмотр показывает именно тот камень, который вы поставите.
rocks_variants: Ряд вариантов камней
rocks_variants_tooltip: |-
  Ряд над меню «Камни» показывает четыре варианта выбранного размера камня в их текущем повороте. Нажмите на один из них, чтобы ставить только этот вариант; повторный клик по нему или по любой кнопке меню «Камни» возвращает обычную смену вариантов.
rocks_extra_rock: Дополнительный малый камень
rocks_extra_rock_tooltip: |-
  Для самых маленьких камней в ряду вариантов появляется пятый: небольшой камень, существующий в игре, но никогда не размещаемый стандартным редактором. Сохраняется в карте как обычный камень.
rocks_invisible: Флажок «Невидимые камни»
rocks_invisible_tooltip: |-
  Добавляет флажок справа от кнопок меню «Камни». Когда он отмечен, каждый поставленный камень сразу становится «невидимым камнем» без необходимости сначала ставить 4000 камней: клетки заняты (нельзя строить и ходить), но сам камень не рисуется, оставляя прежний вид (трюк «2k камней»). Снимите флажок для обычных камней.
rocks_erase_invisible: Ластик удаляет невидимые камни
rocks_erase_invisible_tooltip: |-
  Ластик ландшафта (и инструменты, удаляющие камни через него) освобождает клетки невидимых камней так же, как обычных. Без этого на каждую клетку нужен трюк с кустом: поставить куст, игнорирующий препятствия, и стереть его.
rocks_remove_lost: Кнопка «Удалить потерянные камни»
rocks_remove_lost_tooltip: |-
  Добавляет кнопку «Удалить потерянные камни» справа внизу меню «Камни». Камень, повреждённый инструментом подъёма или опускания, чьи клетки затем полностью перекрыли кустами, остаётся в списке камней карты без единой клетки: его нельзя увидеть, стереть или достать, но он занимает один из 4000 слотов. Кнопка удаляет все такие записи из списка, не меняя клетки.
heights_group: Высоты
heights_group_descr: |-
  Инструменты высоты редактора ландшафта.
heights_max_height: Кнопка «Максимальная высота»
heights_max_height_tooltip: |-
  Возвращает инструмент «Максимальная высота» из первого Stronghold справа от «Минимальной высоты» в меню «Высоты»: поднимает грунт под кистью до высоты 156. В Crusader сам инструмент и его иконки сохранились, была убрана только кнопка.
heights_tool_options: Настройки инструментов высоты
heights_tool_options_tooltip: |-
  При выборе инструмента высоты панель над меню «Высоты» предлагает (снизу вверх):
  - Сбрасывать текстуры грунта (изначально выкл.): возвращают ли инструменты высоты обычную текстуру грунта (и землю на плато), как в игре. При выкл. меняется только высота.
  - Ломать клетки камней (изначально выкл.): ломают ли подъём, спуск, выравнивание, холм и гора задетые камни, как в игре (задетые клетки становятся невидимыми и проходимыми, пока камень остаётся). При выкл. камни остаются целыми.
  - Игнорировать воду и Игнорировать плодородные земли (изначально выкл.): инструменты высоты не трогают море, реку, брод, болото и ров либо кустарник, густой кустарник и траву оазиса.
  - Для подъёма, спуска и выравнивания: Привязка к диапазону (изначально вкл.), Инверсия (только выравнивание), диапазон высоты (изначально от 8 до 156; тяните любой край) и сила. При включённой привязке клетки вне диапазона подтягиваются к нему, как в игре; при выключенной остаются нетронутыми. Инверсия заставляет выравнивание делать рельеф более неровным вместо сглаживания.
  - Изменение высоты камней (изначально «Весь камень»): как инструменты высоты действуют на задетый камень. «Только клетка» сдвигает лишь клетки под кистью; «Весь камень» сдвигает все клетки камня на одинаковую величину; «Стереть камень» удаляет камень, как всегда делала «Минимальная высота».
  Диапазон, привязка, инверсия и флажки игнорирования сбрасываются при выходе из редактора карт.
heights_invert_key_on: Удерживать для инверсии выравнивания
heights_invert_key_on_tooltip: |-
  Пока эта клавиша удерживается при выбранном выравнивании, инструмент делает рельеф неровным (как при флажке «Инверсия»); отпустите, и он снова сглаживает.
heights_invert_key: Клавиша инверсии выравнивания
heights_invert_key_tooltip: |-
  Клавиша, которую нужно удерживать для инверсии инструмента выравнивания.
castle_group: Режим замка
castle_group_descr: |-
  Меню строительства в режиме замка редактора карт.
castle_building_counts: Счётчики зданий над миникартой
castle_building_counts_tooltip: |-
  Показывает над миникартой общее число зданий на карте относительно лимита игры (учитываются все постройки, включая цитадели, ландшафтные объекты и составные части), общее число зданий всех игроков и число зданий текущего игрока. Зданиями игроков считаются те, которые враг может разрушить.
castle_tower_ruins: Руины башен
castle_tower_ruins_tooltip: |-
  Когда открыто меню «Башни», ряд над ним предлагает руины всех пяти башен.
castle_tunnel_and_tents: Вход в тоннель и осадные палатки
castle_tunnel_and_tents_tooltip: |-
  В меню военных построек: при выборе гильдии подкопщиков ряд над меню предлагает вход в тоннель; при выборе гильдии инженеров — шесть осадных палаток.
castle_statues: Статуя и святилища
castle_statues_tooltip: |-
  Добавляет неиспользуемые статую 2×2, святилище 2×2 и святилище 1×1: в конце вариантов статуи и святилища (см. «Варианты зданий») или, если варианты выключены, в ряду над меню «Позитивные объекты».
castle_barrier: Барьер в меню «Руины»
castle_barrier_tooltip: |-
  Добавляет кнопку «Барьер» в свободный слот справа внизу меню «Руины»: барьер 1×1, который можно удалить.
castle_several_keeps: Несколько цитаделей на игрока
castle_several_keeps_tooltip: |-
  Размещение цитадели больше не удаляет предыдущую цитадель игрока (и её костёр). Самая новая цитадель становится активной, остальные остаются как здания.
castle_several_storage: Несколько складов и зданий найма
castle_several_storage_tooltip: |-
  Казармы, лагеря наёмников, гильдии и другие здания, которых у игрока обычно по одному, больше не удаляются при постройке ещё одного, а дополнительные склады, амбары и оружейные не обязаны примыкать к первому. Любое их число может оставаться пустым (обычно игра разрешает лишь 8 пустых амбаров или оружейных и 32 пустых склада).
castle_tower_engines: Башенные мангонели и баллисты в любом месте
castle_tower_engines_tooltip: |-
  Башенную мангонель и башенную баллисту из военного меню можно ставить везде, где может стоять юнит (земля, стены, ворота, башни, цитадель), а не только на собственных квадратных и круглых башнях игрока: на нажатую клетку, по одной на клетку, до 4 на цитадели или больших воротах и до 8 на больших крепостных цитаделях. Предпросмотр сплошной везде, где возможна установка.
castle_keep_parts: Цитадель без костра или склада
castle_keep_parts_tooltip: |-
  Когда выбрана одна из цитаделей, ряд над меню цитаделей предлагает ещё два варианта: «Только цитадель» (цитадель и вход без костра и склада) и «Без склада» (цитадель, вход и площадка костра). Повторный выбор цитадели в меню снова ставит полную цитадель.
  Предпросмотр и проверка места учитывают только эти части.
castle_hover_text: Названия зданий левее
castle_hover_text_tooltip: |-
  Название здания под курсором («Цитадель игрока 1») сдвигается на 100 пикселей влево, чтобы не накладываться на счётчики зданий над миникартой.
castle_damaged_walls: Повреждённые стены и лестницы
castle_damaged_walls_tooltip: |-
  Когда выбраны лестницы, низкая стена, высокая стена или зубцы, ряд над меню замковых построек предлагает вариант «Повреждённые»: размещённые стены получают верх повреждённой стены, сохраняя высоту. Выбор стены в меню возвращает целые стены.
castle_variant_panels: Варианты зданий
castle_variant_panels_tooltip: |-
  Когда выбран сад, статуя, святилище или выгребная яма, ряд над меню показывает все варианты; выбранный вариант закрепляется, а не сменяется каждую секунду. То же касается хижины над городским меню. Выбор здания в самом меню возвращает обычное поведение игры. Пипетка также берёт точный вариант.
castle_ruined_cathedral: Разрушенный собор
castle_ruined_cathedral_tooltip: |-
  Когда выбран собор, ряд над городским меню предлагает его в виде «Руин»: собор получает разрушенный вид, который игра иначе показывает только в одной исторической миссии. В игре он остаётся полностью рабочим собором с разрушенным видом. Выбор собора в меню снова ставит целые соборы. Пипетка копирует разрушенный собор как разрушенный. Требует оригинальный файл tile_churches.gm1 (в старых копиях нет руин, тогда соборы остаются целыми).
castle_moat_kinds: Выкопанный, запланированный и постоянный ров
castle_moat_kinds_tooltip: |-
  Когда выбран ров в меню ворот, ряд над меню предлагает три вида: «Выкопанный» (обычный ров редактора), «Запланированный» (разметка рва, как в игре) и «Постоянный» (выкопанный ров, который никто не может засыпать или удалить в игре). Выбор рва в меню возвращает выкопанный ров.
castle_moat_on_marsh: Ров на болоте
castle_moat_on_marsh_tooltip: |-
  В редакторе карт ров снова можно размещать на болоте. Болото сохраняется под ним и возвращается, когда ров засыпают.
castle_moat_removal_keeps_ground: Удаление рва сохраняет грунт
castle_moat_removal_keeps_ground_tooltip: |-
  Инструмент «Убрать ров» изменяет только клетки с выкопанным или запланированным рвом: удаляет ров (возвращая обычную высоту земли) и не трогает текстуру грунта. Без этой опции любая клетка под кистью превращается в простую землю.
herds_group: Стада
herds_group_descr: |-
  Животные в редакторе ландшафта.
herds_panel: Панель стад
herds_panel_tooltip: |-
  Когда выбраны олень, лев, кролик или верблюд, панель над меню «Животные» показывает размер стада (фиксированная плюс случайная часть) и тип группового поведения. Её флажок привязывает размер стада к кисти: 2 × размер кисти − 1 животных (от 1 до 13), без случайной части.
brushes_group: Кисти
brushes_group_descr: |-
  Кисти редактора ландшафта.
brushes_full_shape: Кисти полной формы
brushes_full_shape_tooltip: |-
  Игровые кисти дважды учитывают клетку под курсором и пропускают верхнюю левую угловую клетку формы — и в предпросмотре, и при нанесении. С этой опцией кисти имеют полную форму (только в редакторе карт; обычная логика игры не затронута).
undo_group: Отмена и повтор
undo_group_descr: |-
  Кнопки отмены и повтора в левом верхнем углу редактора карт.
undo_enabled: Отмена и повтор
undo_enabled_tooltip: |-
  Две кнопки со стрелками в левом верхнем углу редактора карт: левая отменяет последнее действие на карте (размещение, удаление, рисование, высоты), правая возвращает его — до 20 шагов. Кнопка неактивна, когда нечего отменять или повторять. Каждый клик — один шаг, как и удерживаемый штрих кисти. Клики без изменений на карте не создают шаг. Загрузка другой карты очищает историю.
pipette_group: Пипетка
pipette_group_descr: |-
  Пипетка в левом столбце редактора ландшафта над размером кисти: берёт высоты и/или текстуры одной клетки и переносит их на клетки под кистью.
pipette_enabled: Пипетка
pipette_enabled_tooltip: |-
  Добавляет кнопку пипетки над размером кисти (размер кисти, линейка и ластик слегка сдвигаются вниз).
  При выборе над меню появляется ряд — Высоты, Текстуры, Объекты, Всё — а выше отображается содержимое пипетки. Кликните по клетке, чтобы взять образец (пипетка показывает одну клетку), затем кликайте или ведите кистью для переноса. Высоты не трогают текстуру, текстуры не трогают высоты. Объекты берут здание, стену, дерево или камень с клетки: здания и стены ставятся как из своего меню за того же игрока (выбирается его герб), деревья (того же вида и стадии, либо поваленные с тем же числом брёвен) и камни (того же вида и поворота) — как своими инструментами, включая протяжку. «Всё» также берёт дерево или камень 1×1 и ставит на каждую клетку под кистью. Повторный выбор пипетки или одного из режимов очищает её.
  Высоты не наносятся на море, пляж, болото, ров, камни, стены и здания; текстуры — на камни, стены и здания. Обрывные камни на крутых склонах очищаются и появляются вновь там, где склон остался крутым. Отмена работает и для пипетки.
pipette_select_key_on: Клавиша пипетки
pipette_select_key_on_tooltip: |-
  Клавиша, выбирающая (и очищающая) пипетку. При повторном нажатии, когда пипетка уже выбрана, переключает режим: Высоты, Текстуры, Объекты, Всё.
pipette_select_key: Клавиша для пипетки
pipette_select_key_tooltip: |-
  Клавиша выбора пипетки в редакторе карт. Её обычное действие также сохраняется.
pipette_read_key_on: Удерживать для взятия клетки
pipette_read_key_on_tooltip: |-
  Пока эта клавиша удерживается, заполненная пипетка снова берёт образец с клетки (старый сохраняется до клика). Отпустите, чтобы снова наносить — если образец есть.
pipette_read_key: Клавиша взятия клетки
pipette_read_key_tooltip: |-
  Клавиша, которую нужно удерживать, чтобы взять образец клетки уже заполненной пипеткой.
pipette_any_tile_key_on: Удерживать для переноса на любую клетку
pipette_any_tile_key_on_tooltip: |-
  Экспериментально: пока клавиша удерживается, пипетка переносит высоты и текстуры на любую клетку под кистью, включая море, болото, камни (они остаются), стены и здания (но не край карты). Не меняет правила размещения объектов.
pipette_any_tile_key: Клавиша переноса на любую клетку
pipette_any_tile_key_tooltip: |-
  Клавиша, при удержании которой пипетка игнорирует объекты на клетке.
