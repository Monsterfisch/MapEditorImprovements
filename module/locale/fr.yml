menu_group: Menu de l'éditeur
menu_group_descr: |-
  Manière dont le menu de l'éditeur en bas de l'écran est dessiné.
menu_dust_clouds: Les nuages de poussière ne font plus planter le jeu
menu_dust_clouds_tooltip: |-
  Un nuage de poussière ayant perdu ses données de mouvement provoquait une division par zéro et un plantage du jeu. Avec cette option, un tel nuage reste simplement immobile.
menu_always_update: Toujours garder le menu à jour
menu_always_update_tooltip: |-
  Le jeu ne redessine le menu que lorsque la souris le survole. Un changement survenu ailleurs, comme un raccourci choisissant un autre outil ou des compteurs mis à jour en posant des animaux, n'apparaît qu'en ramenant la souris sur le menu. Avec cette option, le menu est redessiné en continu dans l'éditeur de cartes.
castle_all_players: Les huit écussons de joueurs sur toutes les cartes
castle_all_players_tooltip: |-
  Les écussons à côté de la minicarte affichent les huit joueurs sur tout type de carte, et plus seulement en multijoueur.
castle_all_keeps: Manoir et forteresse sur toutes les cartes
castle_all_keeps_tooltip: |-
  Le menu des donjons propose aussi le manoir et la forteresse sur les cartes multijoueur.
castle_player_zero: Écusson du joueur 0
castle_player_zero_tooltip: |-
  Un neuvième écusson blanc au centre des écussons de joueurs sélectionne le joueur 0, qui peut lui aussi posséder bâtiments et unités sur une carte.
castle_keep_crests: Écussons de donjon actif
castle_keep_crests_tooltip: |-
  Chaque donjon affiche l'écusson de son propriétaire au-dessus de lui ; le donjon actif du joueur (où apparaissent le seigneur, les unités de départ et les nouveaux paysans) est encadré. Cliquez sur un écusson pour activer ce donjon, ou sur l'écusson actif pour laisser le joueur sans donjon actif. Un nouveau donjon ne remplace plus automatiquement l'actif, et si l'actif est supprimé, un autre donjon du joueur prend le relais. La réserve principale suit toujours le donjon actif (sinon le jeu gardait la première réserve posée, bloquant l'emplacement de l'IA avec plusieurs donjons). Nécessite « Plusieurs donjons par joueur ».
castle_keep_crest_tooltip: Infobulle des écussons de donjon
castle_keep_crest_tooltip_tooltip: |-
  Survoler un écusson de donjon indique sa signification et l'effet d'un clic. Nécessite « Écussons de donjon actif ».
castle_wall_tools: Hauteurs de murs et créneaux libres
castle_wall_tools_tooltip: |-
  Les créneaux peuvent tenir seuls. Leur panneau propose Bas, Haut, Bas endommagé et Haut endommagé. Un curseur au-dessus du panneau des murs règle séparément la hauteur des murs hauts, murs bas et créneaux (0 à 255) ainsi que la pente des escaliers (0 à 16) ; Réinitialiser à côté rend la valeur habituelle au type choisi, et quitter l'éditeur les réinitialise tous.
trees_spread_order: Arbres classés par sol de propagation
trees_spread_order_tooltip: |-
  Dans le menu Végétation, les arbres qui se propagent sur sol fertile (herbe d'oasis, broussailles épaisses et fines) apparaissent d'abord, suivis de l'arbre qui se propage sur sol aride (terre, terre pierreuse, dunes) : les troisième et quatrième arbres échangent leurs places.
trees_spread_outlines: Contours pour les sols de propagation
trees_spread_outlines_tooltip: |-
  Un fin contour vert entoure les arbres se propageant sur sol fertile, et un fin contour beige l'arbre des sols arides. Le pommier ne se propage pas et n'a pas de contour.
herds_bird_bins: Boutons Effacer tous les corbeaux / mouettes
herds_bird_bins_tooltip: |-
  Boutons corbeille rouges à droite des boutons corbeau et mouette dans le menu Animaux : un clic retire de la carte tous les corbeaux (les arbres restent) ou toutes les mouettes.
herds_animal_bin: Bouton Effacer tous les animaux
herds_animal_bin_tooltip: |-
  Un bouton corbeille rouge à droite du menu Animaux qui retire tous les animaux de la carte, comme Alt + E. Les corbeaux et les mouettes restent.
herds_group_warning: Avertissement troupeaux et groupes
herds_group_warning_tooltip: |-
  Lorsqu'il reste moins de 200 troupeaux et groupes disponibles, une ligne en haut de l'écran indique combien il en reste, comme la ligne du jeu pour les unités.
eraser_choice: Panneau de choix de la gomme
eraser_choice_tooltip: |-
  Lorsque la gomme est choisie, un panneau au-dessus du menu choisit ce qu'elle efface : Tout (comme avant), Animaux (corbeaux et mouettes inclus), Unités, Bâtiments (donjons, ruines et murs inclus), Végétation ou Rochers (rochers invisibles inclus).
eraser_seagulls: La gomme efface les mouettes
eraser_seagulls_tooltip: |-
  La gomme efface également les mouettes survolant les cases gommées (en mode Tout ou Animaux).
map_settings_show_locked: Case « Afficher les cartes verrouillées »
map_settings_show_locked_tooltip: |-
  Ajoute une case « Afficher les cartes verrouillées » dans la fenêtre Charger de l'éditeur. Cochée, les cartes verrouillées apparaissent dans la liste immédiatement.
map_settings_button: Bouton Paramètres de la carte
map_settings_button_tooltip: |-
  Ajoute un bouton Paramètres de la carte sur l'écran de menu de la carte, à droite des boutons Équilibrée / Déséquilibrée et Invasion / Économie. Ouvre le menu Alt + ,.
map_settings_menu: Menu Paramètres de la carte étendu
map_settings_menu_tooltip: |-
  Le menu Alt + , reçoit un titre, Solo et Multijoueur, les quatre types de cartes solo (Siège, Invasion, Économique, Construction libre), les quatre tailles plus Personnalisée et un curseur de taille de carte (10 à 400 ; appliqué au relâchement), Équilibrée, Roi de la colline, Verrouiller la carte et un bouton Retour.
eraser_group: Gomme
eraser_group_descr: |-
  Ce que la gomme de l'éditeur de paysage supprime.
map_settings_group: Paramètres de la carte
map_settings_group_descr: |-
  Les paramètres de la carte : type, taille, verrouillage et menus associés.
