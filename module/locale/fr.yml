map_editor: Éditeur de cartes
grid_enabled: Afficher la grille des ressources
grid_enabled_tooltip: Appuyez sur Alt+G dans l’éditeur ou réattribuez la grille dans Options > Raccourcis personnalisés.
grid_group_descr: Superpose la grille des ressources, les limites d’orientation du donjon ou l’emprise des mines de fer.
herds_animal_bin: Ajouter un bouton pour effacer tous les animaux terrestres (Alt+E)
key_configured: Utiliser la touche configurée
