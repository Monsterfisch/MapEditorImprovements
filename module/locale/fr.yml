counts_group: Compteurs de la carte
counts_group_descr: Indique la proximité avec les limites d’objets de la carte.
counts_enabled: Compteurs d’objets de la carte
counts_enabled_tooltip: Cliquez sur le i rouge au-dessus du bouton clé, puis survolez Animaux, Végétation, Rochers ou un élément de ces menus.
trees_group: Arbres et buissons
trees_group_descr: Placer et organiser la végétation en mode Paysage.
trees_growth: La taille du pinceau définit la croissance des arbres
trees_growth_tooltip: Choisissez un arbre et une taille de pinceau dans Végétation. La taille 4 place un arbre adulte, les tailles 6 et 7 un arbre mort.
trees_apple: Pommier dans Végétation
trees_apple_tooltip: Choisissez le pommier dans Végétation avant de planter.
trees_shrubs: Couleurs des buissons
trees_shrubs_tooltip: Sélectionnez un buisson dans Végétation, puis choisissez une couleur sur la ligne au-dessus du menu.
trees_felled: Variantes d’arbres abattus
trees_felled_tooltip: Sélectionnez un arbre dans Végétation et choisissez la variante abattue par nombre de troncs au-dessus du menu.
trees_random_mix: Mélange aléatoire de végétation
trees_random_mix_tooltip: Cliquez sur ? dans une ligne de variantes pour mélanger. Cliquez à nouveau ou choisissez une autre variante pour arrêter.
trees_obstacles: Arbres près des obstacles
trees_obstacles_tooltip: Cochez la case supérieure à droite de Végétation pour planter des arbres à côté des obstacles.
trees_rocks_and_water: Végétation sur rochers et eau
trees_rocks_and_water_tooltip: Cochez la case inférieure à droite de Végétation pour planter sur les rochers et l’eau.
trees_preview: Aperçu de la végétation sous le curseur
trees_preview_tooltip: Au zoom normal, pointez la carte pour prévisualiser l’arbre ou le buisson sélectionné.
trees_no_stacking: Empêcher l’empilement de la végétation
trees_no_stacking_tooltip: Empêche la végétation de s’empiler sur une même case et efface les anciens tas à la gomme.
textures_group: Textures de terrain
textures_group_descr: Choisit comment le pinceau Paysage peint les textures du sol.
textures_gravel_and_iron: Gravier et fer dans Textures
textures_gravel_and_iron_tooltip: Choisissez Gravier ou Fer dans Textures et peignez-les sur la carte.
textures_mask: Peindre uniquement la texture de départ
textures_mask_tooltip: Cliquez sur le carré à moitié rempli en haut à gauche, puis commencez chaque trait sur la texture à remplacer.
textures_mask_by_type: Traiter les variantes d’eau comme une seule texture
textures_mask_by_type_tooltip: Avec le masque actif, peignez sur toutes les variantes de la texture initiale de mer, rivière ou gué.
water_group: Eau
water_group_descr: Peindre des détails de rivière en mode Paysage.
water_decorations: Écume et petites vagues dans Eau
water_decorations_tooltip: Choisissez Écume ou Petites vagues dans Eau et peignez-les sur des cases de rivière.
water_foam_on_sea: Transformer la mer en rivière écumante
water_foam_on_sea_tooltip: Peignez de l’Écume du menu Eau sur des cases de mer pour les changer en rivière.
rocks_group: Rochers
rocks_group_descr: Placer, orienter et retirer des rochers en mode Paysage.
rocks_signpost: Panneau sur les cartes d’escarmouche
rocks_signpost_tooltip: Ouvrez Rochers sur une carte d’escarmouche et choisissez Panneau.
rocks_random_preview: Angle de rocher aléatoire à chaque pose
rocks_random_preview_tooltip: Dans Paysage → Rochers, choisissez une taille et cliquez sur Rotation aléatoire. L’aperçu change d’angle après chaque essai.
rocks_variants: Choisir une variante de rocher
rocks_variants_tooltip: Choisissez une taille de rocher et cliquez sur une variante au-dessus de Rochers. La plus petite taille offre un cinquième rocher par défaut.
rocks_invisible: Placer des rochers invisibles
rocks_invisible_tooltip: Cochez la case à droite de Rochers avant de placer. Les rochers invisibles bloquent passage et construction.
rocks_erase_invisible: Effacer les rochers invisibles
rocks_erase_invisible_tooltip: Utilisez la gomme de paysage pour libérer les cases bloquées par des rochers invisibles.
rocks_remove_lost: Nettoyer les entrées de rochers perdus
rocks_remove_lost_tooltip: Cliquez sur « Remove lost rocks » en bas à droite de Rochers pour libérer des emplacements sans toucher aux cases.
heights_group: Reliefs
heights_group_descr: Façonner le relief en mode Paysage.
heights_max_height: Hauteur max dans Reliefs
heights_max_height_tooltip: Choisissez « Max Height » à côté de Hauteur min pour élever le sol sous le pinceau au maximum.
heights_tool_options: Réglages du pinceau de relief
heights_tool_options_tooltip: Choisissez un outil de Reliefs pour régler portée, force, protection du terrain et gestion des rochers au-dessus du menu.
heights_invert_key: Maintenir pour inverser Égaliser
heights_invert_key_tooltip: Avec Égaliser actif, maintenez cette touche pour rendre le sol irrégulier et relâchez pour lisser.
castle_building_counts: Compteurs de bâtiments au-dessus de la minicarte
castle_building_counts_tooltip: Affiche le nombre de bâtiments au-dessus de la minicarte en mode Château. L’infobulle s’écarte par défaut.
castle_tower_ruins: Ruines de tours
castle_tower_ruins_tooltip: Choisissez une ruine sur la ligne de variantes au-dessus des Tours.
castle_tunnel_and_tents: Entrée de tunnel et tentes de siège
castle_tunnel_and_tents_tooltip: Sélectionnez la guilde des tunneliers ou des ingénieurs et choisissez l’entrée ou une tente au-dessus du menu.
castle_statues: Statue et sanctuaires supplémentaires
castle_statues_tooltip: Sélectionnez une statue ou un sanctuaire et choisissez sa variante au-dessus du menu, ou trouvez les ajouts dans Bonnes choses.
castle_barrier: Barrière dans Ruines
castle_barrier_tooltip: Trouvez Barrière en bas à droite de Ruines.
castle_several_keeps: Plusieurs donjons par joueur
castle_several_keeps_tooltip: Placez les donjons supplémentaires normalement. Avec les blasons activés, cliquez sur un blason pour choisir le donjon actif.
castle_several_storage: Plusieurs bâtiments de stockage et de recrutement
castle_several_storage_tooltip: Placez normalement des bâtiments supplémentaires. Des réserves séparées peuvent changer les ressources disponibles à proximité.
castle_tower_engines: Placer les engins de tour sur cases praticables
castle_tower_engines_tooltip: Choisissez un engin de tour dans Bâtiments militaires et placez-le sur une case praticable.
castle_keep_parts: Placer des parties de donjon
castle_keep_parts_tooltip: Sélectionnez un donjon et choisissez « Keep only » ou « No stockpile » sur la ligne au-dessus de Donjons.
castle_damaged_walls: Placer des murs ou escaliers endommagés
castle_damaged_walls_tooltip: Sélectionnez un mur ou escalier et cliquez sur « Damaged » au-dessus du menu de construction avant de placer.
castle_variant_panels: Choisir une variante de bâtiment
castle_variant_panels_tooltip: Sélectionnez un bâtiment compatible et cliquez sur une variante dans la ligne au-dessus du menu.
castle_ruined_cathedral: Placer une cathédrale d’aspect ruiné
castle_ruined_cathedral_tooltip: Choisissez la variante en ruine au-dessus du menu de construction. Elle fonctionne comme une cathédrale.
castle_moat_kinds: Choisir le type de douves
castle_moat_kinds_tooltip: Sélectionnez Douves dans Portes et choisissez « Dug », « Planned » ou « Permanent » au-dessus du menu.
castle_moat_on_marsh: Autoriser les douves sur marais
castle_moat_on_marsh_tooltip: Placez des douves sur un marais. Combler les douves restaure le marais dessous.
castle_moat_removal_keeps_ground: Conserver le sol en retirant les douves
castle_moat_removal_keeps_ground_tooltip: Retirer des douves rétablit le terrain d’origine en dessous.
herds_group: Troupeaux
herds_group_descr: Gérer les troupeaux et les oiseaux en mode Paysage.
herds_panel: Taille et comportement des troupeaux
herds_panel_tooltip: Sélectionnez une espèce vivant en troupeau, puis réglez la taille et le comportement du troupeau dans le panneau au-dessus d’Animaux.
brushes_group: Pinceaux
brushes_group_descr: Modifie la façon dont le pinceau de l’éditeur couvre les cases.
brushes_full_shape: Corriger la forme du pinceau
brushes_full_shape_tooltip: Remplit tout l’aperçu du pinceau sans appliquer l’outil deux fois au centre.
undo_group: Annuler et rétablir
undo_group_descr: Revenir en arrière ou rétablir les modifications récentes.
undo_enabled: Annuler et rétablir
undo_enabled_tooltip: Utilisez les flèches en haut à gauche pour annuler ou rétablir jusqu’à 20 actions. Vous pouvez aussi associer Annuler et Rétablir dans Options > Raccourcis personnalisés.
pipette_group: Pipette
pipette_group_descr: Prélever une case et réutiliser son contenu sur la carte.
pipette_enabled: Copier terrain ou objets avec la pipette
pipette_enabled_tooltip: Cliquez sur la pipette au-dessus du sélecteur de taille du pinceau. Choisissez Reliefs, Textures, Objets ou Tout, cliquez sur une case source, puis peignez.
pipette_select_key: Raccourci de la pipette
pipette_select_key_tooltip: Appuyez encore sur cette touche pour changer de mode, ou attribuez Pipette dans Options > Raccourcis personnalisés.
pipette_read_key: Maintenir pour prélever une autre case
pipette_read_key_tooltip: Maintenez cette touche en cliquant sur une nouvelle case source avec la pipette.
