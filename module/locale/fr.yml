castle_buildings_group: Bâtiments du château
castle_buildings_group_descr: Placer des bâtiments en mode Château.
keeps_group: Donjons et entrepôts
keeps_group_descr: Configurer donjons, entrepôts et bâtiments de recrutement en mode Château.
players_group: Joueurs
players_group_descr: Choisir joueurs, couleurs et types de donjon en mode Château.
fortifications_group: Murs et douves
fortifications_group_descr: Placer murs, escaliers et douves en mode Château.
tree_brush_group: Plantation et pinceaux
tree_brush_group_descr: Régler comment le pinceau de végétation plante en mode Paysage.
tree_spread_group: Propagation des arbres
tree_spread_group_descr: Montrer dans le menu Végétation sur quel sol chaque arbre se propage.
