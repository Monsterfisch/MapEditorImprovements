menu_group: Comportement de l’éditeur
menu_group_descr: Contrôle l’affichage et le rafraîchissement de l’éditeur.
menu_compass: Afficher le nord dans l’éditeur
menu_compass_tooltip: Lisez le nord sur la boussole fixe en haut à gauche, sous Annuler et Rétablir s’ils sont activés.
menu_compass_turn: Ctrl inverse la rotation de la carte
menu_compass_turn_tooltip: Ouvrez l’anneau par clic droit et maintenez Ctrl en allant sur sa boussole pour tourner dans le sens antihoraire.
menu_dust_clouds: Éviter les plantages liés aux nuages de poussière
menu_dust_clouds_tooltip: Empêche les plantages causés par les nuages de poussière pendant l’édition.
menu_always_update: Mettre à jour le panneau de l’éditeur pendant le travail
menu_always_update_tooltip: Garde les contrôles de l’éditeur à jour tant que le curseur survole la carte.
castle_all_players: Afficher les huit écussons de joueurs
castle_all_players_tooltip: Choisissez n’importe lequel des huit écussons à côté de la minicarte en mode Château.
castle_all_keeps: Manoir et forteresse sur chaque carte
castle_all_keeps_tooltip: Sélectionnez le Manoir ou la Forteresse dans Donjons sur tout type de carte.
castle_player_zero: Afficher l’écusson du joueur neutre
castle_player_zero_tooltip: Cliquez sur le neuvième écusson blanc à côté de la minicarte pour placer des objets du joueur 0.
castle_keep_ground: Préserver le sol en plaçant un donjon
castle_keep_ground_tooltip: Place les donjons sans aplanir le terrain en dessous.
castle_rotation: Liste de rotation des bâtiments
castle_rotation_tooltip: En mode Château, cliquez sur « Rotation » juste au-dessus du menu en bas à gauche et choisissez un angle avant de placer un bâtiment compatible.
castle_unit_colour: Choisir la couleur des unités séparément du propriétaire
castle_unit_colour_tooltip: Choisissez un blason au-dessus du menu des unités européennes ou arabes pour changer l’apparence de l’unité.
castle_keep_crests: Choisir le donjon actif par son blason
castle_keep_crests_tooltip: Avec plusieurs donjons activés, cliquez sur un blason pour choisir ou désélectionner le donjon actif. L’aide au survol est active par défaut.
castle_wall_tools: Hauteurs de murs et créneaux isolés
castle_wall_tools_tooltip: Sélectionnez des murs ou escaliers et utilisez les réglages au-dessus du menu. Cliquez sur « Reset » à côté pour tout rétablir.
trees_spread_order: Regrouper les arbres par sol de propagation
trees_spread_order_tooltip: Regroupe les arbres par sol de propagation dans Végétation. Les buissons ont leur propre ligne par défaut.
trees_spread_outlines: Indiquer où les arbres se propagent
trees_spread_outlines_tooltip: Dans Végétation, le vert indique les arbres qui s’étendent sur sol fertile et le beige sur sol infertile.
herds_bird_bins: Supprimer tous les corbeaux ou mouettes
herds_bird_bins_tooltip: Dans Animaux, cliquez sur la corbeille près de l’icône du corbeau ou de la mouette pour retirer cette espèce.
herds_group_warning: Avertir près de la limite de troupeaux
herds_group_warning_tooltip: Affiche les emplacements restants lorsque les troupeaux et groupes de troupes approchent la limite de la carte.
eraser_choice: Choisir ce que la gomme efface
eraser_choice_tooltip: Sélectionnez la Gomme, puis choisissez Tout, Animaux, Unités, Bâtiments, Végétation ou Rochers au-dessus du menu.
eraser_seagulls: Effacer les mouettes en vol
eraser_seagulls_tooltip: Utilisez la Gomme pour retirer les mouettes en vol. Avec les modes de gomme activés, choisissez Animaux ou Tout.
map_settings_show_locked: Afficher les cartes verrouillées dans Charger
map_settings_show_locked_tooltip: Cochez « Show locked maps » sous la liste des fichiers dans la fenêtre Charger de l’éditeur.
map_settings_menu: Paramètres de carte étendus
map_settings_menu_tooltip: Appuyez sur Alt+, dans l’éditeur. Faites glisser le curseur « Map size », puis relâchez pour appliquer la taille. Le bouton « Map Settings » au-dessus de « Vers la carte » est actif par défaut.
map_settings_size_refresh: Appliquer immédiatement les cartes réduites
map_settings_size_refresh_tooltip: Applique une taille réduite en cours d’édition et affiche aussitôt les nouveaux bords.
map_settings_camera_edge: Afficher tout le bord de la carte
map_settings_camera_edge_tooltip: Déplacez la caméra jusqu’au bord pour voir les cases les plus extérieures.
eraser_group: Gomme
eraser_group_descr: Choisit ce que la gomme de paysage efface.
map_settings_group: Paramètres de la carte
map_settings_group_descr: Changer le type, les dimensions et les options de carte, ou parcourir les cartes verrouillées.
qol: Qualité de vie
grid_group: Grille des ressources
grid_key: Raccourci Alt suggéré pour la grille
grid_outside_editor: Autoriser la grille en partie
grid_flattened_only: Grille uniquement en vue aplanie
grid_hide_in_v_view: Masquer la grille en vue V
grid_colour: Couleur de la grille
grid_rotation_group: Orientation du château
grid_rotation_lines: Afficher les limites de rotation du donjon
grid_mine_group: Emprise de la mine de fer
grid_mine_boxes: Afficher l'emprise de la mine de fer
