counts_group: Compteurs de la carte
counts_group_descr: |-
  Affiche dans l'éditeur de paysage le nombre d'animaux, d'arbres et de rochers présents sur la carte ainsi que la marge par rapport aux limites du jeu.
counts_enabled: Afficher les compteurs de la carte
counts_enabled_tooltip: |-
  Survolez les boutons Animaux, Végétation ou Rochers pour afficher une infobulle indiquant le total et la limite du jeu, par exemple « Arbres et buissons : 812/1999 ». L'infobulle Animaux indique également les troupeaux et groupes, qui ont leur propre limite.
  Dans le menu Animaux, les boutons cerf, chameau, lapin et lion affichent leur nombre ; dans le menu Végétation, chaque bouton d'arbre et de buisson affiche le nombre de plantes de ce type.
  Un bouton « i » rouge au-dessus du bouton clé permet d'activer ou de masquer tout cela en cours d'édition.
counts_shown: Afficher les compteurs à l'ouverture de l'éditeur
counts_shown_tooltip: |-
  Désactivé : les compteurs sont masqués au départ et le bouton « i » permet de les afficher.
trees_group: Arbres et buissons
trees_group_descr: |-
  Plus de choix lors du placement de la végétation dans l'éditeur de paysage.
trees_growth: La taille du pinceau définit le stade de croissance de l'arbre
trees_growth_tooltip: |-
  Les arbres sont placés au stade de croissance correspondant à la taille du pinceau : pinceau 1 pour les plus petits, pinceau 4 pour les arbres adultes (ce que l'éditeur place toujours par défaut), pinceau 5 pour des arbres adultes que les bûcherons laissent tranquilles un moment, pinceaux 6 et 7 pour des arbres morts (7 disparaît plus vite). Les buissons ne sont pas concernés.
trees_apple: Bouton Pommier
trees_apple_tooltip: |-
  Ajoute un pommier au menu Végétation. L'image utilisée est images/apple.png (avec apple_hover.png et apple_selected.png) dans le dossier du module ; remplacez-les pour la modifier.
trees_shrubs: Plus de buissons
trees_shrubs_tooltip: |-
  Lorsque le buisson aux quatre autres couleurs est sélectionné, une rangée au-dessus du menu Végétation propose les cinq couleurs.
trees_felled: Arbres abattus
trees_felled_tooltip: |-
  Lorsqu'un arbre est sélectionné, une rangée au-dessus du menu Végétation le propose debout (en premier) puis abattu avec chaque nombre de rondins possible (de 9 à 1 pour un arbre adulte ; les plus petits tombent avec 1 rondin). Cliquez sur l'un d'eux pour placer des arbres abattus ; cliquez sur l'arbre debout, de nouveau sur l'arbre abattu ou sur l'arbre dans le menu pour revenir aux arbres debout.
trees_random_mix: Mélanges aléatoires dans les rangées d'arbres
trees_random_mix_tooltip: |-
  Ajoute des boutons marqués « ? » aux rangées au-dessus du menu Végétation :
  - Arbre aléatoire (premier de la rangée des arbres abattus) : mélange aléatoire de tous les stades de croissance, du plus petit jusqu'à la taille du pinceau. Non proposé pour les plus petits arbres ou les arbres morts.
  - Arbre abattu aléatoire (dernier de la rangée des arbres abattus) : arbres abattus avec un nombre aléatoire de rondins.
  - Buisson aléatoire (dernier de la rangée des buissons) : mélange aléatoire des cinq couleurs de buissons.
  Cliquez de nouveau ou choisissez un autre bouton pour arrêter le mélange.
trees_obstacles: Case à cocher pour les arbres près des obstacles
trees_obstacles_tooltip: |-
  Ajoute une case à cocher dans la rangée supérieure du menu Végétation. Lorsqu'elle est cochée, les arbres peuvent être placés juste à côté des bâtiments, rochers, murs et autres arbres, ce que le jeu empêche normalement (les buissons y sont déjà autorisés). Survolez-la pour voir si elle est active.
trees_rocks_and_water: Case à cocher pour la végétation sur rochers et eau
trees_rocks_and_water_tooltip: |-
  Case à cocher à droite du menu Végétation, sous celle des arbres près des obstacles (décochée au départ). Cochée, les arbres et buissons peuvent aussi être placés sur les marais, rivières, gués, sols rocheux, blocs et graviers.
trees_sorted_rows: Ranger les rangées du menu Végétation
trees_sorted_rows_tooltip: |-
  Déplace le buisson de la rangée du haut vers celle du bas et trie les buissons du bas, afin que la rangée du haut regroupe les arbres (avec le pommier et la case à cocher) et celle du bas tous les buissons.
trees_preview: Aperçu d'arbre
trees_preview_tooltip: |-
  Lorsqu'un arbre ou un buisson est sélectionné, l'arbre qui serait planté s'affiche sur la case sous la souris, au stade du pinceau (ou abattu avec ses rondins), tel que le jeu le dessinera. Désactivé en vue dézoomée.
trees_no_stacking: Empêcher l'empilement des buissons
trees_no_stacking_tooltip: |-
  Il n'est plus possible de placer un arbre ou un buisson sur une case qui en contient déjà un. Certains buissons (celui de la rangée supérieure et les quatre regroupés avec lui) pouvaient s'empiler de façon invisible tout en consommant définitivement la limite d'arbres. La gomme supprime désormais aussi tous les buissons empilés sur une case, permettant de nettoyer les anciens empilements.
textures_group: Textures de terrain
textures_group_descr: |-
  Le menu Textures de l'éditeur de paysage.
textures_gravel_and_iron: Gravier et fer dans le menu Textures
textures_gravel_and_iron_tooltip: |-
  Ajoute le Gravier à la rangée supérieure et le Fer à la rangée inférieure, et répartit les deux rangées uniformément. L'image du gravier est images/gravel.png (avec gravel_hover.png et gravel_selected.png).
textures_no_heights_iron: Fer uniquement dans le menu Textures
textures_no_heights_iron_tooltip: |-
  Retire le bouton Fer du menu Reliefs, maintenant que le menu Textures en possède un.
textures_mask: Bouton Masque
textures_mask_tooltip: |-
  Ajoute un bouton Masque (un carré à moitié rempli) en haut à gauche du menu de l'éditeur de paysage. Lorsqu'il est actif, les outils naturels (reliefs, textures, eau, arbres et buissons, rochers et pipette) ne modifient que les cases ayant la même texture que la première case cliquée ; une fois le bouton de souris relâché, le clic suivant choisit une nouvelle texture cible.
textures_mask_by_type: Le masque regroupe les variantes d'eau
textures_mask_by_type_tooltip: |-
  Le masque ne laisse passer que les cases de même texture que celle cliquée ; chaque texture reste distincte (herbe, broussailles, broussailles épaisses, pierres, plage…). Avec cette option, les variantes d'un même type d'eau comptent comme une seule eau : toute la mer avec ses bords et zones profondes, toute la rivière avec écume, vagues et rebords de cascade, et tous les gués. Mer, rivière et gué restent séparés.
water_group: Eau
water_group_descr: |-
  Le menu Eau de l'éditeur de paysage.
water_decorations: Écume et petites vagues
water_decorations_tooltip: |-
  Restaure deux décorations de rivière de l'éditeur du premier Stronghold, toujours gérées par Crusader mais sans bouton : Écume (eau vive et embruns, comme au pied d'une cascade, sur chaque case de rivière sous le pinceau) et Petites vagues (sur la case de rivière sous la souris). Les deux ne s'appliquent qu'aux rivières et sont enregistrées dans la carte.
water_foam_on_sea: Écume aussi sur l'océan
water_foam_on_sea_tooltip: |-
  L'écume peut aussi être posée sur des cases d'océan, qui deviennent alors de la rivière avec écume (si l'option d'écume est active).
rocks_group: Rochers
rocks_group_descr: |-
  Le menu Rochers de l'éditeur de paysage.
rocks_signpost: Panneau indicateur dans le menu Rochers des cartes d'escarmouche
rocks_signpost_tooltip: |-
  Les cartes d'escarmouche reçoivent le même menu Rochers que les cartes de scénario, avec le bouton panneau indicateur.
rocks_random_preview: Rotation aléatoire visible dans l'aperçu
rocks_random_preview_tooltip: |-
  Lorsque la rotation aléatoire est choisie, le jeu fait tourner le rocher si vite que l'aperçu sous la souris ne peut pas suivre. Avec cette option, il tourne une fois par seconde et l'aperçu montre exactement le rocher sur le point d'être posé.
rocks_variants: Rangée de variantes de rochers
rocks_variants_tooltip: |-
  Une rangée au-dessus du menu Rochers affiche les quatre variantes de la taille de rocher choisie, orientées telles qu'elles seront posées. Cliquez sur l'une d'elles pour ne placer que cette variante ; cliquez de nouveau dessus ou sur un bouton du menu Rochers pour revenir à l'alternance normale du jeu.
rocks_extra_rock: Petit rocher supplémentaire
rocks_extra_rock_tooltip: |-
  Pour les plus petits rochers, la rangée de variantes en propose un cinquième : un petit rocher présent dans le jeu mais que l'éditeur ne place jamais. Il est sauvegardé dans la carte comme n'importe quel autre rocher.
rocks_invisible: Case à cocher pour les rochers invisibles
rocks_invisible_tooltip: |-
  Ajoute une case à cocher à droite des boutons du menu Rochers. Cochée, chaque rocher placé est immédiatement un « rocher invisible » sans avoir à poser 4000 rochers d'abord : les cases sont occupées (impossible d'y bâtir ou d'y marcher) mais aucun rocher n'est dessiné, laissant visible ce qui s'y trouvait (l'astuce des « 2k pierres »). Décochez pour poser des rochers normaux.
rocks_erase_invisible: La gomme efface les rochers invisibles
rocks_erase_invisible_tooltip: |-
  La gomme du paysage (et les outils qui retirent les rochers avec elle) libère aussi les cases de rochers invisibles, comme pour les rochers normaux. Sans cela, il faut recourir à l'astuce du buisson sur chaque case : poser le buisson qui ignore les obstacles puis l'effacer.
rocks_remove_lost: Bouton Supprimer les rochers perdus
rocks_remove_lost_tooltip: |-
  Ajoute un bouton « Supprimer les rochers perdus » en bas à droite du menu Rochers. Un rocher brisé par l'outil élever/abaisser dont toutes les cases ont ensuite été recouvertes de buissons reste dans la liste des rochers de la carte sans aucune case : impossible de le voir, de l'effacer ou de l'atteindre, mais il occupe l'un des 4000 emplacements. Ce bouton retire tous ces rochers de la liste sans modifier les cases.
heights_group: Reliefs
heights_group_descr: |-
  Les outils de relief de l'éditeur de paysage.
heights_max_height: Bouton Hauteur maximale
heights_max_height_tooltip: |-
  Restaure l'outil Hauteur maximale du premier Stronghold, à droite de Hauteur minimale dans le menu Reliefs : il met le terrain sous le pinceau à la hauteur 156. Crusader possède toujours l'outil et ses icônes, seul le bouton avait été retiré.
heights_tool_options: Options des outils de relief
heights_tool_options_tooltip: |-
  Lorsqu'un outil de relief est sélectionné, un panneau au-dessus du menu Reliefs propose (de bas en haut) :
  - Réinitialiser les textures du sol (désactivé au départ) : indique si les outils de relief remettent aussi le sol à sa texture de base (et les plateaux en terre) comme le fait le jeu. Désactivé, ils ne modifient que la hauteur.
  - Briser les cases de rochers (désactivé au départ) : indique si élever, abaisser, égaliser, colline et montagne brisent les rochers touchés comme dans le jeu (les cases touchées deviennent invisibles et franchissables tandis que le rocher reste). Désactivé, les rochers restent intacts.
  - Ignorer l'eau et Ignorer les terres fertiles (désactivés au départ) : les outils de relief laissent intacts mer, rivière, gué, marais et douves, ou broussailles, broussailles épaisses et herbe d'oasis.
  - Pour élever, abaisser et égaliser : Ajuster à la plage (activé au départ), Inverser (égaliser uniquement), la plage de hauteur (8 à 156 au départ ; faites glisser chaque extrémité) et la force. Avec Ajuster à la plage activé, les cases hors plage y sont ramenées comme dans le jeu ; désactivé, elles restent intactes. Inverser fait qu'égaliser rend le terrain plus accidenté au lieu de le lisser.
  - Changement de hauteur des rochers (Rocher entier au départ) : comportement sur un rocher touché. Case seule ne déplace que les cases sous le pinceau ; Rocher entier déplace toutes les cases du rocher d'un bloc ; Effacer le rocher le supprime, comme le faisait Hauteur minimale.
  La plage, Ajuster à la plage, Inverser et les cases d'exclusion reviennent par défaut en quittant l'éditeur de cartes.
heights_invert_key_on: Maintenir pour inverser l'égalisation
heights_invert_key_on_tooltip: |-
  Tant que cette touche est maintenue avec l'outil égaliser sélectionné, celui-ci rend le sol accidenté (comme avec Inverser coché) ; relâchez-la pour lisser de nouveau.
heights_invert_key: Touche pour inverser l'égalisation
heights_invert_key_tooltip: |-
  La touche à maintenir pour inverser l'outil égaliser.
castle_group: Mode château
castle_group_descr: |-
  Le menu de construction du mode château dans l'éditeur de cartes.
castle_building_counts: Compteurs de bâtiments au-dessus de la minicarte
castle_building_counts_tooltip: |-
  Affiche au-dessus de la minicarte le nombre de bâtiments sur la carte par rapport à la limite du jeu (tout compte, y compris donjons, bâtiments de décor et sous-éléments), le total des bâtiments de joueurs et ceux du joueur sélectionné. Les bâtiments de joueurs sont ceux qu'un ennemi peut recevoir l'ordre de détruire.
castle_tower_ruins: Ruines de tours
castle_tower_ruins_tooltip: |-
  Lorsque le menu Tours est ouvert, une rangée au-dessus propose les ruines des cinq tours.
castle_tunnel_and_tents: Entrée de tunnel et tentes de siège
castle_tunnel_and_tents_tooltip: |-
  Dans le menu des bâtiments militaires : avec la guilde des tunneliers sélectionnée, une rangée au-dessus propose une entrée de tunnel ; avec la guilde des ingénieurs sélectionnée, les six tentes de siège.
castle_statues: Statue et sanctuaires
castle_statues_tooltip: |-
  Ajoute la statue 2×2, le sanctuaire 2×2 et le sanctuaire 1×1 inutilisés : à la fin des variantes de la statue et du sanctuaire (voir « Variantes de bâtiments ») ou, si elles sont désactivées, dans une rangée au-dessus du menu des bons éléments.
castle_barrier: Barrière dans le menu Ruines
castle_barrier_tooltip: |-
  Ajoute un bouton Barrière dans l'emplacement libre en bas à droite du menu Ruines : une barrière 1×1 pouvant être supprimée ensuite.
castle_several_keeps: Plusieurs donjons par joueur
castle_several_keeps_tooltip: |-
  Placer un donjon ne supprime plus l'ancien donjon du joueur (ni son feu de camp). Le donjon le plus récent est le donjon actif du joueur ; les autres restent comme bâtiments.
castle_several_storage: Plusieurs bâtiments de stockage et de recrutement
castle_several_storage_tooltip: |-
  Casernes, camps de mercenaires, guildes et autres bâtiments normalement uniques par joueur ne sont plus supprimés lors d'un nouveau placement, et les réserves, greniers et armureries supplémentaires n'ont plus besoin de toucher le premier. Un nombre illimité d'entre eux peuvent aussi rester vides (le jeu n'autorise sinon que 8 greniers ou armureries vides et 32 réserves vides).
castle_tower_engines: Mangonneaux et balistes de tour partout
castle_tower_engines_tooltip: |-
  Le mangonneau de tour et la baliste de tour du menu militaire peuvent être placés partout où une unité peut se tenir (sol, murs, portes, tours, donjon), et plus seulement sur les tours carrées et rondes du joueur : sur la case cliquée, un par case, jusqu'à 4 sur un donjon ou une grande porte et 8 sur les grands donjons de forteresse. L'aperçu est plein partout où le placement est possible.
castle_keep_parts: Donjon sans feu de camp ni réserve
castle_keep_parts_tooltip: |-
  Lorsqu'un donjon est sélectionné, une rangée au-dessus du menu des donjons propose deux variantes supplémentaires : « Donjon seul » (donjon et entrée, sans feu de camp ni réserve) et « Sans réserve » (donjon, entrée et aire du feu de camp). Sélectionner un donjon dans le menu replace le donjon complet.
  L'aperçu et la vérification d'espace ne portent que sur ces éléments.
castle_hover_text: Noms de bâtiments plus à gauche
castle_hover_text_tooltip: |-
  Le nom du bâtiment sous la souris (« Donjon du joueur 1 ») est décalé de 100 pixels vers la gauche afin de ne plus chevaucher les compteurs de bâtiments au-dessus de la minicarte.
castle_damaged_walls: Murs et escaliers endommagés
castle_damaged_walls_tooltip: |-
  Lorsque les escaliers, le mur bas, le mur haut ou les créneaux sont choisis, une rangée au-dessus du menu des bâtiments de château les propose en version « Endommagé » : les murs posés prennent l'aspect crénelé endommagé tout en gardant leur hauteur. Resélectionner le mur dans le menu replace des murs intacts.
castle_variant_panels: Variantes de bâtiments
castle_variant_panels_tooltip: |-
  Lorsqu'un jardin, une statue, un sanctuaire ou une fosse d'aisances est choisi, une rangée au-dessus du menu présente toutes ses variantes ; celle qui y est sélectionnée reste fixe au lieu de défiler chaque seconde. Même chose pour la masure au-dessus du menu Ville. Resélectionner le bâtiment dans le menu revient au fonctionnement du jeu. La pipette reprend également la variante exacte.
castle_ruined_cathedral: Cathédrale en ruine
castle_ruined_cathedral_tooltip: |-
  Lorsque la cathédrale est choisie, une rangée au-dessus du menu Ville la propose en « Ruine » : la cathédrale posée utilise le visuel détruit que le jeu n'affiche sinon que dans une mission historique. En partie, elle reste une cathédrale fonctionnelle d'apparence ruinée. Resélectionner la cathédrale dans le menu replace des cathédrales intactes. La pipette reprend aussi son état en ruine. Nécessite le fichier tile_churches.gm1 d'origine du jeu (les copies plus anciennes ne contiennent pas la ruine et posent une cathédrale intacte).
castle_moat_kinds: Douves creusées, prévues et permanentes
castle_moat_kinds_tooltip: |-
  Lorsque les douves sont sélectionnées dans le menu des portes, une rangée au-dessus propose trois modes : Creusées (mode habituel de l'éditeur), Prévues (douves tracées à creuser, comme en partie) et Permanentes (douves creusées que personne ne peut combler ni effacer en partie). Resélectionner les douves dans le menu revient aux douves creusées.
castle_moat_on_marsh: Douves sur marais
castle_moat_on_marsh_tooltip: |-
  Dans l'éditeur de cartes, les douves peuvent de nouveau être placées sur des marais. Le marais reste dessous et réapparaît si les douves sont comblées.
castle_moat_removal_keeps_ground: Retirer les douves conserve le sol
castle_moat_removal_keeps_ground_tooltip: |-
  L'outil « Supprimer les douves » ne modifie plus que les cases contenant des douves creusées ou prévues : il les retire (en rendant leur hauteur normale aux douves creusées) sans toucher à la texture du sol. Sans cela, toute case sous le pinceau redevient de la terre nue.
herds_group: Troupeaux
herds_group_descr: |-
  Les animaux de l'éditeur de paysage.
herds_panel: Panneau des troupeaux
herds_panel_tooltip: |-
  Lorsque le cerf, le lion, le lapin ou le chameau est sélectionné, un panneau au-dessus du menu Animaux affiche la taille d'un troupeau (part fixe plus part aléatoire) et son type de comportement de groupe. Sa case à cocher adapte la taille du troupeau au pinceau : 2 × taille du pinceau − 1 animaux (de 1 à 13), sans part aléatoire.
brushes_group: Pinceaux
brushes_group_descr: |-
  Les pinceaux de l'éditeur de paysage.
brushes_full_shape: Pinceaux à forme complète
brushes_full_shape_tooltip: |-
  Les pinceaux du jeu comptent deux fois la case sous la souris et oublient la case du coin supérieur gauche, dans l'aperçu comme au placement. Avec cette option, ils retrouvent leur forme complète (dans l'éditeur de cartes ; l'usage interne du jeu reste intact).
undo_group: Annuler et rétablir
undo_group_descr: |-
  Boutons Annuler et Rétablir en haut à gauche de l'éditeur de cartes.
undo_enabled: Annuler et rétablir
undo_enabled_tooltip: |-
  Deux flèches en haut à gauche de l'éditeur de cartes : celle de gauche annule la dernière modification (placement, suppression, peinture, reliefs) et celle de droite la rétablit, jusqu'à 20 étapes. Un bouton est grisé s'il n'y a rien à annuler ou rétablir. Chaque clic compte pour une étape, de même qu'un trait de pinceau maintenu. Les clics sans effet sur la carte ne créent pas d'étape. Charger une autre carte repart d'un historique vide.
pipette_group: Pipette
pipette_group_descr: |-
  Une pipette dans la colonne gauche de l'éditeur de paysage, au-dessus de la taille du pinceau : prélève hauteurs et/ou textures d'une case pour les appliquer aux cases sous le pinceau.
pipette_enabled: Pipette
pipette_enabled_tooltip: |-
  Ajoute le bouton pipette au-dessus de la taille du pinceau (taille du pinceau, règle et gomme descendent légèrement).
  Lorsqu'elle est choisie, une rangée apparaît au-dessus du menu — Reliefs, Textures, Objets, Tout — avec au-dessus ce que contient la pipette. Cliquez sur une case pour prélever (la pipette affiche une seule case), puis cliquez ou glissez pour appliquer aux cases sous le pinceau. Reliefs laisse le sol intact, Textures laisse les hauteurs intactes. Objets prélève le bâtiment, mur, arbre ou rocher d'une case : bâtiments et murs se placent alors comme depuis leur propre menu pour le même joueur (son écusson est sélectionné), arbres (même type et stade, ou abattu avec le même nombre de rondins) et rochers (même type et rotation) comme avec leurs outils respectifs, glisser compris. Tout prélève aussi un arbre ou un rocher 1×1 pour en placer un sur chaque case sous le pinceau. Resélectionner la pipette ou l'un de ses modes la vide.
  Les hauteurs ne sont pas appliquées à mer, plage, marais, douves, rochers, murs ou bâtiments ; les textures non plus aux rochers, murs ou bâtiments. Les rochers de falaise sur pentes raides sont effacés puis recréés là où la pente reste raide. Annuler fonctionne aussi pour la pipette.
pipette_select_key_on: Touche de la pipette
pipette_select_key_on_tooltip: |-
  Une touche qui sélectionne la pipette (et la vide). Pressée de nouveau quand la pipette est active, elle passe au mode suivant : Reliefs, Textures, Objets, Tout.
pipette_select_key: Touche pour la pipette
pipette_select_key_tooltip: |-
  La touche qui sélectionne la pipette dans l'éditeur de cartes. Elle conserve aussi son rôle habituel.
pipette_read_key_on: Maintenir pour prélever une case
pipette_read_key_on_tooltip: |-
  Tant que cette touche est maintenue, une pipette déjà remplie prélève de nouveau une case (l'ancienne reste en mémoire jusqu'au clic). Relâchez pour appliquer de nouveau, si elle contient quelque chose.
pipette_read_key: Touche pour prélever une case
pipette_read_key_tooltip: |-
  La touche à maintenir pour prélever une case alors que la pipette est déjà remplie.
pipette_any_tile_key_on: Maintenir pour appliquer à n'importe quelle case
pipette_any_tile_key_on_tooltip: |-
  Expérimental : tant que cette touche est maintenue, la pipette applique hauteurs et textures à toutes les cases sous le pinceau, y compris mer, marais, rochers (qui restent), murs et bâtiments (jamais le bord de la carte). Ne change pas les règles de placement des objets.
pipette_any_tile_key: Touche pour appliquer à toute case
pipette_any_tile_key_tooltip: |-
  La touche à maintenir pour que la pipette ignore ce qui se trouve sur une case.
