counts_group: 地图数量统计
counts_group_descr: 查看地图距离各项对象数量上限有多近。
counts_enabled: 地图对象数量统计
counts_enabled_tooltip: 点击钥匙按钮上方的红色 i，然后将鼠标悬停在“动物”“植被”“岩石”或其中各项上。
trees_group: 树木与灌木
trees_group_descr: 在地形模式中放置和整理植被。
trees_growth: 用画笔大小控制树木长势
trees_growth_tooltip: 在“植被”中选择树种和画笔大小。4 号为完全成熟，6 号和 7 号放置枯树。
trees_apple: 在“植被”中加入苹果树
trees_apple_tooltip: 种植前在“植被”中选择苹果树。
trees_shrubs: 灌木颜色
trees_shrubs_tooltip: 在“植被”中选中灌木，再在菜单上方一栏选择颜色。
trees_felled: 倒木变体
trees_felled_tooltip: 在“植被”中选中树种，在菜单上方一栏按原木数量选择倒木变体。
trees_random_mix: 随机混合植被
trees_random_mix_tooltip: 点击灌木或树木变体栏中的 ? 以随机混合变体；再次点击或改选其他变体即可停止。
trees_obstacles: 在障碍物旁种树
trees_obstacles_tooltip: 勾选“植被”右侧上方的复选框，即可紧挨障碍物种树。
trees_rocks_and_water: 在岩石和水面上放置植被
trees_rocks_and_water_tooltip: 勾选“植被”右侧下方的复选框，即可在岩石和水面上种植。
trees_preview: 光标下预览植被
trees_preview_tooltip: 在正常缩放下，将鼠标移到地图上即可预览所选树木或灌木。
trees_no_stacking: 防止植被重叠堆放
trees_no_stacking_tooltip: 避免植被堆叠在同一地块上，并可用橡皮擦清除旧的堆叠。
textures_group: 地面纹理
textures_group_descr: 选择地形画笔绘制地表贴图的方式。
textures_gravel_and_iron: 在“贴图”中加入砾石与铁矿
textures_gravel_and_iron_tooltip: 在“贴图”中选择砾石或铁矿并绘制到地图上。
textures_mask: 仅覆盖起始贴图
textures_mask_tooltip: 点击左上角的半实心方块，再从要替换的贴图上起笔绘制。
textures_mask_by_type: 将水域变体视为同一种贴图
textures_mask_by_type_tooltip: 开启遮罩时，可跨起始海洋、河流或浅滩贴图的各种变体绘制。
water_group: 水域
water_group_descr: 在地形模式中绘制河流细节。
water_decorations: 在“水域”中加入水沫与小波浪
water_decorations_tooltip: 在“水域”中选择水沫或小波浪并绘制到河流地块上。
water_foam_on_sea: 将海洋地块转为起沫河流
water_foam_on_sea_tooltip: 用“水域”菜单中的水沫涂抹海洋地块，即可将其变为河流。
rocks_group: 岩石
rocks_group_descr: 在地形模式中放置、旋转和清除岩石。
rocks_signpost: 遭遇战地图中的路标
rocks_signpost_tooltip: 在遭遇战地图中打开“岩石”并选择路标。
rocks_random_preview: 每次放置随机旋转岩石角度
rocks_random_preview_tooltip: 在“地形 → 岩石”中选择大小并点击“随机旋转”，每次尝试放置后预览都会切换角度。
rocks_variants: 选择岩石变体
rocks_variants_tooltip: 选择岩石大小后在“岩石”上方点击变体；最小号默认提供第五种岩石。
rocks_invisible: 放置隐形岩石
rocks_invisible_tooltip: 放置前勾选“岩石”右侧的复选框。隐形岩石会阻挡通行与建造。
rocks_erase_invisible: 擦除隐形岩石
rocks_erase_invisible_tooltip: 使用地形橡皮擦清除被隐形岩石阻挡的地块。
rocks_remove_lost: 清理丢失的岩石记录
rocks_remove_lost_tooltip: 点击“岩石”右下角的“Remove lost rocks”，在不改动地块的情况下释放岩石槽位。
heights_group: 高度
heights_group_descr: 在地形模式中塑造高低起伏。
heights_max_height: 在“高度”中加入最大高度
heights_max_height_tooltip: 在“最小高度”旁选择“Max Height”，将画笔下的地面升至最高。
heights_tool_options: 高度画笔控件
heights_tool_options_tooltip: 选择任一“高度”工具，在菜单上方调节画笔范围、强度、地形保护与岩石处理。
heights_invert_key: 按住以反转“平滑”工具
heights_invert_key_tooltip: 选中“平滑”时，按住此键可使地面变崎岖，松开即恢复平滑。
castle_building_counts: 在小地图上方显示建筑数量
castle_building_counts_tooltip: 在城堡模式的小地图上方查看建筑数量；悬停提示默认移至一旁。
castle_tower_ruins: 塔楼废墟
castle_tower_ruins_tooltip: 在“塔楼”上方的变体栏中选择废墟。
castle_tunnel_and_tents: 隧道入口与攻城帐篷
castle_tunnel_and_tents_tooltip: 选中隧道工公会或工程师公会，在菜单上方选择隧道入口或攻城帐篷。
castle_statues: 额外雕像与神龛
castle_statues_tooltip: 选中雕像或神龛后在菜单上方选择变体，或在“美好事物”中找到新增条目。
castle_barrier: 在“废墟”中加入路障
castle_barrier_tooltip: 在“废墟”右下角可找到路障。
castle_several_keeps: 每名玩家可建多座主堡
castle_several_keeps_tooltip: 照常放置额外主堡。启用主堡徽章后，点击徽章即可切换当前主堡。
castle_several_storage: 可建多座仓储与招募建筑
castle_several_storage_tooltip: 照常放置额外的仓储和招募建筑。分开的储藏区可能影响附近可用资源。
castle_tower_engines: 在可通行地块放置塔楼器械
castle_tower_engines_tooltip: 在“军事建筑”中选择塔楼上的攻城器械，然后将它放到可通行的地块上。
castle_keep_parts: 放置主堡局部结构
castle_keep_parts_tooltip: 选中主堡并在“主堡”上方一栏选择“Keep only”或“No stockpile”。
castle_damaged_walls: 放置受损城墙或阶梯
castle_damaged_walls_tooltip: 选中城墙或阶梯，放置前点击建筑菜单上方的“Damaged”。
castle_variant_panels: 选择建筑变体
castle_variant_panels_tooltip: 选中支持的建筑，再在建筑菜单上方一栏点击变体。
castle_ruined_cathedral: 放置废墟外观的大教堂
castle_ruined_cathedral_tooltip: 在建筑菜单上方选择废墟变体，其功能与正常大教堂相同。
castle_moat_kinds: 选择护城河类型
castle_moat_kinds_tooltip: 在“城门”中选中护城河，在菜单上方选择“Dug”“Planned”或“Permanent”。
castle_moat_on_marsh: 允许在沼泽上挖护城河
castle_moat_on_marsh_tooltip: 可在沼泽上放置护城河，填平后恢复下方沼泽。
castle_moat_removal_keeps_ground: 移除护城河时保留原地形
castle_moat_removal_keeps_ground_tooltip: 移除护城河后会还原其下方的原有地表。
herds_group: 兽群
herds_group_descr: 在地形模式中管理兽群与鸟类。
herds_panel: 兽群规模与行为
herds_panel_tooltip: 选择一种群居动物，然后在“动物”菜单上方的面板设置兽群数量和行为。
brushes_group: 笔刷
brushes_group_descr: 改变编辑器画笔覆盖地块的方式。
brushes_full_shape: 修复画笔形状
brushes_full_shape_tooltip: 完整填充整个画笔预览范围，且不会在中心重复作用两次。
undo_group: 撤销与重做
undo_group_descr: 向后撤销或向前重做最近的编辑。
undo_enabled: 撤销与重做
undo_enabled_tooltip: 点击左上角箭头可撤销/重做最多 20 步，或在“选项 > 自定义快捷键”中绑定快捷键。
pipette_group: 吸管工具
pipette_group_descr: 采样一个地块并在地图上复用其内容。
pipette_enabled: 用吸管复制地形或对象
pipette_enabled_tooltip: 点击画笔大小上方的吸管，选择高度、贴图、对象或全部，再点击来源地块并绘制。
pipette_select_key: 吸管快捷键
pipette_select_key_tooltip: 再次按下此键切换模式，或在“选项 > 自定义快捷键”中绑定吸管。
pipette_read_key: 按住以重新采样地块
pipette_read_key_tooltip: 使用吸管时按住此键并点击新的来源地块。
