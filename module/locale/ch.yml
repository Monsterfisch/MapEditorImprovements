menu_group: 编辑器菜单
menu_group_descr: |-
  屏幕底部编辑器菜单的绘制方式。
menu_dust_clouds: 防止尘土云导致游戏崩溃
menu_dust_clouds_tooltip: |-
  丢失移动数据的尘土云会导致游戏除以零崩溃。开启此项后，这类尘土云会留在原地而不再崩溃。
menu_always_update: 始终保持菜单实时刷新
menu_always_update_tooltip: |-
  游戏默认只在鼠标悬停在菜单上时重绘菜单。在地图区触发的变化（例如快捷键切换工具或放置动物时计数变动）必须把鼠标移回菜单才会更新。开启后，地图编辑器中会持续重绘菜单。
castle_all_players: 所有地图显示全部八个玩家盾徽
castle_all_players_tooltip: |-
  小地图旁的盾徽在所有地图类型中都显示全部八名玩家，而不再仅限多人地图。
castle_all_keeps: 所有地图可用庄园与大型要塞
castle_all_keeps_tooltip: |-
  主堡菜单在多人地图上也提供庄园和大型要塞。
castle_player_zero: 玩家 0 盾徽
castle_player_zero_tooltip: |-
  玩家盾徽中间新增第九个白色盾徽用于选择玩家 0，该玩家也可在地图上拥有建筑和单位。
castle_keep_crests: 活跃主堡盾徽
castle_keep_crests_tooltip: |-
  每座主堡上方都会显示所属玩家的盾徽，其中玩家的活跃主堡（领主、初始部队和新农民出现处）带有边框。点击盾徽可将该主堡设为活跃，点击已活跃盾徽可使该玩家无活跃主堡。新建主堡不再自动接管活跃状态，移除活跃主堡时会由该玩家的另一座主堡接替。主储藏区始终跟随活跃主堡（否则游戏保留最早的储藏区，导致多主堡时 AI 认为建城点被占而不建城）。需开启“每位玩家可放置多个主堡”。
castle_keep_crest_tooltip: 主堡盾徽提示
castle_keep_crest_tooltip_tooltip: |-
  悬停在主堡盾徽上时显示其含义与点击效果。需开启“活跃主堡盾徽”。
castle_wall_tools: 城墙高度与自由城垛
castle_wall_tools_tooltip: |-
  城垛可独立放置。其面板提供矮、高、受损矮、受损高四种样式。城墙面板上方的滑块可分别设置高墙、矮墙和城垛高度（0–255）以及阶梯坡度（0–16）；旁边的“重置”可将当前所选恢复默认，离开地图编辑器时全部重置。
trees_spread_order: 按蔓延地形排序树木
trees_spread_order_tooltip: |-
  植被菜单中先排列在肥沃土地（绿洲草地、茂密和稀疏灌木丛）蔓延的树木，再排列在贫瘠土地（泥土、石地、沙丘）蔓延的树木：第三和第四棵树互换位置。
trees_spread_outlines: 蔓延地形描边标识
trees_spread_outlines_tooltip: |-
  在肥沃土地蔓延的树木周围显示细绿边框，在贫瘠土地蔓延的树木周围显示细米色边框。苹果树不会蔓延，因此无边框。
herds_bird_bins: 清除所有乌鸦 / 海鸥按钮
herds_bird_bins_tooltip: |-
  动物菜单中乌鸦和海鸥按钮右侧的红色垃圾桶按钮：一键移除地图上的全部乌鸦（树木保留）或全部海鸥。
herds_animal_bin: 清除所有动物按钮
herds_animal_bin_tooltip: |-
  动物菜单右侧的红色垃圾桶按钮，效果同 Alt + E，一键移除地图上全部动物。乌鸦和海鸥保留。
herds_group_warning: 兽群与编队数量警告
herds_group_warning_tooltip: |-
  当剩余可创建的兽群与编队少于 200 个时，屏幕顶部会像游戏单位上限一样显示剩余数量提示。
eraser_choice: 橡皮擦筛选面板
eraser_choice_tooltip: |-
  选中橡皮擦时，菜单上方出现筛选面板：全部（同原版）、动物（含乌鸦和海鸥）、单位、建筑（含主堡、废墟和城墙）、植被或岩石（含隐形岩石）。
eraser_seagulls: 橡皮擦可清除海鸥
eraser_seagulls_tooltip: |-
  橡皮擦在“全部”或“动物”模式下也会清除飞过擦除区域的海鸥。
map_settings_show_locked: “显示锁定地图”勾选框
map_settings_show_locked_tooltip: |-
  在编辑器的加载对话框中添加“显示锁定地图”勾选框。勾选后列表立即显示被锁定的地图。
map_settings_button: “地图设置”按钮
map_settings_button_tooltip: |-
  在地图菜单界面“平衡/不平衡”和“入侵/经济”按钮右侧添加“地图设置”按钮，用于打开 Alt + , 菜单。
map_settings_menu: 扩展“地图设置”菜单
map_settings_menu_tooltip: |-
  为 Alt + , 菜单补全标题、单人与多人、四种单人地图类型（攻城、入侵、经济、自由建造）、四种尺寸加自定义与 10–400 尺寸滑块（松开时生效）、平衡、山丘之王、锁定地图和返回按钮。
eraser_group: 橡皮擦
eraser_group_descr: |-
  地形编辑器橡皮擦清除的对象范围。
map_settings_group: 地图设置
map_settings_group_descr: |-
  地图类型、尺寸、锁定状态以及对应的菜单界面。
