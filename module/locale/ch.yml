key_tab: Tab
menu_group: 编辑器行为
menu_group_descr: 控制编辑器的显示与重绘行为。
menu_compass: 在编辑器中显示北方
menu_compass_tooltip: 通过左上角的固定指南针辨认北方（若启用撤销/重做，则位于其下方）。
menu_compass_turn: 按住 Ctrl 反向旋转地图
menu_compass_turn_tooltip: 打开右键环形菜单，按住 Ctrl 移到指南针上即可逆时针旋转。
menu_dust_clouds: 防止尘云导致崩溃
menu_dust_clouds_tooltip: 编辑地图时防止因尘云引发的崩溃。
menu_always_update: 操作时实时更新编辑器面板
menu_always_update_tooltip: 鼠标停留在地图上时保持编辑器控件同步更新。
castle_all_players: 显示全部八名玩家盾徽
castle_all_players_tooltip: 在城堡模式的小地图旁任选八名玩家的盾徽。
castle_all_keeps: 所有地图均可用庄园和要塞
castle_all_keeps_tooltip: 在任意地图类型的“主堡”中都可选择庄园或要塞。
castle_player_zero: 显示中立玩家盾徽
castle_player_zero_tooltip: 点击小地图旁的第九枚白色盾徽，为玩家 0 放置对象。
castle_keep_ground: 放置主堡时保留地形
castle_keep_ground_tooltip: 放置主堡时不再铲平其下方地面。
castle_rotation: 建筑旋转列表
castle_rotation_tooltip: 在城堡模式中，点击左下角菜单正上方的“Rotation”，选择角度后再放置支持的建筑。
castle_unit_colour: 将单位颜色与归属分开选择
castle_unit_colour_tooltip: 在欧洲或阿拉伯兵种菜单上方选择徽章，以更改单位外观颜色。
castle_keep_crests: 通过徽章选择当前主堡
castle_keep_crests_tooltip: 启用多主堡时，点击徽章可选中或取消当前主堡；悬停提示默认开启。
castle_wall_tools: 城墙高度与独立垛口
castle_wall_tools_tooltip: 选中城墙或阶梯并使用菜单上方控件，点击旁边的“Reset”恢复默认设置。
trees_spread_order: 按蔓延地形分组排列树木
trees_spread_order_tooltip: 在“植被”中按蔓延地形对树木分组；灌木默认独立成行。
trees_spread_outlines: 标出树木的蔓延地形
trees_spread_outlines_tooltip: 在“植被”中，绿色标示在肥沃土地蔓延的树，米色标示在贫瘠土地蔓延的树。
herds_bird_bins: 清除全部乌鸦或海鸥
herds_bird_bins_tooltip: 在“动物”中点击乌鸦或海鸥图标旁的垃圾桶，即可移除该类鸟群。
herds_group_warning: 接近兽群上限时发出警告
herds_group_warning_tooltip: 当兽群和部队编组接近地图上限时显示剩余槽位。
eraser_choice: 选择橡皮擦的清除对象
eraser_choice_tooltip: 选中橡皮擦后，在菜单上方选择全部、动物、单位、建筑、植被或岩石。
eraser_seagulls: 擦除飞行中的海鸥
eraser_seagulls_tooltip: 使用橡皮擦即可清除飞行中的海鸥；启用橡皮擦模式后，请选择“动物”或“全部”。
map_settings_show_locked: 在“加载”中显示锁定地图
map_settings_show_locked_tooltip: 在编辑器“加载”窗口的文件列表下方勾选“Show locked maps”。
map_settings_menu: 扩展地图设置
map_settings_menu_tooltip: 在编辑器中按 Alt+,。拖动“Map size”滑块并松开，即可应用新尺寸。“转到地图”上方的“Map Settings”按钮默认开启。
map_settings_size_refresh: 缩小地图时立即生效
map_settings_size_refresh_tooltip: 编辑时应用更小的地图尺寸并立即看到新边界。
map_settings_camera_edge: 显示完整地图边缘
map_settings_camera_edge_tooltip: 将镜头移到边缘即可查看最外侧地图地块。
eraser_group: 橡皮擦
eraser_group_descr: 选择地形橡皮擦要清除的对象类型。
map_settings_group: 地图设置
map_settings_group_descr: 更改地图类型、尺寸与标记，或浏览锁定地图。
qol: 便利性改进
grid_group: 资源网格
grid_key: 建议的网格 Alt 快捷键
grid_outside_editor: 允许在实战中显示网格
grid_flattened_only: 仅在俯视平面视图中显示网格
grid_hide_in_v_view: 在 V 视图中隐藏网格
grid_colour: 网格颜色
grid_rotation_group: 城堡朝向
grid_rotation_lines: 显示主堡朝向分界线
grid_mine_group: 铁矿占地
grid_mine_boxes: 显示铁矿占地
