grid_colour_red: 红色
grid_colour_black: 黑色
map_editor: 地图编辑器
grid_enabled: 显示资源网格
grid_enabled_tooltip: 在编辑器中按 Alt+G 显示，或在“选项 > 自定义快捷键”中重新绑定网格快捷键。
grid_group_descr: 叠加显示资源网格、主堡朝向分界线或铁矿占地范围。
herds_animal_bin: 添加清除所有陆地动物的按钮（Alt+E）
key_configured: 使用已配置的按键
key_off: 关闭
castle_buildings_group: 城堡建筑
castle_buildings_group_descr: 在城堡模式中放置建筑。
keeps_group: 城堡主楼与仓储
keeps_group_descr: 在城堡模式中设置主楼、仓储和招募建筑。
players_group: 玩家
players_group_descr: 在城堡模式中选择玩家、颜色和主楼类型。
fortifications_group: 城墙与护城河
fortifications_group_descr: 在城堡模式中放置城墙、楼梯和护城河。
tree_brush_group: 种植与笔刷
tree_brush_group_descr: 设置地形模式中植被笔刷的种植方式。
tree_spread_group: 树木蔓延
tree_spread_group_descr: 在植被菜单中显示每种树木在哪种地面上蔓延。
cat_terrain_water: 地形与水域
cat_vegetation_animals: 植被与动物
cat_castle_placement: 城堡放置
cat_players_walls_moats: 玩家、城墙与护城河
cat_painting_corrections: 绘制与修正
cat_map_layout: 地图布局与设置
