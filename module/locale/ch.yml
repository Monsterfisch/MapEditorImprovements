counts_group: 地图数量统计
counts_group_descr: |-
  在地形编辑器中显示地图上的动物、树木和岩石数量，以及距离游戏上限还有多少余量。
counts_enabled: 显示地图数量统计
counts_enabled_tooltip: |-
  将鼠标指向“动物”、“植被”或“岩石”按钮即可看到当前数量和游戏上限提示，例如“树木和灌木：812/1999”。“动物”提示还会显示兽群与编队数量（它们有单独上限）。
  在“动物”菜单中，鹿、骆驼、兔子和狮子按钮会各自显示数量；在“植被”菜单中，每个树木和灌木按钮都会显示对应植物的数量。
  钥匙按钮上方的红色“i”按钮可在编辑过程中随时开关此显示。
counts_shown: 打开编辑器时默认显示数字
counts_shown_tooltip: |-
  关闭：数字初始为隐藏状态，可通过“i”按钮呼出。
trees_group: 树木与灌木
trees_group_descr: |-
  在地形编辑器中放置植被时提供更多选择。
trees_growth: 笔刷大小决定树木生长阶段
trees_growth_tooltip: |-
  树木会按当前笔刷大小对应的生长阶段放置：笔刷 1 放置最小的树苗，笔刷 4 放置成年树（编辑器原本始终放置的阶段），笔刷 5 放置伐木工暂时不会砍伐的成年树，笔刷 6 和 7 放置枯死树（7 会更快腐朽消失）。灌木不受影响。
trees_apple: 苹果树按钮
trees_apple_tooltip: |-
  在植被菜单中添加苹果树。按钮图片为模块文件夹中的 images/apple.png（以及 apple_hover.png 和 apple_selected.png），可自行替换。
trees_shrubs: 更多灌木
trees_shrubs_tooltip: |-
  选中拥有另外四种颜色的灌木时，植被菜单上方会出现一排按钮，提供全部五种颜色。
trees_felled: 倒伏树木
trees_felled_tooltip: |-
  选中一种树木时，植被菜单上方会出现一排按钮，依次提供直立状态（第一个）以及各种剩余原木数量的倒伏状态（成年树从 9 到 1 根；最小树苗倒伏时为 1 根）。点击任意一项即可放置倒伏树木；点击直立树、再次点击已选倒伏项或点击菜单中的树木即可切回直立树木。
trees_random_mix: 树木栏中的随机混合
trees_random_mix_tooltip: |-
  在植被菜单上方的扩展栏中添加标有“?”的按钮：
  - 随机树木（倒伏树栏第一个）：从最小到当前笔刷阶段的所有生长阶段随机混合。不适用于最小树苗或枯死树。
  - 随机倒伏树（倒伏树栏最后一个）：原木数量随机的倒伏树木。
  - 随机灌木（灌木栏最后一个）：五种灌木颜色随机混合。
  再次点击该按钮或选择其他按钮即可停止随机混合。
trees_obstacles: 允许树木紧贴障碍物的勾选框
trees_obstacles_tooltip: |-
  在植被菜单顶行添加一个勾选框。勾选后，树木可以直接放置在建筑、岩石、城墙和其他树木紧邻的位置，而游戏原本会禁止这样做（灌木本来就可以放）。鼠标悬停可查看是否开启。
trees_rocks_and_water: 允许植被放置在岩石和水面上的勾选框
trees_rocks_and_water_tooltip: |-
  位于植被菜单右侧、“紧贴障碍物”勾选框下方（默认关闭）。勾选后，树木和灌木也可放置在沼泽、河流、浅滩、岩石地面、巨石和碎石上。
trees_sorted_rows: 整理植被菜单排列
trees_sorted_rows_tooltip: |-
  将顶行的灌木移至底行并整理底行灌木顺序，使顶行统一放置树木（含苹果树和勾选框），底行统一放置全部灌木。
trees_preview: 树木预览
trees_preview_tooltip: |-
  选中树木或灌木时，会在鼠标所在格子上按游戏实际绘制效果预览即将种植的树木，包含笔刷生长阶段（或所选原木数的倒伏状态）。缩小地图视图时不显示。
trees_no_stacking: 禁止灌木重叠堆叠
trees_no_stacking_tooltip: |-
  不能再向已有树木或灌木的格子重复放置植物。部分灌木（顶行灌木及与其归类的四种灌木）过去会隐形堆叠在同一格中，永久消耗树木上限。橡皮擦现在也会清除同一格上堆叠的所有灌木，方便清理旧地图。
textures_group: 地面纹理
textures_group_descr: |-
  地形编辑器的纹理菜单。
textures_gravel_and_iron: 在纹理菜单中添加碎石和铁矿
textures_gravel_and_iron_tooltip: |-
  在顶行添加碎石、在底行添加铁矿，并将两行按钮均匀排布。碎石图片为 images/gravel.png（及 gravel_hover.png、gravel_selected.png）。
textures_no_heights_iron: 仅在纹理菜单保留铁矿
textures_no_heights_iron_tooltip: |-
  既然纹理菜单已有铁矿按钮，便将其从高度菜单中移除。
textures_mask: 蒙版按钮
textures_mask_tooltip: |-
  在地形编辑器菜单左上角添加一个蒙版按钮（半填充正方形）。开启时，自然工具（高度、纹理、水域、树木灌木、岩石和吸管）只会修改与首次点击格子相同纹理的格子；松开鼠标后，下一次点击会重新选定目标纹理。
textures_mask_by_type: 蒙版将同类水域变体视为一体
textures_mask_by_type_tooltip: |-
  蒙版默认只作用于与点击格子完全相同的纹理（草地、灌木丛、茂密灌木丛、石地、沙滩等彼此区分）。开启此项后，同一种水域的不同变体会被视为同一水域：包含边缘与深水区的全部海洋、包含泡沫/波浪/瀑布边缘的全部河流、以及全部浅滩。海洋、河流和浅滩之间仍保持区分。
water_group: 水域
water_group_descr: |-
  地形编辑器的水域菜单。
water_decorations: 泡沫与小波浪
water_decorations_tooltip: |-
  恢复初代《要塞》编辑器中的两种河流装饰（《十字军》依然支持，只是没有按钮）：泡沫（类似瀑布下方的白色水花与飞沫，作用于笔刷下的所有河流格）和小波浪（作用于鼠标下的单个河流格）。两者都只能用于河流格并会保存到地图中。
water_foam_on_sea: 海洋也可添加泡沫
water_foam_on_sea_tooltip: |-
  泡沫也可涂抹在海洋格上，将其变为带泡沫的河流（需开启泡沫选项）。
rocks_group: 岩石
rocks_group_descr: |-
  地形编辑器的岩石菜单。
rocks_signpost: 遭遇战地图岩石菜单中的路标
rocks_signpost_tooltip: |-
  遭遇战地图获得与战役地图相同的岩石菜单，包含路标按钮。
rocks_random_preview: 预览中显示随机旋转
rocks_random_preview_tooltip: |-
  开启随机旋转按钮时，游戏原本每帧旋转一次岩石，鼠标下的预览根本跟不上。开启此项后改为每秒旋转一次，预览将准确显示即将放下的岩石朝向。
rocks_variants: 岩石外观变体栏
rocks_variants_tooltip: |-
  岩石菜单上方的一排按钮会按即将放置的朝向展示所选尺寸的四种岩石变体。点击某一种即可固定只放该变体；再次点击或点击岩石菜单中的任意按钮即可恢复游戏原有的轮换。
rocks_extra_rock: 额外小型岩石
rocks_extra_rock_tooltip: |-
  对于最小尺寸的岩石，变体栏会额外提供第五种变体：游戏内置但编辑器从未放置过的小岩石。它会像其他岩石一样保存到地图中。
rocks_invisible: 隐形岩石勾选框
rocks_invisible_tooltip: |-
  在岩石菜单按钮右侧添加勾选框。勾选后，每次放置的岩石都会立刻成为“隐形岩石”，无需先放满 4000 块岩石：格子会被占用（不可建造也不可通行），但不绘制岩石模型，从而保留原有地表外观（即“2k 石头技巧”）。取消勾选恢复普通岩石。
rocks_erase_invisible: 橡皮擦可清除隐形岩石
rocks_erase_invisible_tooltip: |-
  地形橡皮擦（以及调用它删除岩石的工具）可以像清除普通岩石一样释放隐形岩石占据的格子。否则每个格子都必须用灌木技巧（放上无视障碍物的灌木再擦除）才能清理。
rocks_remove_lost: “移除丢失岩石”按钮
rocks_remove_lost_tooltip: |-
  在岩石菜单右下角添加“移除丢失岩石”按钮。被抬升/降低工具破坏且所有格子又被灌木覆盖的岩石，会在地图岩石列表中留下没有占格的幽灵条目：看不见也擦不掉，却占用 4000 岩石上限名额。该按钮会清除所有此类条目，不改动任何格子。
heights_group: 高度
heights_group_descr: |-
  地形编辑器的高度工具。
heights_max_height: 最大高度按钮
heights_max_height_tooltip: |-
  在高度菜单的“最小高度”右侧恢复初代《要塞》的“最大高度”工具：将笔刷下的地面抬升至高度 156。《十字军》中仍保留了该工具和图标，只是移除了按钮。
heights_tool_options: 高度工具选项
heights_tool_options_tooltip: |-
  选中高度工具时，高度菜单上方的面板（从下到上）提供：
  - 重置地面纹理（默认关闭）：高度工具是否像原版一样把地面恢复成普通地表（并将高地变为泥土）。关闭时仅改变高度。
  - 破坏岩石格（默认关闭）：抬升、降低、平整、丘陵和山峰工具是否像原版一样破坏触及的岩石（被触及的格子变为隐形且可通行，岩石条目仍在）。关闭时岩石保持完整。
  - 忽略水域 / 忽略农田（默认关闭）：高度工具不改动海洋、河流、浅滩、沼泽和护城河，或者不改动灌木丛、茂密灌木丛和绿洲草地。
  - 适用于抬升、降低与平整：吸附到范围（默认开启）、反转（仅平整）、高度范围（默认 8 到 156，两端可拖动）和强度。开启“吸附到范围”时范围外的格子会被拉回范围内；关闭时保持不动。“反转”使平整工具变为制造起伏而非平滑地形。
  - 岩石高度变化（默认“整块岩石”）：高度工具对触及岩石的处理方式。“仅单格”只移动笔刷下的格子；“整块岩石”将整块岩石同步升降；“擦除岩石”直接删除岩石（同“最小高度”）。
  离开地图编辑器时，范围、吸附、反转和忽略勾选框会恢复默认。
heights_invert_key_on: 按住快捷键反转平整工具
heights_invert_key_on_tooltip: |-
  使用平整工具时按住此键会使地面变得崎岖（等同勾选“反转”），松开后恢复平滑。
heights_invert_key: 反转平整工具的按键
heights_invert_key_tooltip: |-
  用于按住反转平整工具的按键。
castle_group: 城堡模式
castle_group_descr: |-
  地图编辑器城堡模式中的建筑菜单。
castle_building_counts: 小地图上方的建筑数量统计
castle_building_counts_tooltip: |-
  在小地图上方显示地图总建筑数与游戏上限的对比（所有建筑均计入，包括主堡、景观建筑及组合建筑的部件）、全部玩家建筑总数以及当前玩家的建筑数。玩家建筑指敌军可被派去摧毁的建筑。
castle_tower_ruins: 塔楼废墟
castle_tower_ruins_tooltip: |-
  打开塔楼菜单时，上方一排按钮会提供五种塔楼的废墟。
castle_tunnel_and_tents: 隧道入口与攻城帐篷
castle_tunnel_and_tents_tooltip: |-
  在军事建筑菜单中：选中隧道工公会时上方提供隧道入口；选中工程师公会时提供六种攻城帐篷。
castle_statues: 雕像与神龛
castle_statues_tooltip: |-
  添加游戏中未使用的 2×2 雕像、2×2 神龛和 1×1 神龛：位于雕像和神龛的变体末尾（见“建筑变体”），若关闭建筑变体则显示在好感物品菜单上方。
castle_barrier: 废墟菜单中的路障
castle_barrier_tooltip: |-
  在废墟菜单右下角空位添加路障按钮：可放置且可再次删除的 1×1 路障。
castle_several_keeps: 每位玩家可放置多个主堡
castle_several_keeps_tooltip: |-
  放置新主堡不再删除该玩家之前的主堡（及其篝火）。最新主堡成为该玩家的活跃主堡，其余作为普通建筑保留。
castle_several_storage: 可放置多个仓储与招募建筑
castle_several_storage_tooltip: |-
  兵营、雇佣兵营地、公会等玩家原本只能拥有一座的建筑在新建时不再被移除，新增的储藏区、粮仓和军械库也无需紧贴第一座。它们可以任意数量保持空置（原版仅允许 8 座空粮仓或空军械库及 32 座空储藏区）。
castle_tower_engines: 塔楼投石机与弩炮可随处放置
castle_tower_engines_tooltip: |-
  军事建筑菜单中的塔楼投石机和塔楼弩炮不再局限于玩家自己的方形和圆形塔楼，可以放在任何允许单位站立的格子上（地面、城墙、城门、塔楼、主堡）：每格一台，主堡或大型城门上最多 4 台，大型要塞主堡上最多 8 台。任何可放置的位置均显示实心预览。
castle_keep_parts: 无篝火或无储藏区的主堡
castle_keep_parts_tooltip: |-
  选中任意主堡时，主堡菜单上方额外提供两种模式：“仅主堡”（主堡与入口，无篝火区和储藏区）和“无储藏区”（主堡、入口与篝火区）。重新在菜单中点击主堡即恢复完整主堡。
  预览与空间检查仅针对所选部件。
castle_hover_text: 建筑名称左移
castle_hover_text_tooltip: |-
  鼠标悬停的建筑名称（如“玩家 1 的主堡”）向左移动 100 像素，不再与小地图上方的建筑计数重叠。
castle_damaged_walls: 受损城墙与阶梯
castle_damaged_walls_tooltip: |-
  选中阶梯、矮墙、高墙或城垛时，城堡建筑菜单上方提供“受损”选项：放置的城墙会使用受损顶部外观（高度不变）。重新在菜单中选择城墙即恢复完好城墙。
castle_variant_panels: 建筑变体
castle_variant_panels_tooltip: |-
  选中花园、雕像、神龛或粪坑时，菜单上方会列出其所有外观变体；选中某一项后会固定保持，不再每秒自动轮换。城镇菜单上方的民房同理。在原菜单重新点击建筑即可恢复默认。吸管也会保留精确变体。
castle_ruined_cathedral: 损毁大教堂
castle_ruined_cathedral_tooltip: |-
  选中大教堂时，城镇菜单上方提供“废墟”选项：放置的大教堂会采用游戏原本仅在一场历史战役中显示的损毁外观，但在游戏中依然是完整可用的大教堂。重新在菜单中点击大教堂恢复完好外观，吸管也会识别损毁状态。需要原版 tile_churches.gm1（旧版文件不含废墟贴图，此时大教堂保持完好）。
castle_moat_kinds: 已挖、规划与永久护城河
castle_moat_kinds_tooltip: |-
  在城门菜单中选中护城河时，上方一排提供三种模式：已挖（编辑器常规护城河）、规划（像游戏内一样标记待挖掘）和永久（游戏中任何人都无法填平或删除的已挖护城河）。重新在菜单中点击护城河恢复为已挖模式。
castle_moat_on_marsh: 在沼泽上放置护城河
castle_moat_on_marsh_tooltip: |-
  允许在地图编辑器中再次把护城河放到沼泽上。下方沼泽会被保留，护城河被填平后会重新显现。
castle_moat_removal_keeps_ground: 移除护城河时保留地面纹理
castle_moat_removal_keeps_ground_tooltip: |-
  编辑器的“移除护城河”工具现在只修改存在已挖或规划护城河的格子：移除护城河（恢复正常高度）同时保留原地表纹理。关闭时笔刷下的所有格子都会变成普通泥土。
herds_group: 兽群
herds_group_descr: |-
  地形编辑器中的动物。
herds_panel: 兽群面板
herds_panel_tooltip: |-
  选中鹿、狮子、兔子或骆驼时，动物菜单上方的面板会显示兽群数量（固定值加随机值）以及使用的群体行为类型。勾选其复选框可使兽群大小随笔刷决定：2 × 笔刷大小 − 1 只动物（1 到 13 只），无随机部分。
brushes_group: 笔刷
brushes_group_descr: |-
  地形编辑器的笔刷。
brushes_full_shape: 完整形状的笔刷
brushes_full_shape_tooltip: |-
  游戏原版笔刷在预览和放置时都会重复计算鼠标下的格子并遗漏左上角一格。开启此项后笔刷恢复完整形状（仅作用于地图编辑器，不影响游戏本体逻辑）。
undo_group: 撤销与重做
undo_group_descr: |-
  地图编辑器左上角的撤销与重做按钮。
undo_enabled: 撤销与重做
undo_enabled_tooltip: |-
  地图编辑器左上角的两个箭头按钮：左键撤销上一步地图操作（放置、删除、绘制、高度），右键重做，最多保留 20 步。无可撤销或重做时按钮变灰。每次点击或按住拖动的一整笔均记为一步；未改动地图的点击（例如未选工具时）不计步。加载新地图会重置历史记录。
pipette_group: 吸管工具
pipette_group_descr: |-
  位于地形编辑器左侧栏笔刷大小上方的吸管：吸取单个格子的高度和/或纹理并涂抹到笔刷下的格子。
pipette_enabled: 吸管工具
pipette_enabled_tooltip: |-
  在笔刷大小上方添加吸管按钮（笔刷大小、标尺和橡皮擦会略微下移）。
  选中后菜单上方出现选项栏——高度、纹理、对象、全部——上方显示吸管当前内容。点击格子即可吸取（吸管仅显示单格），再点击或拖动即可应用到笔刷范围。“高度”不改纹理，“纹理”不改高度。“对象”会吸取格子上的建筑、城墙、树木或岩石：建筑和城墙按对应菜单方式为原所属玩家放置（自动切换其盾徽），树木（同种类与阶段，或同原木数倒伏树）和岩石（同种类与旋转）按各自工具方式放置且支持拖动。“全部”还会额外吸取树木或 1×1 岩石并铺满笔刷下每个空位。再次点击吸管或其模式即可清空。
  高度不会应用于海洋、沙滩、沼泽、护城河、岩石、城墙或建筑；纹理不会应用于岩石、城墙或建筑。陡坡边缘的悬崖岩石会自动清理并在仍陡峭处重新生成。撤销同样支持吸管操作。
pipette_select_key_on: 吸管快捷键
pipette_select_key_on_tooltip: |-
  用于选中（并清空）吸管的按键。吸管已选中时再次按下会循环切换模式：高度、纹理、对象、全部。
pipette_select_key: 选择吸管的按键
pipette_select_key_tooltip: |-
  在地图编辑器中选择吸管的按键，仍会保留该按键原本的功能。
pipette_read_key_on: 按住重新吸取格子
pipette_read_key_on_tooltip: |-
  按住此键时，已装有内容的吸管可以重新吸取新格子（点击前保留旧内容）；松开后恢复涂抹。
pipette_read_key: 吸取格子的按键
pipette_read_key_tooltip: |-
  吸管已装有内容时，按住以重新吸取格子的按键。
pipette_any_tile_key_on: 按住应用到任意格子
pipette_any_tile_key_on_tooltip: |-
  实验性：按住此键时，吸管会将高度和纹理强制应用到笔刷下的所有格子，包括海洋、沼泽、岩石（保留）、城墙和建筑（绝不影响地图边缘）。不改变对象的放置规则。
pipette_any_tile_key: 应用到任意格子的按键
pipette_any_tile_key_tooltip: |-
  按住后使吸管无视格子上已有内容的按键。
