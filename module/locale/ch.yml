grid_enabled_tooltip: 允许在地图上显示资源网格。关闭：网格及其快捷键均不可用。
grid_group_descr: 在地图上绘制 AI 的 5×5 资源网格、城堡旋转分界线以及铁矿占地。在地图编辑器中按 Alt 加所选按键可显示或隐藏网格。
