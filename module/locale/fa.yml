counts_group: شمارنده‌های نقشه
counts_group_descr: نشان می‌دهد نقشه چقدر به سقف شمار اشیا نزدیک است.
counts_enabled: شمارش اشیای نقشه
counts_enabled_tooltip: روی i قرمز بالای دکمهٔ دارای نماد کلید کلیک کنید، سپس نشانگر را روی «حیوانات»، «پوشش گیاهی»، «صخره‌ها» یا یکی از گزینه‌های این منوها ببرید.
trees_group: درختان و بوته‌ها
trees_group_descr: قرار دادن و مرتب‌سازی پوشش گیاهی در حالت چشم‌انداز.
trees_growth: اندازهٔ قلم‌مو رشد درخت را تعیین کند
trees_growth_tooltip: در «پوشش گیاهی» درخت و اندازهٔ قلم‌مو را انتخاب کنید. اندازهٔ 4 درخت بالغ و اندازه‌های 6 و 7 درخت خشک می‌کارند.
trees_apple: درخت سیب در پوشش گیاهی
trees_apple_tooltip: پیش از کاشتن، درخت سیب را در پوشش گیاهی انتخاب کنید.
trees_shrubs: رنگ بوته‌ها
trees_shrubs_tooltip: یک بوته در پوشش گیاهی انتخاب کنید و سپس رنگی از ردیف بالای منو برگزینید.
trees_felled: گونه‌های درخت افتاده
trees_felled_tooltip: درختی در پوشش گیاهی انتخاب کرده و گونهٔ افتاده را بر اساس تعداد تنه از ردیف بالای منو برگزینید.
trees_random_mix: ترکیب تصادفی پوشش گیاهی
trees_random_mix_tooltip: برای ترکیب گونه‌ها روی ? در ردیف بوته یا درخت کلیک کنید. برای توقف دوباره کلیک کنید یا گونهٔ دیگری برگزینید.
trees_obstacles: درخت در کنار موانع
trees_obstacles_tooltip: کادر بالایی سمت راست پوشش گیاهی را تیک بزنید تا کنار موانع درخت بکارید.
trees_rocks_and_water: پوشش گیاهی روی صخره و آب
trees_rocks_and_water_tooltip: کادر پایینی سمت راست پوشش گیاهی را تیک بزنید تا روی صخره و آب بکارید.
trees_preview: پیش‌نمایش پوشش گیاهی زیر نشانگر
trees_preview_tooltip: در بزرگ‌نمایی عادی، نشانگر را روی نقشه ببرید تا پیش‌نمایش درخت یا بوتهٔ انتخابی را ببینید.
trees_no_stacking: جلوگیری از روی‌هم‌گذاری پوشش گیاهی
trees_no_stacking_tooltip: از انباشته شدن گیاهان روی یک کاشی جلوگیری می‌کند و انباشته‌های قدیمی را با پاک‌کن پاک می‌کند.
textures_group: بافت‌های زمین
textures_group_descr: نحوهٔ رنگ‌آمیزی بافت زمین توسط قلم‌موی چشم‌انداز را تعیین می‌کند.
textures_gravel_and_iron: سنگریزه و آهن در بافت‌ها
textures_gravel_and_iron_tooltip: سنگریزه یا آهن را در بافت‌ها انتخاب کرده و روی نقشه بکشید.
textures_mask: رنگ‌آمیزی فقط روی بافت آغازین
textures_mask_tooltip: روی مربع نیمه‌پر در بالا سمت چپ کلیک کنید و هر حرکت را روی بافتی که می‌خواهید عوض شود آغاز کنید.
textures_mask_by_type: یکی دانستن گونه‌های آب در بافت
textures_mask_by_type_tooltip: با روشن بودن ماسک، روی گونه‌های مختلف بافت آغازین دریا، رود یا گذرگاه آب می‌کشد.
water_group: آب
water_group_descr: افزودن جزئیات رودخانه در حالت چشم‌انداز.
water_decorations: کف و موج کوچک در آب
water_decorations_tooltip: کف یا موج کوچک را در منوی آب انتخاب کرده و روی کاشی‌های رودخانه بکشید.
water_foam_on_sea: تبدیل کاشی‌های دریا به رود کف‌آلود
water_foam_on_sea_tooltip: کف را از منوی آب روی کاشی‌های دریا بکشید تا به رود تبدیل شوند.
rocks_group: صخره‌ها
rocks_group_descr: قرار دادن، چرخاندن و حذف صخره‌ها در حالت چشم‌انداز.
rocks_signpost: تابلوی راهنما در نقشه‌های نبرد آزاد
rocks_signpost_tooltip: در نقشهٔ نبرد آزاد، صخره‌ها را باز کرده و تابلوی راهنما را انتخاب کنید.
rocks_random_preview: زاویهٔ تصادفی صخره در هر جاگذاری
rocks_random_preview_tooltip: در چشم‌انداز > صخره‌ها، اندازه‌ای برگزینید و روی چرخش تصادفی کلیک کنید. پیش‌نمایش پس از هر تلاش زاویهٔ دیگری برمی‌گزیند.
rocks_variants: انتخاب گونهٔ صخره
rocks_variants_tooltip: اندازهٔ صخره را انتخاب کرده و روی یک گونه بالای صخره‌ها کلیک کنید. کوچک‌ترین اندازه به‌طور پیش‌فرض صخرهٔ پنجم دارد.
rocks_invisible: قرار دادن صخره‌های نامرئی
rocks_invisible_tooltip: پیش از جاگذاری، کادر سمت راست صخره‌ها را تیک بزنید. صخره‌های نامرئی مانع عبور و ساخت‌وساز می‌شوند.
rocks_erase_invisible: پاک کردن صخره‌های نامرئی
rocks_erase_invisible_tooltip: از پاک‌کن چشم‌انداز برای پاک‌سازی کاشی‌های مسدودشده با صخرهٔ نامرئی استفاده کنید.
rocks_remove_lost: پاک‌سازی رکوردهای صخره‌های گمشده
rocks_remove_lost_tooltip: روی «Remove lost rocks» در پایین راست صخره‌ها کلیک کنید تا بدون تغییر کاشی‌ها ظرفیت آزاد شود.
heights_group: ارتفاعات
heights_group_descr: شکل‌دهی به پستی‌وبلندی زمین در حالت چشم‌انداز.
heights_max_height: بیشینهٔ ارتفاع در ارتفاعات
heights_max_height_tooltip: «Max Height» کنار کمینهٔ ارتفاع را انتخاب کنید تا زمین زیر قلم‌مو به بیشترین ارتفاع برسد.
heights_tool_options: کنترل‌های قلم‌موی ارتفاع
heights_tool_options_tooltip: یک ابزار ارتفاعات برگزینید تا بازه، قدرت، محافظت زمین و برخورد با صخره‌ها را بالای منو تنظیم کنید.
heights_invert_key: نگه‌داشتن برای وارونه کردن هموارسازی
heights_invert_key_tooltip: با انتخاب هموارسازی، این کلید را نگه دارید تا زمین ناهموار شود و برای هموارسازی دوباره رهایش کنید.
castle_building_counts: شمارش ساختمان‌ها بالای نقشهٔ کوچک
castle_building_counts_tooltip: شمار ساختمان‌ها را بالای نقشهٔ کوچک در حالت قلعه ببینید. متن شناور به‌طور پیش‌فرض کنار می‌رود.
castle_tower_ruins: ویرانه‌های برج‌ها
castle_tower_ruins_tooltip: یک ویرانه را از ردیف گونه‌ها بالای برج‌ها برگزینید.
castle_tunnel_and_tents: ورودی تونل و چادرهای محاصره
castle_tunnel_and_tents_tooltip: صنف تونل‌کن‌ها یا صنف مهندسان را انتخاب کرده و ورودی یا چادر را بالای منو برگزینید.
castle_statues: تندیس و زیارتگاه‌های بیشتر
castle_statues_tooltip: تندیس یا زیارتگاهی انتخاب کرده و گونه‌اش را بالای منو برگزینید یا موارد اضافی را در چیزهای خوب بیابید.
castle_barrier: مانع در ویرانه‌ها
castle_barrier_tooltip: مانع را در پایین راست بخش ویرانه‌ها بیابید.
castle_several_keeps: چند دژ مرکزی برای هر بازیکن
castle_several_keeps_tooltip: دژهای اضافی را مثل معمول قرار دهید. با فعال بودن نشان‌های دژ، برای انتخاب دژ فعال روی یک نشان کلیک کنید.
castle_several_storage: چند ساختمان انبار و سربازگیری
castle_several_storage_tooltip: ساختمان‌های انبار و سربازگیری اضافی را مثل معمول بگذارید. انبارهای جداگانه ممکن است دسترسی منابع اطراف را تغییر دهند.
castle_tower_engines: قرار دادن ادوات برجی روی کاشی‌های قابل عبور
castle_tower_engines_tooltip: یک وسیلهٔ برجی را از ساختمان‌های نظامی انتخاب کرده و روی کاشی قابل عبور بگذارید.
castle_keep_parts: قرار دادن بخش‌هایی از دژ مرکزی
castle_keep_parts_tooltip: یک دژ را انتخاب کرده و در ردیف بالای دژها گزینهٔ «Keep only» یا «No stockpile» را برگزینید.
castle_damaged_walls: قرار دادن دیوار یا پلهٔ آسیب‌دیده
castle_damaged_walls_tooltip: دیوار یا پله را انتخاب کرده و پیش از جاگذاری روی «Damaged» بالای منوی ساختمان کلیک کنید.
castle_variant_panels: انتخاب گونهٔ ساختمان
castle_variant_panels_tooltip: ساختمان پشتیبانی‌شده را انتخاب کرده و روی یک گونه در ردیف بالای منوی ساختمان کلیک کنید.
castle_ruined_cathedral: قرار دادن کلیسای جامع با ظاهر ویرانه
castle_ruined_cathedral_tooltip: گونهٔ ویرانه را بالای منوی ساختمان برگزینید؛ عملکردش مانند کلیسای جامع عادی است.
castle_moat_kinds: انتخاب نوع خندق
castle_moat_kinds_tooltip: خندق را در دروازه‌ها انتخاب کرده و بالای منو گزینهٔ «Dug»، «Planned» یا «Permanent» را برگزینید.
castle_moat_on_marsh: اجازهٔ خندق روی باتلاق
castle_moat_on_marsh_tooltip: خندق را روی باتلاق بگذارید. پر کردن خندق باتلاق زیر آن را برمی‌گرداند.
castle_moat_removal_keeps_ground: حفظ زمین هنگام حذف خندق
castle_moat_removal_keeps_ground_tooltip: حذف خندق زمین اصلی زیر آن را بازمی‌گرداند.
herds_group: گله‌ها
herds_group_descr: مدیریت گله‌ها و پرندگان در حالت چشم‌انداز.
herds_panel: اندازه و رفتار گله
herds_panel_tooltip: حیوان گله‌ای را انتخاب کرده و اندازه و رفتارش را در پنل بالای حیوانات تنظیم کنید.
brushes_group: قلم‌موها
brushes_group_descr: نحوهٔ پوشش کاشی‌ها توسط قلم‌موی ویرایشگر را تغییر می‌دهد.
brushes_full_shape: اصلاح شکل قلم‌مو
brushes_full_shape_tooltip: کل پیش‌نمایش قلم‌مو را پر می‌کند بی‌آنکه ابزار در مرکز دو بار اعمال شود.
undo_group: واگرد و از نو
undo_group_descr: بازگشت و پیش‌روی میان ویرایش‌های اخیر.
undo_enabled: واگرد و از نو
undo_enabled_tooltip: با پیکان‌های بالا سمت چپ تا 20 ویرایش را واگردانی یا دوباره اعمال کنید. میانبرهای این دو عمل را می‌توانید در «گزینه‌ها > میانبرهای سفارشی» تعیین کنید.
pipette_group: قطره‌چکان
pipette_group_descr: نمونه‌برداری از یک کاشی و استفادهٔ دوباره از محتوای آن روی نقشه.
pipette_enabled: کپی کردن زمین یا اشیا با قطره‌چکان
pipette_enabled_tooltip: روی قطره‌چکان بالای اندازهٔ قلم‌مو کلیک کرده، ارتفاعات، بافت‌ها، اشیا یا همه را برگزینید، سپس روی کاشی مبدأ کلیک کرده و بکشید.
pipette_select_key: میانبر قطره‌چکان
pipette_select_key_tooltip: فشردن دوبارهٔ این کلید حالت‌ها را عوض می‌کند؛ یا قطره‌چکان را در «گزینه‌ها > میانبرهای سفارشی» تنظیم کنید.
pipette_read_key: نگه‌داشتن برای نمونه‌برداری از کاشی دیگر
pipette_read_key_tooltip: هنگام کلیک روی کاشی مبدأ جدید با قطره‌چکان، این کلید را نگه دارید.
