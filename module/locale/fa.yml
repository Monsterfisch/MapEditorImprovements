menu_group: منوی ویرایشگر
menu_group_descr: |-
  نحوهٔ ترسیم منوی ویرایشگر در پایین صفحه.
menu_dust_clouds: جلوگیری از کرش بازی بر اثر ابرهای گردوغبار
menu_dust_clouds_tooltip: |-
  ابر گردوغباری که دادهٔ حرکتش از دست رفته بود باعث تقسیم بر صفر و کرش بازی می‌شد. با این گزینه چنین ابری سر جای خود می‌ماند.
menu_always_update: به‌روز نگه داشتن همیشگی منو
menu_always_update_tooltip: |-
  بازی منو را تنها وقتی ماوس رویش است دوباره رسم می‌کند. تغییرات بیرونی مانند میانبر تغییر ابزار یا تغییر شمارنده هنگام گذاشتن حیوانات تا وقتی ماوس به منو برنگردد نمایش داده نمی‌شوند. با این گزینه منو پیوسته در ویرایشگر نقشه بازترسیم می‌شود.
castle_all_players: هر هشت سپر بازیکن در همهٔ نقشه‌ها
castle_all_players_tooltip: |-
  سپرهای کنار نقشهٔ کوچک در همهٔ انواع نقشه هر هشت بازیکن را نشان می‌دهند، نه فقط در نقشه‌های چندنفره.
castle_all_keeps: عمارت اربابی و دژ بزرگ در همهٔ نقشه‌ها
castle_all_keeps_tooltip: |-
  منوی دژها عمارت اربابی و دژ بزرگ را در نقشه‌های چندنفره نیز ارائه می‌دهد.
castle_player_zero: سپر بازیکن ۰
castle_player_zero_tooltip: |-
  نهمین سپر سفید در میانهٔ سپرهای بازیکنان، بازیکن ۰ را انتخاب می‌کند که او هم می‌تواند مالک ساختمان‌ها و واحدها در نقشه باشد.
castle_keep_crests: نشان‌های دژ مرکزی فعال
castle_keep_crests_tooltip: |-
  هر دژ مرکزی سپر مالکش را بالای خود نشان می‌دهد و دژ فعال بازیکن (جایی که لرد، نیروهای آغازین و دهقانان جدید ظاهر می‌شوند) قاب‌دار است. کلیک روی یک سپر آن دژ را فعال می‌کند و کلیک روی سپر فعال بازیکن را بدون دژ فعال می‌گذارد. دژ جدید دیگر خودکار جای فعال را نمی‌گیرد و هنگام حذف دژ فعال، دژ دیگری از همان بازیکن جایگزین می‌شود. انبار کالای اصلی همیشه دنباله‌رو دژ فعال است (بازی قبلاً اولین انبار گذاشته‌شده را نگه می‌داشت که در حالت چند دژ باعث مسدود شدن محل قلعهٔ هوش مصنوعی می‌شد). نیازمند «چند دژ مرکزی برای هر بازیکن».
castle_keep_crest_tooltip: راهنمای نشان دژ مرکزی
castle_keep_crest_tooltip_tooltip: |-
  بردن ماوس روی نشان دژ مرکزی معنای آن و اثر کلیک را توضیح می‌دهد. نیازمند «نشان‌های دژ مرکزی فعال».
castle_wall_tools: ارتفاع دیوارها و کنگره‌های آزاد
castle_wall_tools_tooltip: |-
  کنگره‌ها می‌توانند مستقل بایستند. پنلشان گزینه‌های کوتاه، بلند، کوتاه آسیب‌دیده و بلند آسیب‌دیده را ارائه می‌دهد. لغزنده‌ای بالای پنل دیوارها ارتفاع دیوارهای بلند، کوتاه و کنگره‌ها (۰ تا ۲۵۵) و شیب پله‌ها (۰ تا ۱۶) را جداگانه تنظیم می‌کند؛ دکمهٔ بازنشانی کنار آن مقدار معمول را برمی‌گرداند و خروج از ویرایشگر همه را بازنشانی می‌کند.
trees_spread_order: مرتب‌سازی درختان به ترتیب زمینِ گسترش
trees_spread_order_tooltip: |-
  در منوی پوشش گیاهی ابتدا درختانی که در زمین حاصل‌خیز (علف واحه، بوته‌زار انبوه و تنک) گسترش می‌یابند می‌آیند و سپس درختِ زمین غیرحاصل‌خیز (خاک، خاک سنگی، تپهٔ شنی): درخت سوم و چهارم جابه‌جا می‌شوند.
trees_spread_outlines: حاشیه برای نوع زمینِ گسترش
trees_spread_outlines_tooltip: |-
  یک حاشیهٔ نازک سبز دور درختان زمین حاصل‌خیز و حاشیهٔ نازک بژ دور درخت زمین غیرحاصل‌خیز می‌کشد. درخت سیب گسترش نمی‌یابد و حاشیه ندارد.
herds_bird_bins: دکمه‌های پاک کردن همهٔ کلاغ‌ها / مرغ‌های دریایی
herds_bird_bins_tooltip: |-
  دکمه‌های سطل زبالهٔ قرمز در سمت راست دکمه‌های کلاغ و مرغ دریایی در منوی حیوانات: با یک کلیک همهٔ کلاغ‌ها (درختان می‌مانند) یا همهٔ مرغ‌های دریایی را از نقشه حذف می‌کنند.
herds_animal_bin: دکمهٔ پاک کردن همهٔ حیوانات
herds_animal_bin_tooltip: |-
  دکمهٔ سطل زبالهٔ قرمز در سمت راست منوی حیوانات که مانند Alt + E همهٔ حیوانات را از نقشه حذف می‌کند. کلاغ‌ها و مرغ‌های دریایی می‌مانند.
herds_group_warning: هشدار گله‌ها و گروه‌ها
herds_group_warning_tooltip: |-
  وقتی کمتر از ۲۰۰ گله و گروه دیگر قابل ساخت باشد، سطری در بالای صفحه تعداد باقی‌مانده را مانند سطر واحدهای بازی اعلام می‌کند.
eraser_choice: پنل انتخاب پاک‌کن
eraser_choice_tooltip: |-
  هنگام انتخاب پاک‌کن، پنلی بالای منو مشخص می‌کند چه چیزی پاک شود: همه (مثل قبل)، حیوانات (همراه کلاغ‌ها و مرغ‌های دریایی)، واحدها، ساختمان‌ها (با دژها، ویرانه‌ها و دیوارها)، پوشش گیاهی یا صخره‌ها (شامل صخره‌های نامرئی).
eraser_seagulls: پاک‌کن مرغ‌های دریایی را نیز حذف کند
eraser_seagulls_tooltip: |-
  پاک‌کن مرغ‌های دریایی در حال پرواز بر فراز خانه‌های پاک‌شده را هم حذف می‌کند (در حالت همه یا حیوانات).
map_settings_show_locked: کادر «نمایش نقشه‌های قفل‌شده»
map_settings_show_locked_tooltip: |-
  کادر انتخاب «نمایش نقشه‌های قفل‌شده» در پنجرهٔ بارگذاری ویرایشگر. با تیک زدن آن، نقشه‌های قفل‌شده نیز بلافاصله در فهرست دیده می‌شوند.
map_settings_button: دکمهٔ تنظیمات نقشه
map_settings_button_tooltip: |-
  دکمهٔ «تنظیمات نقشه» در صفحهٔ منوی نقشه، سمت راست دکمه‌های متوازن/نامتوازن و تهاجم/اقتصادی. منوی Alt + , را باز می‌کند.
map_settings_menu: منوی گسترده‌تر تنظیمات نقشه
map_settings_menu_tooltip: |-
  منوی Alt + , دارای عنوان، تک‌نفره و چندنفره، چهار نوع نقشهٔ تک‌نفره (محاصره، تهاجم، اقتصادی، ساخت آزاد)، چهار اندازه به‌علاوهٔ سفارشی و لغزندهٔ اندازه (۱۰ تا ۴۰۰؛ هنگام رها کردن اعمال می‌شود)، متوازن، پادشاه تپه، قفل کردن نقشه و دکمهٔ بازگشت می‌شود.
eraser_group: پاک‌کن
eraser_group_descr: |-
  آنچه پاک‌کن ویرایشگر چشم‌انداز حذف می‌کند.
map_settings_group: تنظیمات نقشه
map_settings_group_descr: |-
  تنظیمات نقشه: نوع، اندازه، قفل و منوهای نمایش‌دهندهٔ آن‌ها.
