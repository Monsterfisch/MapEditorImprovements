map_settings_menu_tooltip: در ویرایشگر Alt+, را بزنید. لغزندهٔ «Map size» را بکشید و رها کنید تا اندازه اعمال شود. دکمهٔ «Map Settings» بالای «به نقشه» به‌طور پیش‌فرض فعال است.
map_settings_size_refresh: اعمال فوری نقشه‌های کوچک‌تر
map_settings_size_refresh_tooltip: اندازهٔ کوچک‌تر نقشه را هنگام ویرایش اعمال کرده و لبه‌های جدید را بی‌درنگ ببینید.
