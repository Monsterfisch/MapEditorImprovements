counts_group: شمارنده‌های نقشه
counts_group_descr: |-
  در ویرایشگر چشم‌انداز نشان می‌دهد چه تعداد حیوان، درخت و صخره در نقشه وجود دارد و چقدر به سقف بازی نزدیک است.
counts_enabled: نمایش شمارنده‌های نقشه
counts_enabled_tooltip: |-
  نشانگر ماوس را روی دکمه‌های «حیوانات»، «پوشش گیاهی» یا «صخره‌ها» ببرید تا راهنمایی همراه با تعداد فعلی و سقف بازی ببینید، مانند «درختان و بوته‌ها: 812/1999». راهنمای حیوانات همچنین گله‌ها و گروه‌ها را نشان می‌دهد که سقف جداگانه‌ای دارند.
  در منوی حیوانات، دکمه‌های آهو، شتر، خرگوش و شیر تعداد هرکدام را نشان می‌دهند و در منوی پوشش گیاهی، هر دکمهٔ درخت و بوته تعداد همان گیاه را نمایش می‌دهد.
  یک دکمهٔ قرمز «i» بالای دکمهٔ کلید، همهٔ این‌ها را حین کار روشن و خاموش می‌کند.
counts_shown: نمایش اعداد هنگام باز شدن ویرایشگر
counts_shown_tooltip: |-
  خاموش: اعداد در ابتدا پنهان هستند و دکمهٔ «i» آن‌ها را نمایش می‌دهد.
trees_group: درختان و بوته‌ها
trees_group_descr: |-
  انتخاب‌های بیشتر هنگام قرار دادن پوشش گیاهی در ویرایشگر چشم‌انداز.
trees_growth: اندازهٔ قلم‌مو مرحلهٔ رشد درخت را تعیین می‌کند
trees_growth_tooltip: |-
  درختان در مرحلهٔ رشدِ متناسب با اندازهٔ قلم‌مو قرار می‌گیرند: قلم‌موی ۱ کوچک‌ترین درختان، قلم‌موی ۴ درختان کامل (آنچه ویرایشگر همیشه قرار می‌داد)، قلم‌موی ۵ درختان کاملی که هیزم‌شکن‌ها مدتی به آن‌ها دست نمی‌زنند، و قلم‌موی ۶ و ۷ درختان خشکیده (۷ زودتر پوسیده می‌شود). بوته‌ها تغییری نمی‌کنند.
trees_apple: دکمهٔ درخت سیب
trees_apple_tooltip: |-
  یک درخت سیب به منوی پوشش گیاهی اضافه می‌کند. تصویر آن images/apple.png (به‌همراه apple_hover.png و apple_selected.png) در پوشهٔ ماژول است و می‌توانید برای تغییر آن جایگزینشان کنید.
trees_shrubs: بوته‌های بیشتر
trees_shrubs_tooltip: |-
  وقتی بوته‌ای که چهار رنگ دیگر دارد انتخاب شود، ردیفی بالای منوی پوشش گیاهی هر پنج رنگ آن را ارائه می‌دهد.
trees_felled: درختان قطع‌شده
trees_felled_tooltip: |-
  هنگام انتخاب یک درخت، ردیفی بالای منوی پوشش گیاهی همان درخت را ابتدا ایستاده و سپس قطع‌شده با هر تعداد کندهٔ ممکن نمایش می‌دهد (از ۹ تا ۱ برای درخت کامل؛ کوچک‌ترین درختان با ۱ کنده قطع می‌شوند). روی یکی کلیک کنید تا درخت قطع‌شده بکارید؛ برای بازگشت به درختان ایستاده روی درخت ایستاده، دوباره روی قطع‌شده یا روی درخت در منو کلیک کنید.
trees_random_mix: ترکیب‌های تصادفی در ردیف درختان
trees_random_mix_tooltip: |-
  دکمه‌هایی با علامت «?» به ردیف‌های بالای منوی پوشش گیاهی اضافه می‌کند:
  - درخت تصادفی (اولین در ردیف درختان قطع‌شده): ترکیب تصادفی همهٔ مراحل رشد از کوچک‌ترین تا مرحلهٔ قلم‌مو. برای کوچک‌ترین یا درختان خشکیده ارائه نمی‌شود.
  - درخت قطع‌شدهٔ تصادفی (آخرین در ردیف درختان قطع‌شده): درختان قطع‌شده با تعداد تصادفی کنده.
  - بوتهٔ تصادفی (آخرین در ردیف بوته‌ها): ترکیب تصادفی پنج رنگ بوته.
  برای توقف، دوباره کلیک کنید یا دکمهٔ دیگری را برگزینید.
trees_obstacles: کادر انتخاب برای درختان کنار موانع
trees_obstacles_tooltip: |-
  یک کادر انتخاب به ردیف بالای منوی پوشش گیاهی می‌افزاید. با تیک زدن آن، درختان را می‌توان درست کنار ساختمان‌ها، صخره‌ها، دیوارها و درختان دیگر قرار داد (بوته‌ها از قبل مجازند). برای دیدن وضعیتش نشانگر را رویش ببرید.
trees_rocks_and_water: کادر انتخاب برای پوشش گیاهی روی صخره و آب
trees_rocks_and_water_tooltip: |-
  کادر انتخابی در سمت راست منوی پوشش گیاهی، زیر کادر درختان کنار موانع (در ابتدا خاموش). با تیک زدن آن می‌توان درختان و بوته‌ها را روی باتلاق، رودخانه، گذرگاه آب، زمین صخره‌ای، تخته‌سنگ و شن‌ریزه نیز گذاشت.
trees_sorted_rows: مرتب‌سازی ردیف‌های منوی پوشش گیاهی
trees_sorted_rows_tooltip: |-
  بوتهٔ ردیف بالا را به ردیف پایین منتقل کرده و بوته‌های پایین را مرتب می‌کند، تا ردیف بالا شامل درختان (همراه درخت سیب و کادر انتخاب) و ردیف پایین شامل همهٔ بوته‌ها باشد.
trees_preview: پیش‌نمایش درخت
trees_preview_tooltip: |-
  هنگام انتخاب درخت یا بوته، درختی که قرار است کاشته شود در خانهٔ زیر ماوس با مرحلهٔ قلم‌مو (یا قطع‌شده با تعداد کندهٔ انتخابی) همان‌گونه که بازی رسمش می‌کند نشان داده می‌شود. در نمای دورنمایی‌شده نشان داده نمی‌شود.
trees_no_stacking: جلوگیری از انباشته شدن بوته‌ها
trees_no_stacking_tooltip: |-
  دیگر نمی‌توان درخت یا بوته‌ای را روی خانه‌ای که از قبل گیاه دارد گذاشت. برخی بوته‌ها (بوتهٔ ردیف بالا و چهار بوتهٔ هم‌دستهٔ آن) پیش‌تر به‌شکل نامرئی روی هم انباشته می‌شدند و برای همیشه سهمیهٔ درختان را مصرف می‌کردند. پاک‌کن اکنون همهٔ بوته‌های انباشته‌شده روی یک خانه را نیز پاک می‌کند.
textures_group: بافت‌های زمین
textures_group_descr: |-
  منوی بافت‌های ویرایشگر چشم‌انداز.
textures_gravel_and_iron: شن‌ریزه و آهن در منوی بافت‌ها
textures_gravel_and_iron_tooltip: |-
  شن‌ریزه را به ردیف بالا و آهن را به ردیف پایین اضافه کرده و هر دو ردیف را یکنواخت پخش می‌کند. تصویر شن‌ریزه images/gravel.png (همراه gravel_hover.png و gravel_selected.png) است.
textures_no_heights_iron: آهن فقط در منوی بافت‌ها
textures_no_heights_iron_tooltip: |-
  اکنون که منوی بافت‌ها دکمهٔ آهن دارد، دکمهٔ آهن را از منوی ارتفاعات حذف می‌کند.
textures_mask: دکمهٔ ماسک
textures_mask_tooltip: |-
  دکمهٔ ماسک (مربع نیمه‌پر) را در گوشهٔ بالا-چپ منوی ویرایشگر چشم‌انداز اضافه می‌کند. وقتی روشن باشد، ابزارهای طبیعی (ارتفاعات، بافت‌ها، آب، درختان و بوته‌ها، صخره‌ها و قطره‌چکان) تنها خانه‌هایی را تغییر می‌دهند که بافتی یکسان با اولین خانهٔ کلیک‌شده دارند؛ با رها کردن ماوس، کلیک بعدی بافت هدف را دوباره انتخاب می‌کند.
textures_mask_by_type: یکسان شمردن انواع آب در ماسک
textures_mask_by_type_tooltip: |-
  ماسک فقط خانه‌های هم‌بافت با خانهٔ کلیک‌شده را تغییر می‌دهد و هر بافت جداست (علف، بوته‌زار، بوته‌زار انبوه، سنگ، ساحل…). با روشن بودن این گزینه، حالت‌های مختلف هر نوع آب یکی حساب می‌شوند: کل دریا با لبه‌ها و عمقش، کل رودخانه با کف، موج‌ها و لبه‌های آبشار، و همهٔ گذرگاه‌های رود. دریا، رودخانه و گذرگاه همچنان جدا می‌مانند.
water_group: آب
water_group_descr: |-
  منوی آب در ویرایشگر چشم‌انداز.
water_decorations: کف و موج‌های کوچک
water_decorations_tooltip: |-
  دو تزئین رودخانه از ویرایشگر نخستین Stronghold را برمی‌گرداند که Crusader هنوز پشتیبانی می‌کند اما دکمه‌ای برایشان ندارد: کف (آب سفید و افشانه مانند پای آبشار، روی هر خانهٔ رودخانه زیر قلم‌مو) و موج‌های کوچک (روی تک‌خانهٔ رودخانه زیر ماوس). هر دو فقط روی رودخانه قرار می‌گیرند و در نقشه ذخیره می‌شوند.
water_foam_on_sea: کف روی دریا نیز مجاز باشد
water_foam_on_sea_tooltip: |-
  کف را می‌توان روی خانه‌های دریا نیز گذاشت که در این صورت به رودخانهٔ کف‌دار تبدیل می‌شوند (با روشن بودن گزینهٔ کف).
rocks_group: صخره‌ها
rocks_group_descr: |-
  منوی صخره‌های ویرایشگر چشم‌انداز.
rocks_signpost: تابلوی راهنما در منوی صخره‌های نقشه‌های نبرد آزاد
rocks_signpost_tooltip: |-
  نقشه‌های نبرد آزاد همان منوی صخره‌های نقشه‌های سناریو را همراه با دکمهٔ تابلوی راهنما دریافت می‌کنند.
rocks_random_preview: نمایش چرخش تصادفی در پیش‌نمایش
rocks_random_preview_tooltip: |-
  وقتی دکمهٔ چرخش تصادفی انتخاب است، بازی صخره را آن‌قدر سریع می‌چرخاند که پیش‌نمایش زیر ماوس نمی‌تواند دنبالش کند. با این گزینه، صخره هر ثانیه یک بار می‌چرخد و پیش‌نمایش دقیقاً همان صخره‌ای را نشان می‌دهد که قرار است بگذارید.
rocks_variants: ردیف گونه‌های صخره
rocks_variants_tooltip: |-
  ردیفی بالای منوی صخره‌ها چهار گونهٔ اندازهٔ صخرهٔ انتخاب‌شده را در همان جهت قرارگیری نشان می‌دهد. روی یکی کلیک کنید تا فقط همان گونه را بگذارید؛ دوباره رویش یا روی هر دکمهٔ منوی صخره‌ها کلیک کنید تا به حالت چرخش خودکار بازی برگردد.
rocks_extra_rock: صخرهٔ کوچک اضافی
rocks_extra_rock_tooltip: |-
  برای کوچک‌ترین صخره‌ها، ردیف گونه‌ها یک گزینهٔ پنجم نیز ارائه می‌دهد: صخرهٔ کوچکی که در بازی وجود دارد اما ویرایشگر هرگز قرار نمی‌دهد. مانند هر صخرهٔ دیگری در نقشه ذخیره می‌شود.
rocks_invisible: کادر انتخاب صخره‌های نامرئی
rocks_invisible_tooltip: |-
  کادر انتخابی در سمت راست دکمه‌های منوی صخره‌ها اضافه می‌کند. با تیک زدن آن، هر صخره‌ای که بگذارید بی‌نیاز از گذاشتن ۴۰۰۰ صخره بلافاصله «صخرهٔ نامرئی» می‌شود: خانه‌ها اشغال می‌شوند (نه ساخت‌وساز ممکن است و نه عبور) ولی صخره‌ای رسم نمی‌شود و ظاهر قبلی زمین باقی می‌ماند (ترفند «2k stones»). برای صخره‌های عادی تیک را بردارید.
rocks_erase_invisible: پاک‌کن صخره‌های نامرئی را نیز پاک کند
rocks_erase_invisible_tooltip: |-
  پاک‌کن چشم‌انداز (و ابزارهایی که با آن صخره پاک می‌کنند) خانه‌های صخره‌های نامرئی را هم مانند صخره‌های عادی آزاد می‌کند. بدون این گزینه، برای هر خانه نیاز به گذاشتن و پاک کردن بوتهٔ بی‌توجه به موانع بود.
rocks_remove_lost: دکمهٔ حذف صخره‌های گمشده
rocks_remove_lost_tooltip: |-
  دکمهٔ «حذف صخره‌های گمشده» را در پایین-راست منوی صخره‌ها اضافه می‌کند. صخره‌ای که ابزار بالا/پایین بردن شکسته و سپس همهٔ خانه‌هایش زیر بوته‌ها رفته، بدون هیچ خانه‌ای در فهرست صخره‌های نقشه باقی می‌ماند: دیده و پاک نمی‌شود اما یکی از ۴۰۰۰ جایگاه را اشغال می‌کند. این دکمه همهٔ آن‌ها را بدون تغییر خانه‌ها از فهرست پاک می‌کند.
heights_group: ارتفاعات
heights_group_descr: |-
  ابزارهای ارتفاع در ویرایشگر چشم‌انداز.
heights_max_height: دکمهٔ بیشینهٔ ارتفاع
heights_max_height_tooltip: |-
  ابزار «بیشینهٔ ارتفاع» از نخستین Stronghold را در سمت راست «کمینهٔ ارتفاع» در منوی ارتفاعات برمی‌گرداند: زمین زیر قلم‌مو را به ارتفاع ۱۵۶ می‌رساند. ابزار و تصاویر دکمه‌اش هنوز در Crusader موجود بود و تنها دکمه حذف شده بود.
heights_tool_options: گزینه‌های ابزارهای ارتفاع
heights_tool_options_tooltip: |-
  هنگام انتخاب ابزار ارتفاع، پنلی بالای منوی ارتفاعات (از پایین به بالا) این موارد را ارائه می‌دهد:
  - بازنشانی بافت زمین (در ابتدا خاموش): آیا ابزارهای ارتفاع زمین زیر خود را مانند بازی به ظاهر ساده (و فلات‌ها را به خاک) برگردانند یا نه. در حالت خاموش فقط ارتفاع تغییر می‌کند.
  - شکستن خانه‌های صخره (در ابتدا خاموش): آیا بالا بردن، پایین آوردن، هموارسازی، تپه و کوه صخره‌های لمس‌شده را مانند بازی بشکنند (خانه‌ها نامرئی و قابل عبور شوند). در حالت خاموش صخره‌ها سالم می‌مانند.
  - نادیده گرفتن آب و نادیده گرفتن زمین حاصل‌خیز (در ابتدا خاموش): خانه‌های دریا، رودخانه، گذرگاه، باتلاق و خندق یا بوته‌زار، بوته‌زار انبوه و علف واحه دست‌نخورده می‌مانند.
  - برای بالا بردن، پایین آوردن و هموارسازی: هم‌ترازی با بازه (در ابتدا روشن)، معکوس (فقط هموارسازی)، بازهٔ ارتفاع (در ابتدا ۸ تا ۱۵۶؛ هر دو سر قابل کشیدن) و شدت. با هم‌ترازی روشن، خانه‌های بیرون بازه مانند بازی وارد بازه می‌شوند؛ در حالت خاموش دست‌نخورده می‌مانند. معکوس باعث می‌شود هموارسازی به‌جای صاف کردن، زمین را ناهموار کند.
  - تغییر ارتفاع صخره (در ابتدا کل صخره): واکنش به صخرهٔ لمس‌شده. «فقط خانه» تنها خانه‌های زیر قلم‌مو را جابه‌جا می‌کند؛ «کل صخره» همهٔ خانه‌های صخره را هم‌اندازه حرکت می‌دهد؛ «پاک کردن صخره» آن را حذف می‌کند (مانند کمینهٔ ارتفاع).
  بازه، هم‌ترازی، معکوس و کادرهای نادیده گرفتن هنگام خروج از ویرایشگر نقشه به پیش‌فرض برمی‌گردند.
heights_invert_key_on: نگه داشتن کلید برای معکوس کردن هموارسازی
heights_invert_key_on_tooltip: |-
  هنگام انتخاب ابزار هموارسازی، تا وقتی این کلید را نگه دارید زمین را ناهموار می‌کند (مانند تیک خوردن «معکوس») و با رها کردن دوباره هموار می‌سازد.
heights_invert_key: کلید معکوس کردن هموارسازی
heights_invert_key_tooltip: |-
  کلیدی که برای معکوس کردن ابزار هموارسازی نگه داشته می‌شود.
castle_group: حالت قلعه
castle_group_descr: |-
  منوی ساخت‌وساز در حالت قلعهٔ ویرایشگر نقشه.
castle_building_counts: شمارندهٔ ساختمان‌ها بالای نقشهٔ کوچک
castle_building_counts_tooltip: |-
  بالای نقشهٔ کوچک تعداد کل ساختمان‌های نقشه در برابر سقف بازی (همه حساب می‌شوند، از جمله دژهای مرکزی، ساختمان‌های محیطی و اجزای ساختمان‌های چندبخشی)، مجموع ساختمان‌های همهٔ بازیکنان و ساختمان‌های بازیکن فعلی را نشان می‌دهد. ساختمان‌های بازیکن آن‌هایی هستند که دشمن می‌تواند نابود کند.
castle_tower_ruins: ویرانه‌های برج‌ها
castle_tower_ruins_tooltip: |-
  وقتی منوی برج‌ها باز است، ردیفی بالای آن ویرانه‌های هر پنج برج را ارائه می‌دهد.
castle_tunnel_and_tents: ورودی تونل و چادرهای محاصره
castle_tunnel_and_tents_tooltip: |-
  در منوی ساختمان‌های نظامی: با انتخاب صنف تونل‌کن‌ها، ردیفی بالای منو ورودی تونل و با انتخاب صنف مهندسان، شش چادر محاصره را ارائه می‌دهد.
castle_statues: مجسمه و معبدها
castle_statues_tooltip: |-
  مجسمهٔ ۲×۲، معبد ۲×۲ و معبد ۱×۱ استفاده‌نشده را اضافه می‌کند: در انتهای گونه‌های مجسمه و معبد (بنگرید به «گونه‌های ساختمان») یا اگر خاموش باشند، در ردیفی بالای منوی امکانات مثبت.
castle_barrier: مانع در منوی ویرانه‌ها
castle_barrier_tooltip: |-
  دکمهٔ مانع را در جای خالی پایین-راست منوی ویرانه‌ها می‌افزاید: یک مانع ۱×۱ که دوباره قابل حذف است.
castle_several_keeps: چند دژ مرکزی برای هر بازیکن
castle_several_keeps_tooltip: |-
  گذاشتن دژ مرکزی دیگر دژ قبلی بازیکن (و آتش اردوگاهش) را حذف نمی‌کند. جدیدترین دژ، دژ فعال بازیکن است و بقیه به‌عنوان ساختمان باقی می‌مانند.
castle_several_storage: چند ساختمان انبار و سربازگیری
castle_several_storage_tooltip: |-
  سربازخانه‌ها، اردوگاه‌های مزدوران، صنف‌ها و دیگر ساختمان‌هایی که هر بازیکن معمولاً فقط یکی دارد با گذاشتن نمونهٔ جدید حذف نمی‌شوند و انبارهای کالا، انبارهای غله و اسلحه‌خانه‌های بعدی نیازی به چسبیدن به اولی ندارند. هر تعداد از آن‌ها می‌تواند خالی بماند (بازی به‌طور عادی تنها ۸ انبار غله یا اسلحه‌خانهٔ خالی و ۳۲ انبار کالای خالی مجاز می‌داند).
castle_tower_engines: منجنیق‌ها و بالیستاهای برجی در همه‌جا
castle_tower_engines_tooltip: |-
  منجنیق برجی و بالیستای برجی در منوی ساختمان‌های نظامی را می‌توان هرجا که واحدی بتواند بایستد (زمین، دیوارها، دروازه‌ها، برج‌ها، دژ مرکزی) گذاشت، نه فقط روی برج‌های مربعی و گرد خود بازیکن: روی خانهٔ کلیک‌شده، یکی در هر خانه، تا ۴ عدد روی دژ مرکزی یا دروازهٔ بزرگ و ۸ عدد روی دژهای بزرگ. هرجا کلیک یکی قرار دهد پیش‌نمایش توپر است.
castle_keep_parts: دژ مرکزی بدون آتش اردوگاه یا انبار کالا
castle_keep_parts_tooltip: |-
  هنگام انتخاب یک دژ مرکزی، ردیفی بالای منوی دژها دو حالت دیگر ارائه می‌دهد: «فقط دژ» (دژ و ورودی، بدون محوطهٔ آتش و انبار کالا) و «بدون انبار کالا» (دژ، ورودی و محوطهٔ آتش). انتخاب دوبارهٔ دژ در منو دژ کامل را می‌گذارد.
  پیش‌نمایش و بررسی فضا فقط همان بخش‌ها را شامل می‌شود.
castle_hover_text: جابه‌جایی نام ساختمان‌ها به سمت چپ
castle_hover_text_tooltip: |-
  نام ساختمان زیر ماوس («دژ مرکزی بازیکن ۱») ۱۰۰ پیکسل به چپ می‌رود تا با شمارنده‌های ساختمان بالای نقشهٔ کوچک تداخل نکند.
castle_damaged_walls: دیوارها و پله‌های آسیب‌دیده
castle_damaged_walls_tooltip: |-
  هنگام انتخاب پله، دیوار کوتاه، دیوار بلند یا کنگره، ردیفی بالای منوی ساختمان‌های قلعه حالت «آسیب‌دیده» را ارائه می‌دهد: دیوارها با حفظ ارتفاع، بالای آسیب‌دیده می‌گیرند. انتخاب دوباره در منو دیوار سالم می‌گذارد.
castle_variant_panels: گونه‌های ساختمان
castle_variant_panels_tooltip: |-
  هنگام انتخاب باغچه، مجسمه، معبد یا چاه فاضلاب، ردیفی بالای منو همهٔ گونه‌های آن را نشان می‌دهد و گونهٔ انتخاب‌شده به‌جای تغییر در هر ثانیه ثابت می‌ماند. همین قابلیت برای کلبه بالای منوی شهر نیز وجود دارد. انتخاب ساختمان از خود منو به حالت بازی برمی‌گردد. قطره‌چکان هم گونهٔ دقیق را برمی‌دارد.
castle_ruined_cathedral: کلیسای جامع ویران
castle_ruined_cathedral_tooltip: |-
  هنگام انتخاب کلیسای جامع، ردیفی بالای منوی شهر حالت «ویران» را ارائه می‌دهد که تصویر تخریب‌شده‌ای است که بازی فقط در یک مأموریت تاریخی نشان می‌دهد. در بازی همچنان کلیسایی کامل و فعال است که فقط ظاهر ویران دارد. انتخاب دوباره از منو کلیسای سالم می‌گذارد و قطره‌چکان حالت ویران را می‌شناسد. نیازمند فایل اصلی tile_churches.gm1 است (نسخه‌های قدیمی‌تر تصویر ویران ندارند و کلیسا سالم می‌ماند).
castle_moat_kinds: خندق کنده‌شده، برنامه‌ریزی‌شده و دائمی
castle_moat_kinds_tooltip: |-
  هنگام انتخاب خندق در منوی دروازه‌ها، ردیفی بالای منو سه حالت ارائه می‌دهد: کنده‌شده (خندق معمول ویرایشگر)، برنامه‌ریزی‌شده (علامت‌گذاری‌شده برای کندن مانند داخل بازی) و دائمی (خندق کنده‌شده‌ای که هیچ‌کس در بازی نمی‌تواند پر یا حذفش کند). انتخاب از منو به خندق کنده‌شده برمی‌گردد.
castle_moat_on_marsh: خندق روی باتلاق
castle_moat_on_marsh_tooltip: |-
  در ویرایشگر نقشه دوباره می‌توان خندق را روی باتلاق گذاشت. باتلاق زیر آن می‌ماند و با پر شدن خندق دوباره پدیدار می‌شود.
castle_moat_removal_keeps_ground: حذف خندق بافت زمین را حفظ کند
castle_moat_removal_keeps_ground_tooltip: |-
  ابزار «حذف خندق» فقط خانه‌های دارای خندق کنده‌شده یا برنامه‌ریزی‌شده را تغییر می‌دهد: خندق را برمی‌دارد (ارتفاع عادی برمی‌گردد) و به بافت زمین دست نمی‌زند. بدون آن همهٔ خانه‌های زیر قلم‌مو به خاک ساده تبدیل می‌شدند.
herds_group: گله‌ها
herds_group_descr: |-
  حیوانات در ویرایشگر چشم‌انداز.
herds_panel: پنل گله‌ها
herds_panel_tooltip: |-
  هنگام انتخاب آهو، شیر، خرگوش یا شتر، پنلی بالای منوی حیوانات تعداد حیوانات هر گله (بخش ثابت به‌علاوهٔ بخش تصادفی) و نوع رفتار گروهی آن را نشان می‌دهد. کادر انتخابش اندازهٔ گله را تابع قلم‌مو می‌کند: ۲ × اندازهٔ قلم‌مو − ۱ حیوان (۱ تا ۱۳) بدون بخش تصادفی.
brushes_group: قلم‌موها
brushes_group_descr: |-
  قلم‌موهای ویرایشگر چشم‌انداز.
brushes_full_shape: قلم‌موها با شکل کامل
brushes_full_shape_tooltip: |-
  قلم‌موهای بازی خانهٔ زیر ماوس را دوبار می‌شمارند و خانهٔ گوشهٔ بالا-چپ شکل را در پیش‌نمایش و هنگام قرار دادن جا می‌اندازند. با این گزینه شکل کامل خود را دارند (فقط در ویرایشگر نقشه؛ کاربرد داخلی بازی تغییر نمی‌کند).
undo_group: واگرد و از نو
undo_group_descr: |-
  دکمه‌های واگرد و از نو در گوشهٔ بالا-چپ ویرایشگر نقشه.
undo_enabled: واگرد و از نو
undo_enabled_tooltip: |-
  دو دکمهٔ پیکانی در گوشهٔ بالا-چپ ویرایشگر نقشه: سمت چپ آخرین تغییر روی نقشه (قرار دادن، حذف، نقاشی، ارتفاعات) را برمی‌گرداند و سمت راست دوباره اعمالش می‌کند، تا ۲۰ مرحله. اگر کاری نباشد دکمه خاکستری است. هر کلیک یا هر کشیدن ممتد قلم‌مو یک مرحله است؛ کلیک‌های بی‌تغییر مرحله‌ای نمی‌سازند. بارگذاری نقشهٔ دیگر تاریخچه را از نو آغاز می‌کند.
pipette_group: قطره‌چکان
pipette_group_descr: |-
  قطره‌چکانی در ستون چپ ویرایشگر چشم‌انداز، بالای اندازهٔ قلم‌مو: ارتفاع و/یا بافت یک خانه را برمی‌دارد و به خانه‌های زیر قلم‌مو می‌دهد.
pipette_enabled: قطره‌چکان
pipette_enabled_tooltip: |-
  دکمهٔ قطره‌چکان را بالای اندازهٔ قلم‌مو اضافه می‌کند (اندازهٔ قلم‌مو، خط‌کش و پاک‌کن کمی پایین‌تر می‌روند).
  با انتخابش ردیفی بالای منو ظاهر می‌شود — ارتفاعات، بافت‌ها، اشیاء، همه — و بالای آن محتوای فعلی قطره‌چکان. روی خانه‌ای کلیک کنید تا برداشته شود (یک خانه نشان می‌دهد)، سپس کلیک یا درگ کنید تا روی خانه‌های زیر قلم‌مو اعمال شود. ارتفاعات به بافت و بافت‌ها به ارتفاع دست نمی‌زنند. اشیاء ساختمان، دیوار، درخت یا صخرهٔ خانه را برمی‌دارد: ساختمان‌ها و دیوارها مانند دکمهٔ خودشان برای همان بازیکن قرار می‌گیرند (سپرش انتخاب می‌شود)، و درختان (همان نوع و مرحله یا قطع‌شده با همان کنده‌ها) و صخره‌ها (همان نوع و چرخش) مانند ابزار خودشان همراه با درگ. «همه» درخت یا صخرهٔ ۱×۱ را هم برداشته روی هر خانهٔ زیر قلم‌مو می‌گذارد. انتخاب دوبارهٔ قطره‌چکان یا یکی از حالت‌هایش آن را خالی می‌کند.
  ارتفاع روی دریا، ساحل، باتلاق، خندق، صخره، دیوار یا ساختمان اعمال نمی‌شود و بافت روی صخره، دیوار یا ساختمان. صخره‌های پرتگاهی روی لبه‌های تند پاک شده و در لبه‌های همچنان تند دوباره ساخته می‌شوند. واگرد برای قطره‌چکان هم کار می‌کند.
pipette_select_key_on: کلید قطره‌چکان
pipette_select_key_on_tooltip: |-
  کلیدی که قطره‌چکان را انتخاب (و خالی) می‌کند. فشردن دوبارهٔ آن هنگام انتخاب بودن قطره‌چکان به حالت بعدی می‌رود: ارتفاعات، بافت‌ها، اشیاء، همه.
pipette_select_key: کلید انتخاب قطره‌چکان
pipette_select_key_tooltip: |-
  کلیدی که قطره‌چکان را در ویرایشگر نقشه انتخاب می‌کند. کارکرد معمول خودش را نیز حفظ می‌کند.
pipette_read_key_on: نگه داشتن برای نمونه‌برداری از خانه
pipette_read_key_on_tooltip: |-
  تا وقتی این کلید را نگه دارید، قطره‌چکانِ پر دوباره از خانه نمونه می‌گیرد (نمونهٔ قبلی تا لحظهٔ کلیک می‌ماند). رها کنید تا دوباره اعمال کند.
pipette_read_key: کلید نمونه‌برداری از خانه
pipette_read_key_tooltip: |-
  کلیدی که هنگام پر بودن قطره‌چکان برای نمونه‌برداری جدید نگه داشته می‌شود.
pipette_any_tile_key_on: نگه داشتن برای اعمال روی هر خانه
pipette_any_tile_key_on_tooltip: |-
  آزمایشی: تا وقتی این کلید را نگه دارید، قطره‌چکان ارتفاع و بافت را به همهٔ خانه‌های زیر قلم‌مو از جمله دریا، باتلاق، صخره‌ها (باقی می‌مانند)، دیوارها و ساختمان‌ها می‌دهد (هرگز لبهٔ نقشه). محل مجاز اشیاء را تغییر نمی‌دهد.
pipette_any_tile_key: کلید اعمال روی هر خانه
pipette_any_tile_key_tooltip: |-
  کلیدی که با نگه داشتنش قطره‌چکان چیزهای روی خانه را نادیده می‌گیرد.
