menu_group: رفتار ویرایشگر
menu_group_descr: نمایش و بازترسیم ویرایشگر را کنترل می‌کند.
menu_compass: نمایش جهت شمال در ویرایشگر
menu_compass_tooltip: شمال را از قطب‌نمای ثابت بالا سمت چپ (در صورت فعال بودن واگرد و از نو، زیر آن‌ها) بخوانید.
menu_compass_turn: Ctrl جهت چرخش نقشه را برعکس کند
menu_compass_turn_tooltip: حلقهٔ کلیک راست را باز کرده و هنگام رفتن روی قطب‌نمای آن، Ctrl را نگه دارید تا پادساعتگرد بچرخد.
menu_dust_clouds: جلوگیری از کرش ابرهای گردوغبار
menu_dust_clouds_tooltip: هنگام ویرایش نقشه از کرش‌های ناشی از ابرهای گردوغبار جلوگیری می‌کند.
menu_always_update: به‌روزرسانی پیوستهٔ پنل ویرایشگر هنگام کار
menu_always_update_tooltip: هنگام قرار داشتن نشانگر روی نقشه، کنترل‌های ویرایشگر را به‌روز نگه می‌دارد.
castle_all_players: نمایش سپر هر هشت بازیکن
castle_all_players_tooltip: در حالت قلعه هر یک از هشت سپر کنار نقشهٔ کوچک را انتخاب کنید.
castle_all_keeps: عمارت و دژ مستحکم در همهٔ نقشه‌ها
castle_all_keeps_tooltip: در هر نوع نقشه، عمارت یا دژ مستحکم را از بخش دژها انتخاب کنید.
castle_player_zero: نمایش سپر بازیکن خنثی
castle_player_zero_tooltip: برای قرار دادن اشیای بازیکن 0، روی نهمین سپر سفید کنار نقشهٔ کوچک کلیک کنید.
castle_keep_ground: حفظ زمین هنگام قرار دادن دژ مرکزی
castle_keep_ground_tooltip: دژها را بدون هموار کردن زمین زیرشان قرار می‌دهد.
castle_rotation: فهرست چرخش ساختمان‌ها
castle_rotation_tooltip: در حالت قلعه، دقیقاً بالای منوی پایین سمت چپ روی «Rotation» کلیک کرده و پیش از قرار دادن ساختمان پشتیبانی‌شده، زاویه‌ای برگزینید.
castle_unit_colour: انتخاب رنگ واحد جدا از مالکیت
castle_unit_colour_tooltip: برای تغییر ظاهر واحد، نشانی بالای منوی واحدهای اروپایی یا عرب برگزینید.
castle_keep_crests: انتخاب دژ فعال از روی نشان آن
castle_keep_crests_tooltip: با فعال بودن چند دژ، برای انتخاب یا لغو دژ فعال روی یک نشان کلیک کنید. راهنمای شناور به‌طور پیش‌فرض روشن است.
castle_wall_tools: ارتفاع دیوارها و کنگره‌های مستقل
castle_wall_tools_tooltip: دیوار یا پله را انتخاب کرده و از کنترل‌های بالای منو استفاده کنید. برای بازگردانی تنظیمات روی «Reset» کنارش بزنید.
trees_spread_order: گروه‌بندی درختان بر پایهٔ زمین گسترش
trees_spread_order_tooltip: درختان را در پوشش گیاهی بر اساس زمینی که در آن می‌رویند گروه‌بندی می‌کند. بوته‌ها به‌طور پیش‌فرض ردیف جدا دارند.
trees_spread_outlines: نشانه‌گذاری زمین گسترش درختان
trees_spread_outlines_tooltip: در پوشش گیاهی، سبز نشانهٔ درختان زمین حاصل‌خیز و بژ نشانهٔ درختان زمین غیرحاصل‌خیز است.
herds_bird_bins: حذف همهٔ کلاغ‌ها یا مرغ‌های دریایی
herds_bird_bins_tooltip: در حیوانات، روی سطل زباله کنار نماد کلاغ یا مرغ دریایی کلیک کنید تا آن نوع پرنده حذف شود.
herds_group_warning: هشدار در نزدیکی سقف گله‌ها
herds_group_warning_tooltip: هنگام نزدیک شدن گله‌ها و گروه‌های نیرو به سقف نقشه، جایگاه‌های باقی‌مانده را نشان می‌دهد.
eraser_choice: انتخاب موارد قابل حذف با پاک‌کن
eraser_choice_tooltip: پاک‌کن را انتخاب کرده و سپس بالای منو همه، حیوانات، واحدها، ساختمان‌ها، پوشش گیاهی یا صخره‌ها را برگزینید.
eraser_seagulls: پاک کردن مرغ‌های دریایی در حال پرواز
eraser_seagulls_tooltip: برای حذف مرغ‌های دریایی در حال پرواز از پاک‌کن استفاده کنید. در صورت فعال بودن حالت‌های پاک‌کن، حیوانات یا همه را برگزینید.
