  در دسترس نیستند.'
grid_group_descr: شبکه منابع ۵×۵ هوش مصنوعی، مرزهای چرخش قلعه و جای معدن آهن که روی نقشه رسم می‌شوند.
  Alt به‌همراه کلید انتخابی آن را در ویرایشگر نقشه نمایش یا پنهان می‌کند.
